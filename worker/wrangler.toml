name = "dungeon-raid-rec"
main = "src/index.js"
compatibility_date = "2026-06-01"

# 自定义域名：API 走 api.dungeonraid.win（绑定时自动建代理DNS+证书）
[[routes]]
pattern = "api.dungeonraid.win"
custom_domain = true

# 定时任务：每日 18:13 UTC 自动清理旧版本+陈旧录像（scheduled() → pruneOld）
[triggers]
crons = ["13 18 * * *"]

# KV：存录像
[[kv_namespaces]]
binding = "REC"
id = "4120eb6aa18944e7892d9607bc5cfb06"

# D1：排行榜分数。database_id 在 `wrangler d1 create dungeon-raid-scores` 后填入。
# schema 变更走迁移框架：migrations/ 下放 NNNN_*.sql，`wrangler d1 migrations apply dungeon-raid-scores --remote` 按 d1_migrations 记录只跑没跑过的。
[[d1_databases]]
binding = "DB"
database_name = "dungeon-raid-scores"
database_id = "eea75d9c-bce5-433a-81a5-10c946a664fd"
migrations_dir = "migrations"

# 注：验证密钥 VERIFY_SECRET 用 `wrangler secret put VERIFY_SECRET` 设置（不写在此文件）

# 限流：写入类端点（/rec /score /clear）按来源 IP 限速，挡刷榜/批量伪造。period 仅支持 10 或 60 秒。
[[unsafe.bindings]]
name = "WRITE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
