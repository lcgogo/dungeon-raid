  [['coin','💰 '+tr('金币','Coin')],['shield','🔰 '+tr('盾','Shield')],['heart','💗 '+tr('心','Heart')],['sword','⚔️ '+tr('剑','Sword')],['enemy','👹 '+tr('怪物','Enemy')]].forEach(([type,label])=>{

function activateSkill(){
  if(busy||pendingLevels) return;
  prophecySlotKey=null;
  const sk=player&&player.tier1&&TIER1[player.tier1]&&TIER1[player.tier1].skill; if(!sk) return;  // 一阶职业的主动
  if(player.frozen && player.frozen.skill>0) return;   // 雪人冰封了一阶主动
  if(player.skillCd>0) return;
  const r=sk.f(player);
  if(r===false) return;        // 技能判定无效（如锻甲场上没护甲）：不进冷却、不刷日志
  if(r==='__defer__') return;  // 先知：等待弹框选择具体类型，提交后再进冷却/录像
  if(!sk.noCd) player.skillCd=effSkillCd(player.tier1);   // 无冷却技能（收买）不进冷却，有钱即可反复用

  if(r===undefined) log(tr(`✨ 【${L(sk.name)}】发动！`,`✨ ${L(sk.name)} activated!`), 'buff'); // 技能没自带日志才用通用日志

//==================== 核心结算 ====================
function resolve(){
  const type=selection[0].type;
  recAct(['m', selection.map(s=>[s.r,s.c]), type]);   // 录制连线（改动棋盘前）
  let msg='', mk=''; // 经验只来自击杀（在 dealDamage 里 +3）；mk=日志颜色类型（''白=攻击/heal绿/buff蓝/bad红/debuff黄）

  if(type==='sword'){
    const swords=selection.filter(s=>{const t=grid[s.r][s.c]; return t&&t.type==='sword';});
    const targets=selection.filter(s=>isSwordTarget(grid[s.r][s.c]));
    const nS=swords.length;
    swords.forEach(s=>grid[s.r][s.c]=null);
    const combo=1+Math.max(0,nS-2)*0.15*(player.comboMult||1);   // 多连奖励（精灵翻倍）
    const flat=currentSwordFlat();  // 巨力 + 盾击(护甲减伤量→固定剑伤)
    let pool=(nS*player.weaponPower+flat)*combo*(player.swordMult||1);
    if(player.lowHpDmg) pool*=1+(1-player.hp/player.maxHp)*0.6;  // 狂战：越缺血越猛（最高+60%）
    pool=Math.floor(pool);
    if(targets.length && nS>0) pool=Math.max(1, pool);   // 矮人 ×0.85 等减伤仍按 floor；但合法武器攻击至少造成 1 点伤害，避免一锤打出 0 伤
    let dmg=0, kills=0, bonusGold=0;
    if(targets.length){ ({dmg,kills,bonusGold}=dealDamage(pool, targets)); }
    const ignited = fireChainIgnite(selection);
    const lifeHeal=lifestealHeal(kills);   // 汲取生命：每杀一只回血（含溅射击杀，kills 已含）
    let blood=0;
    if(player.bloodthirst && targets.length){ blood=vampGain(targets.length*3); player.bloodthirst=0; } // 斗士嗜血（血狂时溢出转上限）
    const comboTxt=combo>1?tr(` 连击×${combo.toFixed(2)}`,` combo×${combo.toFixed(2)}`):'';
    msg=`${wE()}×${nS}${comboTxt}` + (targets.length
      ? tr(` 直击 ${targets.length} 只怪 → ${dmg} 伤害`,` hit ${targets.length} → ${dmg} dmg`) + (kills?tr(`，击杀 ${kills} 只👹`,`, ${kills} killed`):'') + (bonusGold?tr(`，妙手空空 +${bonusGold} 金`,`，Empty Pockets +${bonusGold} gold`):'') + (ignited?tr(`，点燃 ${ignited} 个目标`,`，ignited ${ignited}`):'') + (lifeHeal?tr(`，吸血 +${lifeHeal}`,`, +${lifeHeal} lifesteal`):'') + (blood?tr(`，回血 ${blood}`,`, +${blood} HP`):'')
      : tr('（未串到怪）','(no enemy hit)'));
  } else {
    const count=selection.length;
    const poisonHeart = type==='heart' && pollutionActive();   // 污染怪在场：心是毒心，连之扣血
    const blackN = type==='heart' ? selection.filter(s=>{ const t=grid[s.r][s.c]; return t&&t.poison; }).length : 0;   // 黑毒心数量（万物皆毒）
    selection.forEach(s=>{ grid[s.r][s.c]=null; });
    const combo=1+Math.max(0,count-2)*0.15;            // 多连奖励：每超出2个 +15%
    const comboTxt=combo>1?tr(` 连击×${combo.toFixed(2)}`,` combo×${combo.toFixed(2)}`):'';
    const d=DEF[type];
    if(type==='shield'){ mk='buff';
      if(player.noArmor){ msg=`${d.emoji}×${count}${comboTxt} → `+tr('无甲：护甲无效','No Armor: shields do nothing'); }
      else { player.shieldXp += Math.round(count*player.armorPerShield*(player.armorPerShieldMult||1)*combo);
        let gained=0; while(player.shieldXp>=armorNeeded(player.armor)){ player.shieldXp-=armorNeeded(player.armor); player.armor++; gained++; }
        msg=`${d.emoji}×${count}${comboTxt} → `+tr(`护甲进度 ${player.shieldXp}/${armorNeeded(player.armor)}`,`Armor XP ${player.shieldXp}/${armorNeeded(player.armor)}`)+(gained?tr(`，护甲 +${gained}！（减伤 ${player.armor}）`,`, armor +${gained}! (DR ${player.armor})`):''); } }
    else if(type==='heart'){
      const per=player.healPerHeart*combo;
      if(poisonHeart){ const dd=hurtPlayer(Math.round(count*per),'pollution',true);   // 污染怪毒心：连之不回血，反而按等量扣血（无视护甲），黑毒心也被污染光环盖过
        mk='bad'; msg=`💚×${count}${comboTxt} → `+tr(`毒心反噬 −${dd} 生命！`,`poison hearts: −${dd} HP!`); }
      else {
        const hex=player.heartPoison; player.heartPoison=false;   // 蛊毒：本回合红心也算毒
        const redN=count-blackN, poisonN=blackN+(hex?redN:0), healN=hex?0:redN;   // 黑毒心 + 蛊毒下的红心 → 放毒；其余红心 → 回血
        const parts=[];
        if(poisonN>0){ const r=dealDamage(Math.round(poisonN*per), null, true); const lh=lifestealHeal(r.kills); applyGravity(); syncPositions(false);   // allFoes：毒灌全场怪含剑免疫 Boss
          parts.push(tr(`🧪 毒全场 ${r.dmg}`+(r.kills?`、击杀 ${r.kills}`:'')+(lh?`、吸血 +${lh}`:''),`🧪 ${r.dmg} poison to all`+(r.kills?`, ${r.kills} killed`:'')+(lh?`, +${lh} lifesteal`:''))); }
        if(healN>0){ const h=gainHeal(Math.round(healN*per)); parts.push(tr(`回复 ${h} 生命`,`+${h} HP`)); }
        mk = poisonN>0 ? '' : 'heal';   // 连黑/蛊毒心毒怪=攻击(白)，纯回血=绿
        msg=`${blackN?'🖤':d.emoji}×${count}${comboTxt} → `+(parts.join(tr('，',', '))||tr('（无效果）','(no effect)')); } }
    else if(type==='coin'){ mk='buff'; const g=Math.round(count*player.goldPerCoin*combo);
      gainGold(g);
      msg=`${d.emoji}×${count}${comboTxt} → `+(player.goldLock>0
        ? tr(`囤金中，冻结 +${g}`,`hoarding, frozen +${g}`)
        : tr(`获得 ${g} 金币`,`+${g} gold`)); }
  }
  log(msg, mk);
  if(player.fireChainTurn) player.fireChainTurn=false;   // 火焰链仅本回合（若本回合没划到怪，也在结算后失效）
  if(player.pierceTurn) player.pierceTurn=false;   // 斗士嗜血穿透仅本回合
  if(player.heartPoison) player.heartPoison=false; // 巫医蛊毒仅本回合（未连心则失效）
  if(player.rogueStealTurn) player.rogueStealTurn=false; // 妙手空空仅本回合（没打到也会失效）

  // 回合推进：怪物倒计时 / 攻击
  player.turns++;
  if(typeof player.shopCd==='object') for(const k in player.shopCd){ if(player.shopCd[k]>0) player.shopCd[k]--; } // 各商品冷却递减
  if(player.skillCd>0) player.skillCd--; // 技能冷却递减
  if(player.skill2Cd>0) player.skill2Cd--; // 换装主动冷却递减
  if(player.frozen) for(const k in player.frozen){ if(player.frozen[k]>0) player.frozen[k]--; }   // 雪人冰封倒数解冻
  if(player.goldLock>0){ player.goldLock--; if(player.goldLock===0){ const pay=Math.round(player.goldFrozen*2.5); player.gold+=pay; player.goldFrozen=0; log(tr(`🔓 囤金到期：返还 ${pay} 金币`,`🔓 Hoard matured: +${pay} gold`), 'buff'); } } // 守财奴囤金到期（2.5 倍）
  if(player.deathCoil>0){ deathCoilTick(); player.deathCoil--; }   // 蔓藤缠绕：未来 3 回合每回合全场怪流失 30% 最大生命
  burnTick();   // 火焰链：已点燃目标每回合持续灼烧，直到死亡
  firewallTick();   // 火墙：底部三行的怪物每回合掉当前固定伤害 20%
  advanceEnemies();
  if(player.cleared) return;   // 终焉第10波撑过 → onClear 已结算，停止后续处理
  if(player.regen){ const aura=Math.max(0, Math.round(player.regen*((player.healMult!=null)?player.healMult:1))); const _h=gainHeal(player.regen); if(_h>0) log(tr(`💗 恢复 +${_h}（每回合）`,`💗 Regen +${_h} HP`), 'heal'); if(player.witherAura && aura>0){ const self= hurtPlayer(aura, 'witheraura', true); if(self>0) log(tr(`🪦 竭心光环：失去 ${self} 生命`,`🪦 Wither Aura: lose ${self} HP`), 'bad'); witherAuraTick(aura); } }
  if(player.turns===500 && !player.finaleStarted){ player.finaleStarted=true; player.finaleWave=0; spawnFinale(); }  // 第500回合：终局降临
  if(!player.finaleStarted){
    if(player.turns % 10 === 0) player.bossDue=true;          // 每 10 回合：该来 Boss
    if(player.bossDue && player.doubleBoss){ const id1=spawnBoss(true); spawnBoss(true, id1); player.bossDue=false; }   // 350 后：每 10 回合强制降临 2 个不同 Boss
    else if(player.bossDue){ spawnBoss(true); player.bossDue=false; }  // 每 10 回合必降临 Boss（即便场上已有）——防「囤一只早期弱 Boss 压制后续强 Boss、轻松到里程碑晋级」
  }

  applyGravity();
  syncPositions(false);
  // 二阶被动：每回合棋盘摆完后转 3 个棋子（万物皆毒→黑毒心，污染怪变化之后；皆可为剑→剑）
  if(player.poisonConvert){ if(convertTiles(3,'heart',['sword','shield','coin'], t=>{t.poison=true;})) syncPositions(false); }
  if(player.swordConvert){ if(convertTiles(3,'sword',['shield','heart','coin'])) syncPositions(false); }
  if(player.bloodFrenzy){ const bf=hurtPlayer(Math.max(1, Math.floor(player.maxHp*0.05)), 'bloodfrenzy', true); if(bf>0) log(tr(`🩸 血狂反噬：损失 ${bf} 生命`,`🩸 Blood Frenzy backlash: lose ${bf} HP`), 'bad'); }
  if(player.hp<=0){ updateHUD(); gameOver(); return; }
  checkLevel();
  updateHUD();
  if(player.hp<=0){ gameOver(); return; }
  if(player.t1Pending){ player.t1Pending=false; showTierSelect(1); return; }   // 击败50回合Boss → 选一阶
  if(player.t2Pending){ player.t2Pending=false; showTierSelect(2); return; }   // 击败100回合Boss → 选二阶
  if(player.t3Pending){ player.t3Pending=false; showTierSelect(3); return; }   // 击败200回合Boss → 第二被动
  if(player.t4Pending){ player.t4Pending=false; showSkillSwap(); return; }     // 击败350回合Boss → 主动换装
  if(pendingLevels){ showLevelUp(); return; }
  checkDeadlock();   // 无弹层待处理时：棋盘塞满怪、无棋可连且无就绪改盘动作 → 判负（含终局被Boss淹没）
}

// 治疗：返回实际回复的生命（超出上限的部分丢弃）
function gainHeal(amount){
  if(player.healMult!=null && player.healMult!==1) amount=Math.round(amount*player.healMult);   // 活死人：一切治疗减半（重生满血走 hp=maxHp，不经此处）
  const space=player.maxHp-player.hp;
  if(amount<=space){ player.hp+=amount; return amount; }
  player.hp+=space; const over=amount-space;
  if(player.holyStrike && over>0) holyStrikeDamage(over); // 神圣打击：溢出的治疗化为对随机敌人的攻击
  return space;
}
// 神圣打击（牧师二阶被动）：把溢出的治疗当伤害优先砸向 Boss；多 Boss 取最低血（排除终焉之主）
function holyStrikeDamage(amt){
  let bossT=null, bossR=-1, bossC=-1, bossHP=Infinity, t=null, tr_=-1, tc=-1, best=-1;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const g=grid[r][c]; if(!g||g.finale) continue;
    if(g.type==='boss'){ if(g.hp<bossHP){ bossT=g; bossHP=g.hp; bossR=r; bossC=c; } }
    else if(g.type==='enemy' && g.hp>best){ t=g; best=g.hp; tr_=r; tc=c; }
  }
  if(bossT){ t=bossT; tr_=bossR; tc=bossC; }
  if(!t) return;
  const isBoss=t.type==='boss', name=isBoss?L(bossDef(t).name):tr('普通怪','enemy'), before=t.hp, dealt=Math.min(amt,before);
  addBombFx(tr_,tc);
  t.hp-=amt;
  if(t.hp<=0){ grid[tr_][tc]=null; if(isBoss){ thiefRecover(t); player.xp+=15; gainGold(20); onBossKilled(); } else { player.xp+=3+(player.killXp||0); gainGold(1); } }
  log(tr(`✨ 神圣打击：优先命中 ${name}，造成 ${dealt} 伤害`+(t.hp<=0?`，击杀！`:''),`✨ Holy Strike: hit ${name} first for ${dealt} dmg`+(t.hp<=0?`, killed!`:'')));
}

function dealDamage(pool, targets, allFoes){
  let dmg=0, kills=0, bonusGold=0;
  const list=[];
  const seen=new Set();
  // allFoes=true：命中全场怪含【剑免疫 Boss】（蛊毒/黑毒心「灌给全场怪」，与炸弹/吸魂一致，仅排除终焉之主）；否则只命中可剑攻击目标
  const hits = t => allFoes ? (t && (t.type==='enemy' || (t.type==='boss' && !t.finale))) : isSwordTarget(t);
  if(targets){ targets.forEach(s=>{ const t=grid[s.r][s.c], key=`${s.r},${s.c}`;
    if(hits(t) && !seen.has(key)){ seen.add(key); list.push({r:s.r,c:s.c,t}); } }); }
  else { for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c];
    if(hits(t)) list.push({r,c,t}); } }   // 全场型（箭雨：allFoes 缺省→只可剑攻击 / 蛊毒·黑毒心：allFoes→含剑免疫）
  // 原版算法：剑链伤害对每只目标【独立、全额】生效，不共享、不分配
  const splashes=[];
  for(const e of list){
    const before=e.t.hp;
    if(player.rogueStealTurn && !allFoes && targets) bonusGold += Math.max(1, Math.floor(before*0.2));
    const hit=Math.min(pool, before);
    e.t.hp-=hit; dmg+=hit;
    statueReflect(e.t, hit);   // 石像：等量真实伤害反弹给玩家
    if(e.t.hp<=0){ grid[e.r][e.c]=null; kills++;
      if(e.t.type==='boss'){ thiefRecover(e.t); player.xp+=15; gainGold(20); onBossKilled(); }  // 剑杀 Boss：厚赏 + 可能触发转职
      else { player.xp+=3+(player.killXp||0); gainGold(1); if(player.rotflesh) player.maxHp++; }   // 神射手：击杀额外经验；屠夫·积累腐肉：+1 生命上限
      if(player.splash && pool>before) splashes.push(pool-before);   // 溅射：本次击杀的溢出留待砸向其它敌人
    }
  }
  if(bonusGold>0) gainGold(bonusGold);
  // 溅射（骷髅王被动）：每份溢出随机砸到棋盘上剩余的一个敌人/Boss（含剑免疫，排除终焉之主）
  for(const over of splashes){ const r=splashHit(over); dmg+=r.dmg; kills+=r.kills; }
  return {dmg,kills,bonusGold};
}
// 溅射落点：随机选一个剩余敌人/Boss（含剑免疫，排除终焉之主），造成 over 伤害
function splashHit(over){
  const foes=[]; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(t&&(t.type==='enemy'||(t.type==='boss'&&!t.finale))) foes.push([r,c]); }
  if(!foes.length) return {dmg:0,kills:0};
  const [r,c]=foes[Math.floor(rnd()*foes.length)]; const t=grid[r][c];
  const hit=Math.min(over,t.hp); t.hp-=hit; statueReflect(t, hit); let kills=0;
  if(t.hp<=0){ const isB=t.type==='boss'; grid[r][c]=null; kills=1; if(isB){thiefRecover(t);player.xp+=15;gainGold(20);onBossKilled();} else {player.xp+=3+(player.killXp||0);gainGold(1);if(player.rotflesh)player.maxHp++;} }   // 屠夫·积累腐肉：溅射击杀也 +1 上限
  return {dmg:hit, kills};
}

function advanceEnemies(){
  player.dmgBy={}; player.deathMode='damage';   // 死亡报告只统计死亡那一回合的伤害；若本回合改为死局判负，checkDeadlock 会把 deathMode 改成 deadlock
  // 先快照本回合的行动者：终焉浪潮在 act 中途生成的新 Boss 不应在同一回合再行动一次
  const actors=[];
  const enemyHits=[]; let enemyTotal=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c];
    if(t && (t.type==='enemy' || t.type==='boss')) actors.push({r,c,t}); }
  for(const actor of actors){
    let {r,c,t}=actor;
    if(player.cleared) break;          // 破关已结算（终焉第10波）：停止其余 Boss 行动
    if(grid[r][c]!==t){
      const pos=findTilePos(t);        // 允许行动者先被别的效果换位（如多只鸟人互换）后，仍按自身当前所在格继续行动一次
      if(!pos) continue;               // 已被本回合其它效果移除/替换（如小偷逃走）→ 跳过
      r=pos.r; c=pos.c;
    }
    const def = t.type==='boss' ? bossDef(t) : null;
    if(def && def.perTurn){ def.act(t); continue; }    // 纯每回合型（小丑/吸血鬼）：无倒计时
    let acted=false;
    t.cd--;
    if(t.cd<=0){
      if(def && def.flee){
        log(tr(`🦹 小偷逃走了！${t.stolen?`你永久失去了 ${t.stolen} 金币。`:''}`,`🦹 The Thief escapes!${t.stolen?` ${t.stolen} gold lost forever.`:''}`), 'debuff');
        grid[r][c]=null; continue;
      } else if(def && def.cdAttack){
        def.cdAttack(t); acted=true;   // 自定义倒计时攻击（饕餮：先按当前血量50%出手）
        if(grid[r][c]!==t) continue;   // cdAttack 可能已被荆棘/冰甲等连锁移除
      } else if(def && def.act){
        def.act(t);   // 特殊 Boss（如小丑）：执行特效，不直接掉血（act 内部自带日志）
      } else if(def && def.trueDmg){
        const dmg=hurtPlayer(t.atk, def.id, true, t);   // 真实伤害：无视护甲（但圣盾仍可挡）
        log(tr(`${def.emoji} ${L(def.name)} 真实伤害 ${dmg}（无视护甲）！`,`${def.emoji} ${L(def.name)} hits for ${dmg} TRUE damage (ignores armor)!`), 'bad');
      } else {
        const dmg=hurtPlayer(t.atk, def?def.id:'enemy', false, t);
        if(def) log(tr(`${def.emoji} Boss 重击 ${t.atk} → 掉 ${dmg} 血！`,`${def.emoji} Boss strike ${t.atk} → ${dmg} HP lost!`), 'bad');
        else if(dmg>0){ enemyHits.push(dmg); enemyTotal+=dmg; }
      }
      t.cd=t.baseCd;
    }
    if(def && def.everyTurn && (!def.cdAttack || acted || t.cd>0)) def.everyTurn(t);   // 饕餮类：cd 到 0 的回合先出手再吞怪；其余回合仍照常每回合生效
  }
  if(enemyHits.length){
    const detail=enemyHits.join(' + ');
    log(tr(`👹 ${enemyHits.length} 只普通怪攻击：${detail} → 共掉 ${enemyTotal} 血！`,`👹 ${enemyHits.length} normal enemies attack: ${detail} → ${enemyTotal} HP lost!`), 'bad');
  }
  if(player.shieldTurn) player.shieldTurn=false;   // 圣盾仅护本回合
  if(player.undyingTurn) player.undyingTurn=false; // 狂怒不屈仅本回合
  if(player.rebirthTurn) player.rebirthTurn=false; // 骷髅王重生仅护本回合（未触发则失效）
  if(player.tauntWindow) player.tauntWindow=false; // 斧王嘲讽：只覆盖被拉成 cd=1 的这一轮敌人动作
}
function reflectIceArmor(amt, atkr){
  let r=-1,c=-1,t=null;
  if(atkr && (atkr.type==='enemy'||(atkr.type==='boss'&&!atkr.finale))){
    for(let rr=0;rr<ROWS&&!t;rr++)for(let cc=0;cc<COLS;cc++){ if(grid[rr][cc]===atkr){ r=rr;c=cc;t=atkr;break; } }
  }
  if(!t) return;
  const hit=Math.min(amt,t.hp); t.hp-=hit; t.cd+=1; t.frostTurns=2; t.flashWhite=2; let lh=0;
  if(t.hp<=0){ const isB=t.type==='boss'; grid[r][c]=null; if(isB){ thiefRecover(t); player.xp+=15; gainGold(20); onBossKilled(); } else { player.xp+=3+(player.killXp||0); gainGold(1); } lh=lifestealHeal(1); }
  log(tr(`🧊 冰甲反弹 ${hit} 伤害，并让攻击者更慢出手`+(lh?`，吸血 +${lh}`:''),`🧊 Ice Armor reflects ${hit} damage and slows the attacker`+(lh?`, +${lh} lifesteal`:'')), 'buff');
}
// 玩家受伤的统一入口：圣盾免伤 / 狂怒不屈保命 / 矮人护甲翻倍 / 荆棘反弹 / 伤害统计
function hurtPlayer(atk, sourceKey, ignoreArmor, attacker){
  if(player.shieldTurn) return 0;
  const armorReducer = player.armor*(player.armorMult||1) + (player.toughness||0);
  let dmg = ignoreArmor ? atk : Math.max(1, atk - armorReducer);
  if(player.tycoonGoldShield && player.goldLock>0 && dmg>0){
    const paid = loseGoldForShield(dmg), spill = dmg-paid;
    if(paid>0) log(tr(`💸 钱能买命：花掉 ${paid} 金币挡住 ${paid} 伤害`,`💸 Money Buys Life: spend ${paid} gold to block ${paid} damage`), 'buff');
    dmg = spill;
  }
  player.hp -= dmg;
  if(player.undyingTurn && player.hp<1) player.hp=1; // 狂怒不屈：本回合最低保留 1 血
  if(player.rebirthTurn && player.hp<=0){ player.hp=player.maxHp; player.rebirthTurn=false; player.rebirthSaves=(player.rebirthSaves||0)+1; // 骷髅王重生：本回合致死则满血复活，此后重生冷却 +2
    log(tr('💀 骷髅王重生！生命恢复至满（重生冷却 +2）','💀 Skeleton King reborn! Full HP (Rebirth cooldown +2)'), 'heal'); }
  addDmg(sourceKey, dmg);
  if(dmg>0 && player.tauntWindow){ const grow=Math.max(1, Math.floor(dmg*0.1)); player.maxHp+=grow; log(tr(`🪓 嘲讽吸收：永久最大生命 +${grow}`,`🪓 Taunt converts into +${grow} max HP`), 'buff'); }
  if(dmg>0 && player.unbroken){ player.maxHp+=1; log(tr('🪓 越挫越勇：永久最大生命 +1','🪓 Unbroken: +1 permanent max HP'), 'buff'); }
  if(dmg>0 && player.iceArmor && attacker){ const ice=Math.max(1, Math.floor(frostOrbDamage()*0.5)); reflectIceArmor(ice, attacker); }
  if(player.thorns && dmg>0 && attacker){ const refl=Math.round(player.armor*(player.armorMult||1)+(player.toughness||0)); if(refl>0) reflectThorns(refl, attacker); }   // 荆棘：受到「真·攻击」时把当前护甲减伤量反弹给攻击者（非攻击不传 attacker→不反弹）
  return dmg;
}
// 石像：你对它造成多少伤害，就把等量伤害当作真实伤害（无视护甲）反弹给你。在每个对 Boss 造成伤害的点调用。
function statueReflect(t, hit){ if(t && t.bossId==='statue' && hit>0){ const d=hurtPlayer(hit, 'statue', true); if(d>0) log(tr(`🗿 石像反弹 ${d} 真实伤害！`,`🗿 Statue reflects ${d} TRUE damage!`), 'bad'); } }
// 汲取生命：每击杀 n 只怪回血（受上限封顶），返回实际回血量。供剑/炸弹/毒/箭雨/吸魂/荆棘等所有击杀路径共用。
function lifestealHeal(n){ if(!player.lifesteal||n<=0) return 0; return vampGain(n*player.lifesteal); }
// 吸血类回血（吸血/嗜血）：回到上限封顶；若有「血狂」，溢出全部增为永久生命上限。返回本次实际+的生命。
function vampGain(amount){
  if(amount<=0) return 0; const b=player.hp, space=player.maxHp-player.hp;
  if(amount<=space){ player.hp+=amount; return player.hp-b; }
  player.hp=player.maxHp; const over=amount-space;
  if(player.bloodFrenzy && over>0){ const add=Math.max(1,Math.floor(over*0.3)); player.maxHp+=add; player.hp+=add; }   // 血狂：溢出30%→永久生命上限
  return player.hp-b;
}
// 蔓藤缠绕（树人主动）：当回合让全场怪/Boss（排除终焉）流失 30% 玩家最大生命；可击杀（给奖励+吸血）
function deathCoilTick(){
  const dmg=Math.max(1, Math.floor(player.maxHp*0.3)); let kills=0, hit=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c];
    if(t&&(t.type==='enemy'||(t.type==='boss'&&!t.finale))){ t.hp-=dmg; hit++;
      if(t.hp<=0){ const isB=t.type==='boss'; grid[r][c]=null; kills++; if(isB){thiefRecover(t);player.xp+=15;gainGold(20);onBossKilled();} else {player.xp+=3+(player.killXp||0);gainGold(1);} } } }
  if(!hit) return;
  const lh=lifestealHeal(kills);
  log(tr(`🟢 蔓藤缠绕：全场怪 −${dmg}`+(kills?`，击杀 ${kills}`:'')+(lh?`，吸血 +${lh}`:''),`🟢 Vine Coil: all foes −${dmg}`+(kills?`, ${kills} killed`:'')+(lh?`, +${lh} lifesteal`:'')));
}
// 竭心光环（死灵二阶被动）：按本回合恢复量（受治疗减半影响）让全场敌人/Boss（排除终焉）各掉同等生命；可击杀（给奖励+吸血）
function witherAuraTick(healed){
  if(!healed || healed<=0) return;
  let kills=0, hit=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=grid[r][c];
    if(t&&(t.type==='enemy'||(t.type==='boss'&&!t.finale))){
      t.hp-=healed; hit++;
      if(t.hp<=0){ const isB=t.type==='boss'; grid[r][c]=null; kills++; if(isB){ thiefRecover(t); player.xp+=15; gainGold(20); onBossKilled(); } else { player.xp+=3+(player.killXp||0); gainGold(1); } }
    }
  }
  if(!hit) return;
  const lh=lifestealHeal(kills);
  log(tr(`🪦 竭心光环：全场敌人 −${healed}`+(kills?`，击杀 ${kills}`:'')+(lh?`，吸血 +${lh}`:''),`🪦 Wither Aura: all foes −${healed}`+(kills?`, ${kills} killed`:'')+(lh?`, +${lh} lifesteal`:'')));
}
function reflectThorns(amt, atkr){
  let r=-1,c=-1,t=null;
  if(atkr && (atkr.type==='enemy'||(atkr.type==='boss'&&!atkr.finale))){   // 优先反弹给「攻击者本人」：按身份在棋盘上找它
    for(let rr=0;rr<ROWS&&!t;rr++)for(let cc=0;cc<COLS;cc++){ if(grid[rr][cc]===atkr){ r=rr;c=cc;t=atkr;break; } }
  }
  if(!t){ const es=[]; for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++){ const x=grid[rr][cc]; if(x&&(x.type==='enemy'||x.type==='boss')&&!x.finale) es.push([rr,cc,x]); }
    if(!es.length) return; [r,c,t]=es[Math.floor(rnd()*es.length)]; }   // 攻击者已不在场（如自身已死）→ 退回随机一个敌人
  t.hp-=amt; let lh=0;
  if(t.hp<=0){ const isB=t.type==='boss'; grid[r][c]=null; if(isB){thiefRecover(t);player.xp+=15;gainGold(20);onBossKilled();} else {player.xp+=3+(player.killXp||0);gainGold(1);} lh=lifestealHeal(1); }   // 荆棘反杀也吸血
  log(tr(`🌵 荆棘反弹 ${amt} 伤害`+(lh?`，吸血 +${lh}`:''),`🌵 Thorns reflect ${amt}`+(lh?`, +${lh} lifesteal`:'')));
}

function applyGravity(){
  const prophecyType=player&&player.prophecyPending;
  const hold=gravityFxHold|0;
  let spawned=0;
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){ if(grid[r][c]){ const t=grid[r][c];
      if(write!==r){ grid[write][c]=t; grid[r][c]=null; if(hold>0){ t.curY=cellY(r); t.fxHold=hold; } } write--; } }
    let above=-1;
    for(let r=write;r>=0;r--){ const t=makeTile(prophecyType||undefined); t.curY=cellY(above); if(hold>0) t.fxHold=hold; above--; grid[r][c]=t; spawned++; }
  }
  gravityFxHold=0;
  if(prophecyType && spawned>0){
    player.prophecyPending=null;
    log(tr(`🔮 神谕应验：本次补子全部变为${prophecyLabel(prophecyType)}` ,`🔮 Prophecy fulfilled: this refill became all ${prophecyLabel(prophecyType,true)}`), 'buff');
    if(player.echoOfFate){
      const n=convertTiles(3, prophecyType, ['sword','shield','heart','coin','enemy']);
      if(n){ syncPositions(false); log(tr(`🌀 命运回响：额外改写 ${n} 个棋子`,`🌀 Echo of Fate: ${n} extra tiles transformed`), 'buff'); }
    }
  }
}

function checkLevel(){
  while(player.xp>=xpNeeded(player.level)){
    player.xp-=xpNeeded(player.level); player.level++; pendingLevels++;
  }
}

//==================== 升级（技能三选一）====================
const UPGRADES=[
  {n:['强化体魄','Fortify Body'],  d:p=>{const v=Math.round(6*(p.maxHpUpMult||1)), h=Math.round(v*(p.healMult||1)); return [`最大生命 +${v}，回血 ${h}`,`+${v} max HP, heal ${h}`];}, f:p=>{const v=Math.round(6*(p.maxHpUpMult||1)); p.maxHp+=v; p.hp=Math.min(p.maxHp, p.hp+Math.round(v*(p.healMult||1)));}}, // 兽人×2上限/回12，精灵×0.5上限/回3，活死人治疗减半→回3；不再回满
  {n:['磨利刀刃','Sharpen Blade'], d:['{W}伤 +50%（连越长收益越大）','+50% {W} power (longer chains gain more)'], f:p=>{p.weaponPower+=0.5;}},
  {n:['淬炼锋芒','Temper Edge'],   d:['每次{WC}额外 +3 固定伤害','+3 flat damage per {WC}'], f:p=>{p.swordFlat+=3;}},
  {n:['加固护甲','Reinforce Armor'], d:['立即 +1 护甲（永久减伤）','+1 armor now (permanent damage cut)'], f:p=>{ if(!p.noArmor) p.armor+=1; }}, // 兽人无甲：无效
  {n:['强化盾术','Hone Shielding'], d:['每个盾提供的护甲进度 +1','+1 Armor XP per shield'], f:p=>{p.armorPerShield+=1;}},
  {n:['精研医术','Refine Healing'], d:['每颗心回复生命 +1','+1 HP healed per heart'], f:p=>{p.healPerHeart+=1;}},
  {n:['搜刮财富','Gather Gold'],   d:['每枚金币收益 +1','+1 gold per coin'], f:p=>{p.goldPerCoin+=1;}},
  {n:['汲取生命','Drain Life'],    d:['每击杀一只怪物回复 1 生命','Heal 1 HP per enemy killed'], f:p=>{p.lifesteal+=1;}},
  {n:['凝聚生机','Channel Vitality'], d:['每次选择时，「每回合自动回复」+1（第1次回1，第2次回2，第3次回3…）','Each pick increases per-turn regen by +1 more than last time (1, then 2, then 3, ...)'], f:p=>{ const next=(p.regenLevel||0)+1; p.regenLevel=next; p.regen+=next; }},
];
// 升级三选一的洗牌（消耗 RNG）——供 UI 与回放共用，确保 RNG 消耗一致
function rollUpgradePool(){
  // 兽人无甲：剔除护甲相关升级（死选项）
  const avail=player.noArmor ? UPGRADES.filter(u=>u.n[0]!=='加固护甲'&&u.n[0]!=='强化盾术') : UPGRADES;
  const arr=[...avail];
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr.slice(0,(player.upgradeChoices||3));  // 将军：四选一（确定性 Fisher-Yates，避免 sort 比较器跨引擎耗 RNG 不一致）
}
function applyUpgrade(u){ u.f(player); player.hp=Math.min(player.hp,player.maxHp); pendingLevels--; }
function showLevelUp(){
  if(replaying||headless) return;   // 回放/无头：升级由动作序列(或机器人)驱动，不弹窗、不在此抽池（避免重复消耗RNG）
  busy=true;
  const pool=rollUpgradePool();
  const card=document.getElementById('card');
  card.innerHTML=`<h2>${tr(`⬆️ 升到 ${player.level} 级！`,`⬆️ Level ${player.level}!`)}</h2><p>${tr('选择一项强化','Pick one upgrade')}</p>`;
  pool.forEach(u=>{
    const b=document.createElement('button'); b.className='choice';
    b.innerHTML=`<b>${L(u.n)}</b><small>${L(typeof u.d==='function'?u.d(player):u.d)}</small>`;
    b.onclick=()=>{ recAct(['u', UPGRADES.indexOf(u)]); player.chosenPerks.push(u.id); applyUpgrade(u);   // 录制升级选择（按 UPGRADES 索引）
      log(tr(`⬆️ 升级选择：${L(u.n)}`,`⬆️ Upgrade picked: ${L(u.n)}`), 'buff');
      if(pendingLevels>0){ showLevelUp(); } else { busy=false; hideOverlay(); }
      updateHUD(); };   // 必须在 busy 置回 false 之后刷新，否则技能/商店按钮一直禁用到下一回合
    card.appendChild(b);
  });
  showOverlay();
}

function gameOver(){

async function canReachApi(){
  try{
    const res=await fetch(REC_API+'/top?agent=human&n=1&recent=1', {method:'GET'});
    return !!(res && res.ok);
  }catch(e){ return false; }
}
async function submitReplayRecord(recObj, box){
  if(!recObj || !box) return;
  const turns = recObj.turns!=null ? recObj.turns : (recObj.acts ? recObj.acts.filter(a=>a[0]==='m').length : 0);
  const level = recObj.level|0;
  const gold = recObj.gold|0;
  box.innerHTML=`<div style="text-align:center;color:var(--dim);font-size:12px">${tr('⏳ 正在补交排行榜…','⏳ Resubmitting to leaderboard…')}</div>`;
  if(recObj.cleared) await submitClear(recObj, level); else await submitScore(recObj, level, gold);
}
function wireEndButtons(finished){
  const rep=document.getElementById('goReplay'), sh=document.getElementById('goShare'), cp=document.getElementById('goCopy'), ex=document.getElementById('goExport');
  const bd=document.getElementById('goBoard'); if(bd) bd.onclick=()=>showLeaderboard();   // 看榜与是否有录像无关
  if(finished){
    rep.onclick=()=>startReplay(finished);
    sh.onclick=()=>shareRec(finished, sh);
    cp.onclick=()=>{ const s=JSON.stringify(finished); try{ navigator.clipboard.writeText(s); log(tr('📋 录像已复制到剪贴板','📋 Recording copied')); }catch(e){ prompt(tr('复制以下录像：','Copy this recording:'), s); } };
    ex.onclick=()=>exportRec(finished);
  } else if(rep){ rep.style.display=sh.style.display=cp.style.display=ex.style.display='none'; }
}
// 正式版上报破关，回填破关榜（按最低破关等级）名次
function uploadFailToast(msg, err){
  const raw=(err&&err.message)||'';
  if(raw.includes('unknown-or-expired')){ toast(tr(`⚠️ ${msg}：服务端种子已过期（72h），请重新开局获取新种子`,`⚠️ ${msg}: server seed expired (72h) — start a new run for a fresh seed`)); return; }
  if(raw.includes('used')){ toast(tr(`⚠️ ${msg}：这枚服务端种子已被使用，不能重复提交`,`⚠️ ${msg}: this server seed was already used and cannot be submitted again`)); return; }
  if(raw.includes('seed-mismatch')){ toast(tr(`⚠️ ${msg}：录像和服务端种子不匹配`,`⚠️ ${msg}: recording does not match the server seed`)); return; }
  if(raw.includes('below upload threshold')){ toast(tr(`⚠️ ${msg}：本局未达到上传门槛`,`⚠️ ${msg}: this run did not reach the upload threshold`)); return; }
  toast(tr(`⚠️ ${msg}：网络或服务异常，请稍后重试`,`⚠️ ${msg}: network or service issue — please try again later`));
}
async function submitClear(r, level){
  const box=document.getElementById('rankBox'); if(!box) return;
  if(!r.token){ box.innerHTML=`<div style="text-align:center;color:var(--dim);font-size:12px">${tr('🔌 本局未用服务端种子（离线），未计破关榜','🔌 Offline run (no server seed) — not on clear board')}</div>`; return; }
  box.innerHTML=`<div style="text-align:center;color:var(--dim);font-size:12px;margin-bottom:4px">${tr('🔏 服务端种子有效期：现实时间 72 小时（过期后不可补交）','🔏 Server seed valid for 72 real-time hours (cannot be resubmitted after expiry)')}</div>`;
  if(!r.threshold) r.threshold = await fetchThresholdSnapshot(r.race, r.ver||VERSION, 'human');
  if(r.threshold && !((r.threshold.upload_min_turns<=0) || (((r.threshold.upload_min_turns>0) && (r.turns||0) >= r.threshold.upload_min_turns) || clearTop10Eligible(r.threshold, r.turns||0, level)))){ box.innerHTML+=`<div style="text-align:center;color:var(--dim);font-size:12px">${approxPctLine(r.threshold, r.turns||0, level, 0, true)}</div>`; return; }
  box.innerHTML+=`<div style="text-align:center;color:var(--dim);font-size:12px">🏆 ${tr('破关榜上传中…','Submitting clear…')}</div>`;
  try{
    const res=await fetch(REC_API+'/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({level,rec:r,agent:'human',name:getName()})});   // 真人破关上报人类榜
    const j=await res.json(); if(!j.overall) throw new Error(j.error||'no rank');
    const raceName=L(raceById(r.race).n);
    box.innerHTML=`<div style="text-align:center;color:var(--gold);font-size:12px;margin-bottom:2px">🏆 ${tr('破关榜','Clear board')}（${tr('按最低破关等级','by lowest clear level')}）</div>`
      + rankRow(tr('总榜','Overall'), j.overall)
      + rankRow(`${tr('种族榜','Race')}·${raceName}`, j.race);
  }catch(e){ box.innerHTML=`<div style="text-align:center;color:var(--dim);font-size:12px">${tr('破关榜上传失败','Clear board unavailable')}</div>`; uploadFailToast(tr('破关榜上传失败','Clear board submission failed'), e); }
}
// 正式版死亡上报分数，回填总榜/种族榜百分位（dev 版无此功能）
function rankRow(label, o){
  return `<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 6px;font-size:13px">
    <span>${label}</span><b style="color:var(--gold)">#${o.rank} / ${o.total} · ${tr('超过','beats')} ${o.pct}%</b></div>`;
}
function scoreTop10Eligible(th, turns, level, gold){
  if(!th || !th.score_top10_turns) return false;
  if(turns>th.score_top10_turns) return true;
  if(turns<th.score_top10_turns) return false;
  if(level>th.score_top10_level) return true;
  if(level<th.score_top10_level) return false;
  return gold>=th.score_top10_gold;
}
function clearTop10Eligible(th, turns, level){
  if(!th || !th.clear_total || !th.clear_top10_level) return false;
  if(level<th.clear_top10_level) return true;
  if(level>th.clear_top10_level) return false;
  return turns<=th.clear_top10_turns;
}
function approxPctLine(th, turns, level, gold, cleared){
  if(cleared){
    if(clearTop10Eligible(th, turns, level)) return tr('🏆 本局虽低于基础上传门槛，但已进入当前口径的种族前10，仍可上传破关榜','🏆 This run is below the base gate, but it is still in the current race top 10, so it can upload to the clear board');
  } else {
    if(scoreTop10Eligible(th, turns, level, gold)) return tr('🏆 本局虽低于基础上传门槛，但已进入当前口径的种族前10，仍可上传正式榜单','🏆 This run is below the base gate, but it is still in the current race top 10, so it can upload to the ranked board');
  }
  if(!th||!th.total) return tr('📊 本局未达上传门槛，未计入正式榜单','📊 Below upload threshold — not submitted to the ranked board');
  turns = turns || (player&&player.turns) || 0;
  const pct = turns>=th.p5?5 : turns>=th.p10?10 : turns>=th.p30?30 : turns>=th.p50?50 : turns>=th.p70?70 : turns>=th.p90?90 : 100;
  return tr(`📊 本局未达上传门槛（需至少 ${th.upload_min_turns} 回合，或进入当前口径种族前10）；按开局快照估算，约超过 ${pct}% 对局`,`📊 Below upload threshold (need at least ${th.upload_min_turns} turns, or a current-scope race top 10); launch-time snapshot estimates you beat about ${pct}% of runs`);
}

// 从录像的 acts 里解析职业线（id 取值，跨版本稳定，旧录像也认）：一阶职业 / 二阶被动 / 350 跨界
function recClassLine(rec){
  const cls=[];
  for(const a of (rec.acts||[])){ if(a[0]!=='t') continue;
    if(a[1]===1 && TIER1[a[2]]) cls.push(L(TIER1[a[2]].n));
    else if((a[1]===2||a[1]===3) && TIER2[a[2]]) cls.push(L(TIER2[a[2]].n));
    else if(a[1]===4 && TIER1[a[2]]) cls.push(L(TIER1[a[2]].n)+(a[3]==='heal'?'→💊':'→💥'));
  }
  return cls;
}

//==================== 录像回放 ====================
let replayRec=null, replayIdx=0, replayTimer=null, replaySpeed=1, replayPaused=false, replayTotalTurns=0, replayAutoPaused=false, replayPending=null;
let jumping=false;   // 跳回合快进期间：抑制 gameOver/onClear，避免（录像若不一致而提前死亡时）直接弹出结束画面
const REPLAY_BASE=620;   // 每步基础间隔 ms（按倍速缩短）
function startReplay(recObj){
  if(!recObj||!Array.isArray(recObj.acts)){ alert(tr('录像无效','Invalid recording')); return; }
  recObj.acts.forEach(a=>{ if(a&&a[0]==='t'&&typeof a[2]==='string') a[2]=normalizeClassId(a[2]); if(a&&a[0]==='b'&&a[2]==='seer'&&typeof a[1]==='string') a[1]=normalizeClassId(a[1]); });
  replayResumeState = player&&grid ? {
    player: JSON.parse(JSON.stringify(player)),
    grid: grid.map(row=>row.map(t=> t?{type:t.type,hp:t.hp,maxHp:t.maxHp,atk:t.atk,cd:t.cd,baseCd:t.baseCd,bossId:t.bossId,tier:t.tier,stolen:t.stolen,finale:t.finale,incub:t.incub,poison:t.poison,burnTurns:t.burnTurns,burnStacks:t.burnStacks}:null)),
    pendingLevels, busy, dragging:!!dragging, selection:selection?selection.map(s=>({...s})):[], rec:rec?JSON.parse(JSON.stringify(rec)):null, ended
  } : null;
  replaying=true; replayRec=recObj; replayIdx=0; replaySpeed=1; replayPaused=false; replayAutoPaused=false; replayPending=null; rec=null;
  replayTotalTurns=recObj.acts.filter(a=>a[0]==='m').length;   // 总回合数（=连线动作数）
  hideOverlay(); busy=false;
  startGame(raceById(recObj.race));    // replaying=true → 用 recObj.seed 播种、不新建录像
  document.getElementById('replayBar').classList.add('show');
  renderJumps(); updateReplayBar(); scheduleReplay();
}
function scheduleReplay(delay){ clearTimeout(replayTimer); if(replayPaused||!replaying) return; replayTimer=setTimeout(replayStep, delay==null?REPLAY_BASE/replaySpeed:delay); }
function replayStep(){
  if(!replaying) return;
  if(replayPending){   // 第二拍：结算上一拍已预显示连线的那步
    const a=replayPending; replayPending=null; replayIdx++;
    try{ dispatchReplayAct(a); }catch(e){ log('回放出错: '+e.message); replayDone(); return; }
    if(!replaying) return;   // resolve 可能已触发 gameOver→stopReplay
    // 倒数 10 回合自动暂停一次，方便看清怎么死的
    if(!replayAutoPaused && replayTotalTurns>10 && player && player.hp>0 && player.turns>=replayTotalTurns-10){
      replayAutoPaused=true; replayPaused=true; selection=[];   // 静止帧清掉连线
      log(tr('⏸ 接近尾声，已自动暂停。点 ▶ 继续看结局。','⏸ Auto-paused near the ending. Press ▶ to watch how it ends.'));
    }
    updateReplayBar(); scheduleReplay(); return;
  }
  if(replayIdx>=replayRec.acts.length){ replayDone(); return; }
  const a=replayRec.acts[replayIdx];
  if(a[0]==='m'){   // 第一拍：在「结算前」的棋盘上先把本步连线画出来，半拍后再结算（连线才对得上棋子）
    selection=a[1].map(([r,c],i)=>({r,c,type:i===0?a[2]:(grid[r][c]?grid[r][c].type:a[2])}));
    replayPending=a; updateReplayBar();
    scheduleReplay(Math.max(110, REPLAY_BASE/replaySpeed*0.5));
    return;
  }
  // 非连线动作（买道具/技能/升级/转职）：直接执行
  replayIdx++;
  try{ dispatchReplayAct(a); }catch(e){ log('回放出错: '+e.message); replayDone(); return; }
  if(!replaying) return;
  updateReplayBar(); scheduleReplay();
}
function dispatchReplayAct(a){
  const k=a[0];
  if(k==='m'){ const cells=a[1], base=a[2];
    selection=cells.map(([r,c],i)=>({r,c,type:i===0?base:(grid[r][c]?grid[r][c].type:base)}));
    resolve();
    selection=[];   // 结算后立即清：连线由 replayStep 在「结算前」的棋盘上预显示（见两拍逻辑），绝不画在已重排的棋盘上
  } else if(k==='b'){
    if(a[2]==='seer'){ activateSeerSkill(a[3], true, a[1]); }
    else buyItem(a[1]);
  }
  else if(k==='k'){
    if(a[1]==='seer') activateSeerSkill(a[2], true);
    else activateSkill();
  }
  else if(k==='u'){ rollUpgradePool(); applyUpgrade(UPGRADES[a[1]]); updateHUD(); }   // 洗牌消耗等量 RNG（丢弃结果），按录像索引应用
  else if(k==='t'){ const tier=a[1], id=normalizeClassId(a[2]);
    if(tier===1){ player.tier1=id; }
    else if(tier===3){ player.tier2b=id; TIER2[id].f(player); player.hp=Math.min(player.hp,player.maxHp); }
    else if(tier===4){ player.skill2={id, slot:a[3]}; player.skill2Cd=0; }
    else { player.tier2=id; TIER2[id].f(player); player.hp=Math.min(player.hp,player.maxHp); }
    player.awaitingTier=0; updateHUD();
  }
}
function updateReplayBar(){
  const tt=replayTotalTurns||0;
  const turn=(player?player.turns:0)+(replayPending?1:0);   // 正在预显示连线（未结算）时，显示的是「即将完成的那一回合」
  document.getElementById('rbTxt').textContent=`🎬 ${tr('回放','Replay')}${replayPaused?' ⏸':''} · ${tr('回合','turn')} ${turn}/${tt}`;
  document.getElementById('rbFill').style.width=(tt?Math.min(100,turn/tt*100):0)+'%';
  // 步进键：仅暂停时可见（用 .hide 隐藏但保留占位，避免挤动其它按钮/进度条）；到首/末回合相应变灰
  const prev=document.getElementById('rbPrev'), next=document.getElementById('rbNext');
  if(prev&&next){ prev.classList.toggle('hide', !replayPaused); next.classList.toggle('hide', !replayPaused);
    prev.classList.toggle('dim', turn<=1); next.classList.toggle('dim', turn>=tt); }
  document.querySelectorAll('#replayBar .rbSpd').forEach(b=>b.classList.toggle('on', +b.dataset.spd===replaySpeed));
}
function replayDone(){ clearTimeout(replayTimer); replayTimer=null; replayPaused=true; replayPending=null; selection=[]; updateReplayBar(); log(tr('🎬 回放结束（点 ⏹ 退出）','🎬 Replay finished (⏹ to exit)')); }
function stopReplay(){
  clearTimeout(replayTimer); replayTimer=null;
  replaying=false; replayRec=null; replayPending=null;
  bombFx.length=0; bossFx.length=0; hookFx.length=0; clearTransientFxDom();
  document.getElementById('replayBar').classList.remove('show');
  if(replayResumeState){
    player=replayResumeState.player;
    grid=replayResumeState.grid;
    pendingLevels=replayResumeState.pendingLevels;
    busy=replayResumeState.busy;
    dragging=replayResumeState.dragging;
    selection=replayResumeState.selection;
    rec=replayResumeState.rec;
    ended=replayResumeState.ended;
    replayResumeState=null;
    syncPositions(true); updateHUD();
  }
}
// 跳到指定回合：从种子重头快进（确定性、瞬间），到目标回合后暂停
function jumpToTurn(target){
  if(!replaying||!replayRec) return;
  const rec0=replayRec, acts=rec0.acts;            // 本地持有：防止快进中误触 stopReplay 把 replayRec 置空
  clearTimeout(replayTimer); replayTimer=null; replayPending=null;
  bombFx.length=0; bossFx.length=0; hookFx.length=0; clearTransientFxDom();   // 清掉上一段残留的爆炸/入场/拖拽/拉线特效，否则会画在跳转后的棋盘上
  replayAutoPaused = target>=replayTotalTurns-10;   // 跳到接近终点就别再自动暂停
  replayIdx=0; busy=false; jumping=true; selection=[];   // 快进期间抑制 gameOver/onClear
  try{
    startGame(raceById(rec0.race));                 // replaying=true → 用 rec0.seed 重新播种
    let mSeen=0;                                    // 已结算的连线数；停在「第 target 个连线」之前
    while(replayIdx<acts.length && player.hp>0 && !player.cleared){
      const a=acts[replayIdx];
      if(a[0]==='m' && mSeen+1===target) break;     // 下一个就是目标连线 → 停下、留给下面预显示
      try{ dispatchReplayAct(a); }catch(e){ break; }
      if(a[0]==='m') mSeen++;
      replayIdx++;
    }
  } finally { jumping=false; }
  replaying=true; replayRec=rec0;                   // 恢复回放状态（以防快进里被改动）
  // 在「结算前」的棋盘上预显示目标回合的连线（线对得上棋子），暂停等用户继续
  if(replayIdx<acts.length && acts[replayIdx][0]==='m' && player.hp>0 && !player.cleared){
    const a=acts[replayIdx];
    selection=a[1].map(([r,c],i)=>({r,c,type:i===0?a[2]:(grid[r][c]?grid[r][c].type:a[2])}));
    replayPending=a;
  } else { selection=[]; replayPending=null; }
  replayPaused=true; updateReplayBar();
  const viewT=player.turns+(replayPending?1:0);
  if(!replayPending && (player.hp<=0||player.cleared))
    log(tr(`⏭ 该录像在第 ${player.turns} 回合就结束了（无法再往后跳）`,`⏭ This recording ends at turn ${player.turns} (cannot jump further)`));
  else
    log(tr(`⏭ 跳到第 ${viewT} 回合（已暂停，点 ▶ 继续）`,`⏭ Jumped to turn ${viewT} (paused, ▶ to play)`));
}
function renderJumps(){
  const box=document.getElementById('rbJumps'); if(!box) return; box.innerHTML='';
  const tt=replayTotalTurns;
  const stops=[50,100,200,350].filter(t=>t<tt);   // 固定节点，只显示录像够长的那几个
  if(!stops.length && tt<=10) return;
  const lbl=document.createElement('span'); lbl.className='rbLbl'; lbl.textContent=tr('跳到回合','Jump to'); box.appendChild(lbl);
  for(const t of stops){ const b=document.createElement('button'); b.textContent=t; b.onclick=()=>jumpToTurn(t); box.appendChild(b); }
  if(tt>10){ const b=document.createElement('button'); b.textContent='−10'; b.title=tr('跳到倒数第 10 回合（看结局）','Jump to 10 turns from the end'); b.onclick=()=>jumpToTurn(Math.max(1,tt-10)); box.appendChild(b); }   // 倒数第10回合
}
// 暂停/继续（点棋盘触发，见 startDrag）
function togglePauseReplay(){ if(!replaying) return; if(replayIdx>=(replayRec?replayRec.acts.length:0)) return; replayPaused=!replayPaused; if(replayPaused){ selection=[]; replayPending=null; } updateReplayBar(); scheduleReplay(); }
// 步进一回合（确定性从种子重跑到目标回合，内部会暂停）
function stepReplay(dir){ if(!replaying||!replayRec) return; const cur=(player?player.turns:0)+(replayPending?1:0); const target=Math.max(1, Math.min(replayTotalTurns, cur+dir)); if(target!==cur) jumpToTurn(target); }
document.getElementById('rbPrev').onclick=()=>stepReplay(-1);
document.getElementById('rbNext').onclick=()=>stepReplay(1);
document.getElementById('rbExit').onclick=()=>{ const hadLive=!!replayResumeState; stopReplay(); if(hadLive){ hideOverlay(); busy=false; } else showClassSelect(); };
document.querySelectorAll('#replayBar .rbSpd').forEach(b=>{ b.onclick=()=>{ replaySpeed=+b.dataset.spd; updateReplayBar(); scheduleReplay(); }; });

  if(t1){ cls+=`${tr('职业','Class')}【${L(t1.n)}】<i style="color:#caa6e6">「${L(t1.quip)}」</i><br>`;   // 俏皮话紧跟职业名

    if(t1.passive) cls+=`　${tr('被动','Passive')}：${L(t1.passive)}<br>`; }
  else cls+=tr('击败第 50 回合 Boss → 转职，解锁职业主动技能<br>','Beat the turn-50 boss → advance to a class, unlock its active.<br>');
  if(t2) cls+=`${tr('二阶技能','Tier-2 Skill')}【${L(t2.n)}】${tr('被动','Passive')}：${L(t2.d)}<br>`;
  else cls+=tr('继续深入 → 解锁二阶技能（被动）<br>','Delve deeper → unlock a Tier-2 Skill (passive).<br>');
  if(t2b) cls+=`${tr('本族技能','Race Skill')}【${L(t2b.n)}】${tr('被动','Passive')}：${L(t2b.d)}<br>`;
  else cls+=tr('更深处 → 获得本族技能（再一项被动）<br>','Deeper still → gain a Race Skill (another passive).<br>');
  if(s2) cls+=`${tr('跨界技能','Crossover')}【${L(s2.skill.name)}】→ ${p.skill2.slot==='heal'?'💊':'💥'}（${tr('每','every')} ${effSkillCd(p.skill2.id)} ${tr('回合','t')}）${s2.quip?`<br><i style="color:#caa6e6">「${L(s2.quip)}」</i>`:''}`;
  else cls+=tr('深渊尽头 → 跨界技能（换任意职业主动）','At the abyss’s end → a Crossover Skill (swap in any class active).');
  cls+='</div>';
  const card=document.getElementById('card');
  card.innerHTML=`<h2>${rc?`${rc.e} ${L(rc.n)}`:tr('冒险者','Adventurer')}</h2>
    ${rc?`<p>${L(rc.d)}</p>`:''}
    <div style="text-align:left;font-size:13px;margin:0 0 4px">${rows}</div>
    ${cls}${perkLine}
    <button class="btn" id="infoClose" style="width:100%;margin-top:12px">${tr('关闭','Close')}</button>`;
  document.getElementById('infoClose').onclick=()=>{ busy=false; hideOverlay(); updateHUD(); };
  showOverlay();
}
document.getElementById('hud').onclick=showPlayerInfo;

function showOverlay(){ document.getElementById('overlay').classList.add('show'); }
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }

//==================== HUD / 日志 ====================
function bar(idBar,idTxt,cur,max,suffix){
  document.getElementById(idBar).style.width=Math.max(0,Math.min(100,cur/max*100))+'%';
  document.getElementById(idTxt).textContent=`${Math.max(0,Math.round(cur))} / ${max}`+(suffix||'');
}
function updateHUD(){
  document.getElementById('hud').classList.toggle('hoarding', !!(player && player.goldLock>0));
  bar('hpBar','hpTxt',player.hp,player.maxHp);
  document.getElementById('hpBar').style.background = isInfected() ? '#27ae60' : 'var(--hp)';  // 僵尸尸毒感染：血条变绿
  updateDanger();
  const an=armorNeeded(player.armor);
  document.getElementById('arBar').style.width=Math.min(100,player.shieldXp/an*100)+'%';
  document.getElementById('arTxt').textContent=
    `${tr('减伤','DR')} ${player.armor}${player.toughness?`+${player.toughness}`:''}　${player.shieldXp}/${an}`;
  const need=xpNeeded(player.level);
  document.getElementById('xpBar').style.width=(player.xp/need*100)+'%';
  document.getElementById('xpTxt').textContent=`${player.xp} / ${need}`;
  document.getElementById('lvTxt').textContent=player.level;
  document.getElementById('goldTxt').textContent=player.gold;
  document.getElementById('turnTxt').textContent=player.turns;
  const b=[];
  if(player.race){ const rc=raceById(player.race); let id=`${rc.e}${L(rc.n)}`;
    if(player.tier1) id+=` · ${L(TIER1[player.tier1].n)}`;
    if(player.tier2) id+=` · ${L(TIER2[player.tier2].n)}`;
    b.push(id); }
  b.push(`${wE()}×${player.weaponPower}${player.swordFlat?`+${player.swordFlat}`:''}`);
  b.push(player.noArmor?tr('无甲','No armor'):`🔰${player.armorPerShield}`);
  b.push(`💗${player.healPerHeart}`);
  b.push(`💰${player.goldPerCoin}`);
  if(player.goldLock>0) b.push(tr(`🔒囤金${player.goldLock}`,`🔒${player.goldLock}`));
  if(player.deathCoil>0) b.push(tr(`🟢缠绕${player.deathCoil}`,`🟢Coil ${player.deathCoil}`));
  if(player.lifesteal)b.push(tr(`吸血 ${player.lifesteal}`,`Lifesteal ${player.lifesteal}`));
  if(player.regen)b.push(tr(`恢复 ${player.regen}`,`Regen ${player.regen}`));
  document.getElementById('bonusTxt').textContent=b.join('　');
  const scd=(player.shopCd&&typeof player.shopCd==='object')?player.shopCd:{};
  document.querySelectorAll('.shopBtn[data-buy]').forEach(btn=>{
    const key=btn.dataset.buy;
    if(player.skill2 && player.skill2.slot===key && TIER1[player.skill2.id]){   // 该槽已换成换装主动
      const sk=TIER1[player.skill2.id].skill;
      btn.querySelector('span').textContent=`✨${L(sk.name)}`;
      btn.querySelector('small').textContent=L(sk.short);
      const fz2=player.frozen&&player.frozen[key]>0;
      btn.querySelector('em').textContent = fz2 ? `❄️${player.frozen[key]}${tr('回合','t')}` : player.skill2Cd>0 ? `⏳${player.skill2Cd}${tr('回合','t')}` : tr('可发动','Ready');
      btn.classList.toggle('off', busy || pendingLevels || player.skill2Cd>0 || fz2);
      return;
    }
    const c=shopCost(key), cd=scd[key]||0, fz=player.frozen&&player.frozen[key]>0;   // 雪人冰封该槽
    if(key==='heal'){ const hv=Math.round((10+2*(player.healUses||0))*(player.healMult||1)); btn.querySelector('small').textContent=tr(`回复 ${hv} 生命`,`Restore ${hv} HP`); }   // 治疗恢复量随次数递增（活死人按 healMult 折算）
    if(key==='bomb'){ const extra=bombGoldSacrificeBonus(player), D=bombDamage(player)+extra; btn.querySelector('small').textContent=tr(`全场怪 -${D} 血`+(extra?`（乾坤一掷 +${extra}）`:''),`All foes -${D} HP`+(extra?` (All-In +${extra})`:'')); }   // 炸弹伤害随爆破手/乾坤一掷动态显示
    const full = key==='heal' && player.hp>=player.maxHp;   // 满血时治疗禁用
    btn.querySelector('em').textContent = fz ? `❄️${player.frozen[key]}${tr('回合','t')}` : cd>0 ? `⏳${cd}${tr('回合','t')}` : full ? tr('已满血','Full HP') : c+'💰';
    btn.classList.toggle('off', busy || pendingLevels || cd>0 || player.goldLock>0 || player.gold < c || fz || full); });
  const sb=document.getElementById('skillBtn'), sk=player.tier1&&TIER1[player.tier1]&&TIER1[player.tier1].skill;
  if(sk){ sb.style.display='flex';
    sb.querySelector('span').textContent=`✨${L(sk.name)}`;
    sb.querySelector('small').textContent=L(sk.short);
    const hoarding = player.tier1==='miser' && player.goldLock>0;   // 囤金期间技能无法再发动，按锁定显示
    const fzs=player.frozen&&player.frozen.skill>0;   // 雪人冰封一阶主动
    const isBuyout = player.tier1==='guildmaster';
    const buyCost = isBuyout ? (player.cheapskate?Math.ceil(enemyHpSum()/2):enemyHpSum()) : 0;   // 收买花费 = 全怪血量（小气鬼减半）
    const cantAfford = isBuyout && (buyCost<=0 || player.gold<buyCost);   // 没怪或钱不够 → 置灰
    sb.querySelector('em').textContent = fzs ? `❄️${player.frozen.skill}${tr('回合','t')}`
      : hoarding ? `🔒${player.goldLock}${tr('回合','t')}`
      : player.skillCd>0 ? `⏳${player.skillCd}${tr('回合','t')}`
      : player.prophecyPending ? `🔮${prophecyLabel(player.prophecyPending)}`
      : isBuyout ? `💰${buyCost}`                                         // 收买：显示当前花费（全怪血量），钱不够时按钮置灰
      : tr('可发动','Ready');
    sb.classList.toggle('off', busy || pendingLevels || player.skillCd>0 || hoarding || fzs || cantAfford);
  } else { sb.style.display='none'; }
  saveGame();
}
// 低血时屏幕边缘变红：血越少越红，危急时呼吸闪烁
const vignetteEl=document.getElementById('vignette');
function updateDanger(){
  const ratio=Math.max(0,player.hp)/player.maxHp;
  // 生命 >50% 不显示；50%→0% 之间，红色从无到最浓
  const t=Math.max(0,(0.5-ratio)/0.5);          // 0 ~ 1
  vignetteEl.style.opacity=(t*0.85).toFixed(3);  // 最浓 0.85
  const danger = ratio>0 && ratio<=0.2;
  vignetteEl.classList.toggle('pulse', danger); // 危急呼吸闪烁
  document.getElementById('hpBar').classList.toggle('low', danger); // 生命条同步闪烁
}
const logEl=document.getElementById('log'); let logHistory=[];
// 日志按事件类型上色：回血=绿 / 增益=蓝 / 攻击敌人=白(默认) / 被攻击·Boss出场=红 / 负面效果=黄
function logColor(e){ const k=e&&e.k; return k==='bad'?'#ff5252':k==='heal'?'#2ecc71':k==='buff'?'#4aa3ff':k==='debuff'?'#f1c40f':'var(--txt)'; }
function log(m, k){
  logHistory.push({m, k}); if(logHistory.length>80)logHistory.shift();   // 完整历史含类型标记（点 log 栏查看更多）
  logEl.innerHTML=logHistory.slice(-2).map(e=>`<span style="color:${logColor(e)}">${e.m}</span>`).join('<br>'); }
function logClear(){ logHistory=[]; logEl.innerHTML=''; }
// 点 log 栏 → 弹出完整日志历史（最新在上）。纯 UI，不进录像。
function showLogHistory(){
  if(busy||pendingLevels||!logHistory.length) return;
  busy=true;
  const rows=logHistory.slice().reverse().map(e=>{ const m=(e&&e.m!==undefined)?e.m:e;   // 兼容旧格式（字符串）
    return `<div style="padding:5px 2px;border-bottom:1px solid #3a2d4d;font-size:12px;text-align:left;color:${logColor(e)}">${m}</div>`; }).join('');
  const card=document.getElementById('card');
  card.innerHTML=`<h2>📜 ${tr('日志','Log')}</h2>
    <div style="max-height:58vh;overflow-y:auto;margin:0 0 12px">${rows}</div>
    <button class="btn" id="logClose" style="width:100%">${tr('关闭','Close')}</button>`;
  document.getElementById('logClose').onclick=()=>{ busy=false; hideOverlay(); };
  showOverlay();
}
if(logEl) logEl.onclick=showLogHistory;
// 点版本号 → 展示嵌入页面的更新日志摘要（CHANGELOG_LINES，无需联网；由 dr.sh 从 CHANGELOG.md 注入）
function showChangelog(){
  if(busy||pendingLevels) return;
  busy=true;
  const lines=(typeof CHANGELOG_LINES!=='undefined'?CHANGELOG_LINES:[]);
  const body = lines.length
    ? `<div style="max-height:58vh;overflow-y:auto;margin:0 0 12px">${lines.map(e=>{
        const txt = lang==='en' ? (e.en||e.zh||'') : (e.zh||e.en||'');
        return `<div style="padding:5px 2px;border-bottom:1px solid #3a2d4d;font-size:12px;text-align:left"><b style="color:var(--gold)">${e.ver||''}</b> ${txt}</div>`;
      }).join('')}</div>`
    : `<p style="font-size:13px">${tr('看完整日志：','Full log:')} <a href="https://github.com/lcgogo/dungeon-raid/blob/main/CHANGELOG.md" target="_blank" style="color:var(--gold)">CHANGELOG</a></p>`;
  const card=document.getElementById('card');
  card.innerHTML=`<h2>📝 ${tr('更新日志','Changelog')}</h2>${body}<button class="btn" id="clClose" style="width:100%">${tr('关闭','Close')}</button>`;
  document.getElementById('clClose').onclick=()=>{ busy=false; hideOverlay(); };
  showOverlay();
}

document.getElementById('langBtn').onclick=()=>setLang(lang==='en'?'zh':'en');
document.getElementById('langBtn').textContent = lang==='en'?'中文':'EN';

  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault();
    installPromptEvt=e;
  });
  window.addEventListener('appinstalled', ()=>{ installPromptEvt=null; });
}
applyStaticLang();
{ const ve=document.getElementById('ver'); if(ve) ve.onclick=showChangelog; }
resize(); showClassSelect(); loop();
})();
