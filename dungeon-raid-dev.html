<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>地牢突袭 · Dungeon Raid</title>
<meta name="theme-color" content="#241b30">
<!-- 标签页/书签/主屏图标：内联 SVG（金色城堡+小旗，单文件零外部依赖）。🏰 是本作品牌标。 -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23241b30'/%3E%3Cg fill='%23e7c14a'%3E%3Crect x='15' y='21' width='7' height='9'/%3E%3Crect x='28' y='21' width='8' height='9'/%3E%3Crect x='42' y='21' width='7' height='9'/%3E%3Crect x='15' y='29' width='34' height='22' rx='1'/%3E%3C/g%3E%3Cpath d='M26 51V41a6 6 0 0 1 12 0v10z' fill='%23241b30'/%3E%3Crect x='31' y='12' width='3' height='10' fill='%23e7c14a'/%3E%3Cpath d='M34 13l8 2-8 2z' fill='%23c0392b'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="地牢突袭">
<style>
  :root{
    --bg:#1a1423; --panel:#241b30; --panel2:#2f2440;
    --gold:#f1c40f; --txt:#ece3f5; --dim:#9a8bb0;
    --hp:#e74c3c; --armor:#3498db; --xp:#2ecc71;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:radial-gradient(circle at 50% 0%, #2a1f3a, var(--bg));
    color:var(--txt); font-family:-apple-system,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    user-select:none; -webkit-user-select:none; padding:4px 6px 8px;
  }
  h1{font-size:17px; margin:2px 0 1px; letter-spacing:1px;}
  h1 .sub{font-size:11px; color:var(--dim); letter-spacing:1px;}
  #wrap{width:100%; max-width:440px; position:relative;}
  #langBtn{position:fixed; top:8px; right:10px; z-index:20; background:var(--panel2); color:var(--dim);
           border:1px solid #3a2d4d; border-radius:8px; font-size:11px; padding:3px 9px; cursor:pointer;}
  #langBtn:hover{border-color:var(--gold); color:var(--txt);}

  /* HUD */
  #hud{background:var(--panel); border:1px solid #3a2d4d; border-radius:12px; padding:6px 10px; margin-bottom:6px; cursor:pointer;}
  #hud:hover{border-color:#5a4a73;}
  #hud.hoarding{background:linear-gradient(180deg,#5a4420,#382913); border-color:#d9b24d; box-shadow:0 0 0 1px rgba(241,196,15,.16), 0 6px 18px rgba(241,196,15,.12);}
  #hud.hoarding:hover{border-color:#f1c40f;}

  .bar{height:13px; border-radius:7px; background:#15101e; overflow:hidden; position:relative;}
  .bar > i{display:block; height:100%; transition:width .25s; }
  .bar > span{position:absolute; inset:0; font-size:10px; text-align:center; line-height:13px; color:#fff; text-shadow:0 1px 2px #000;}
  .row{display:flex; align-items:center; gap:6px; margin:3px 0;}
  .row .lbl{width:54px; font-size:11px; color:var(--dim);}
  .stats{display:flex; justify-content:space-between; margin-top:5px; font-size:12px;}
  .stats b{color:var(--gold);}
  .mini{font-size:10px; color:var(--dim); margin-top:4px; line-height:1.4;}

  /* board */
  #board{display:block; width:100%; touch-action:none; border-radius:12px;
         background:var(--panel2); border:1px solid #3a2d4d;}
  #log{font-size:11px; color:var(--dim); height:44px; box-sizing:border-box; overflow:hidden; margin:6px 0; line-height:1.4; cursor:pointer;
       background:var(--panel2); border:1px solid #3a2d4d; border-radius:10px; padding:5px 9px;}
  #log:hover{border-color:#6a4fa3;}

  /* shop */
  #shop{display:flex; gap:6px; margin:6px 0 0;}
  .shopBtn{flex:1; background:var(--panel2); border:1px solid #3a2d4d; border-radius:10px;
           color:var(--txt); padding:6px 3px; cursor:pointer; display:flex; flex-direction:column;
           align-items:center; gap:1px; font-size:12px; transition:.15s;}
  .shopBtn em{font-style:normal; font-size:11px; color:var(--gold);}
  .shopBtn small{font-size:10px; color:var(--dim); line-height:1.2;}
  /* .off = 视觉禁用（不可买/冷却中）；仍接收 pointer 事件，长按可看说明（点击由 buyItem/activateSkill 自行拦截） */
  .shopBtn.off{opacity:.38; cursor:not-allowed;}
  .shopBtn:not(.off):hover{border-color:var(--gold); transform:translateY(-1px);}

  /* 职业主动技能按钮：复用 shopBtn 布局，仅换配色 */
  .shopBtn.skillBtn{background:linear-gradient(160deg,#5a2e85,#7d3cad); border-color:#c08bff; color:#fff; font-weight:700;}
  .shopBtn.skillBtn em{color:#e7c9ff;}
  .shopBtn.skillBtn:not(.off):hover{border-color:#e6c2ff;}

  /* overlay */
  #overlay{position:fixed; inset:0; background:rgba(10,6,18,.82); backdrop-filter:blur(3px);
           display:none; align-items:center; justify-content:center; z-index:10;}
  #overlay.show{display:flex;}
  .card{background:var(--panel); border:1px solid #4a3a63; border-radius:16px; padding:20px;
        width:90%; max-width:380px; text-align:center; box-shadow:0 10px 40px #000;
        max-height:88vh; overflow-y:auto;}   /* 内容超一屏时卡片内部可上下滑动（兜底，长列表如 350 跨界技能不再顶出屏外） */
  .card h2{margin:0 0 4px; color:var(--gold);}
  .card p{color:var(--dim); font-size:13px; margin:0 0 14px;}
  .choice{display:block; width:100%; text-align:left; background:var(--panel2);
          border:1px solid #4a3a63; color:var(--txt); border-radius:12px; padding:12px 14px;
          margin:8px 0; cursor:pointer; transition:.15s; font-size:14px;}
  .choice:hover{background:#3a2d50; border-color:var(--gold); transform:translateY(-1px);}
  .choice b{display:block; font-size:15px; margin-bottom:2px;}
  .choice small{color:var(--dim);}
  .btn{background:var(--gold); color:#2a1f10; font-weight:700; border:none; border-radius:12px;
       padding:12px 20px; font-size:15px; cursor:pointer; margin-top:8px;}
  .footer{font-size:10px; color:var(--dim); text-align:center; margin-top:7px; line-height:1.4;}

  /* 低血危险渐晕 */
  #vignette{position:fixed; inset:0; pointer-events:none; z-index:5; opacity:0;
            transition:opacity .35s;
            background:radial-gradient(circle at 50% 50%, transparent 35%, #e74c3c 130%);}
  #vignette.pulse{animation:dangerPulse 1.1s ease-in-out infinite;}
  @keyframes dangerPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.6);}}
  /* 低血时生命条闪烁 */
  #hpBar.low{animation:hpBlink 1.1s ease-in-out infinite;}
  @keyframes hpBlink{0%,100%{filter:brightness(1);opacity:1;}50%{filter:brightness(1.7);opacity:.55;}}
  /* 回放控制条 */
  #replayBar{display:none; position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:#241b30; border-top:1px solid #6a4fa3; padding:7px 10px;
    flex-direction:column; gap:6px; font-size:12px; color:#d9ccff;}
  #replayBar.show{display:flex;}
  #replayBar .rbRow{display:flex; align-items:center; gap:7px;}
  #rbJumps{display:flex; flex-wrap:wrap; gap:5px; align-items:center;}
  #rbJumps:empty{display:none;}
  #rbJumps .rbLbl{color:var(--dim); font-size:11px;}
  #replayBar .rbProg{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #replayBar .rbBar{height:6px; border-radius:4px; background:#15101e; overflow:hidden;}   /* 独占一行，永不被按钮挤压 */
  #replayBar .rbBar > i{display:block; height:100%; background:#7d3cad; width:0;}
  #replayBar button{background:#2f2440; color:#d9ccff; border:1px solid #6a4fa3; border-radius:8px;
    padding:4px 9px; font-size:12px; cursor:pointer; flex:none;}
  #replayBar button.on{background:#7d3cad; color:#fff; border-color:#c08bff;}
  #replayBar button.dim{opacity:.3; cursor:not-allowed;}   /* 步进键到边界变灰 */
  #replayBar button.hide{visibility:hidden;}   /* 步进键非暂停时隐藏但保留占位，避免挤动其它按钮 */
  #replayBar button:hover{border-color:#c08bff;}
</style>
</head>
<body>
<div id="wrap">
  <button id="langBtn">EN</button>
  <h1 id="title">　　🏰 地牢突袭·网页版</h1>

  <div id="hud">
    <div class="row"><span class="lbl" id="lblHp">生命</span>
      <div class="bar" style="flex:1"><i id="hpBar" style="background:var(--hp)"></i><span id="hpTxt"></span></div>
    </div>
    <div class="row"><span class="lbl" id="lblAr">护甲</span>
      <div class="bar" style="flex:1"><i id="arBar" style="background:var(--armor)"></i><span id="arTxt"></span></div>
    </div>
    <div class="row"><span class="lbl" id="lblXp">经验</span>
      <div class="bar" style="flex:1"><i id="xpBar" style="background:var(--xp)"></i><span id="xpTxt"></span></div>
    </div>
    <div class="stats">
      <span><span id="lblLv">等级</span> <b id="lvTxt">1</b></span>
      <span>💰 <b id="goldTxt">0</b></span>
      <span><span id="lblTurn">回合</span> <b id="turnTxt">0</b></span>
    </div>
    <div class="mini" id="bonusTxt"></div>
    <div id="hudHint" style="text-align:right; font-size:10px; color:var(--gold); margin-top:2px;">ⓘ 点击查看属性 / 职业详情</div>
  </div>

  <div id="log"></div>

  <canvas id="board"></canvas>

  <div id="shop">
    <button id="skillBtn" class="shopBtn skillBtn" style="display:none"><span></span><small></small><em></em></button>
    <button class="shopBtn" data-buy="heal"><span id="shHealName">💊 治疗</span><small id="shHealDesc">回复10生命</small><em></em></button>
    <button class="shopBtn" data-buy="bomb"><span id="shBombName">💥 炸弹</span><small id="shBombDesc">全场怪-5血</small><em></em></button>
  </div>

  <div id="tapHint" style="text-align:center; font-size:10.5px; color:var(--dim); margin-top:6px;"></div>
  <div id="ver" style="text-align:center; font-size:11px; color:var(--dim); margin-top:3px; letter-spacing:1px; cursor:pointer;"></div>
</div>

<div id="vignette"></div>
<div id="overlay"><div class="card" id="card"></div></div>

<div id="replayBar">
  <div class="rbRow">
    <span id="rbTxt" class="rbProg">🎬 回放</span>
    <button id="rbPrev" title="上一回合">◀</button>
    <button id="rbNext" title="下一回合">▶</button>
    <button class="rbSpd" data-spd="1">1×</button>
    <button class="rbSpd" data-spd="2">2×</button>
    <button class="rbSpd" data-spd="4">4×</button>
    <button id="rbExit">⏹</button>
  </div>
  <div class="rbBar"><i id="rbFill"></i></div>
  <div id="rbJumps"></div>
</div>

<script>
(()=>{
//==================== 配置 ====================
// 版本号 v主.次.修：不影响 verify/replay 兼容边界的小改动改"修"；凡是影响 verify/replay/版本分桶/release 验证语义的改动都改"次"；大版本变更需先确认。页面底部显示。
const VERSION='v1.56.4';
const CHANGELOG_LINES=[{"ver": "v1.56.4", "zh": "修正了回放跳转 / 步进时可能残留召唤师召唤线特效的问题：召唤师的纯视觉 SVG 连线现在和其它拉线特效一样，会在无头与回放快进阶段被抑制，并在退出回放或跳转回合时统一清理临时特效层，避免之前一路快进过的紫色召唤线堆在当前画面上。该修复只影响视觉特效，不改召唤结果、回合顺序、数值，也不影响录像 / verify 兼容。", "en": "Fixed a replay visual cleanup issue where Summoner summoning tethers could linger after replay jumps or step navigation. The Summoner’s SVG-only tether effect is now suppressed during headless / replay fast-forward paths like other tether effects, and transient effect layers are cleared when leaving replay or jumping turns, so purple lines from fast-forwarded turns no longer pile onto the current view. This only affects visuals, not spawn results, turn order, numbers, replay, or verify compatibility."}, {"ver": "v1.56.3", "zh": "下调了人类榜自动改判到 AI 榜的门槛：GitHub Actions 现在会把前 200 条人类榜录像里所有 `score >= 25` 的条目都自动改判到 AI 榜，而不再只处理 `Very High / score >= 65`。`Low / Medium / High / Very High` 这四档仍然保留为“可疑度标签”，不再等同于是否会自动改判；因此新策略会更激进，一部分 `Medium` / `High` 风险录像也会直接移到 AI 榜。此改动属于榜单运营策略调整，不改录像回放、战斗数值或 verify 语义。", "en": "Lowered the automatic human→AI leaderboard reclassification line: GitHub Actions now auto-reclassifies every top-200 human-board replay with `score >= 25` to the AI board, instead of only handling `Very High / score >= 65`. The existing `Low / Medium / High / Very High` buckets are still kept as suspicion labels only, so they no longer match the final reclassification boundary one-to-one; under this more aggressive policy, some `Medium` / `High` recordings will also move straight to the AI board. This is a leaderboard-operations policy change only — no replay engine, combat math, or verify semantics are altered."}, {"ver": "v1.56.2", "zh": "修正了 350 级跨界主动的一个纯视觉问题：当你把狙击这类带“从技能按钮发出连线”特效的主动换到 💊 治疗槽或 💥 炸弹槽后，连线现在会从实际占用的那个槽位发出，而不再错误地总是从左侧的一阶主动技能按钮发出。该修复只影响特效起点，不改技能效果、数值、顺序，也不影响录像 / verify 兼容。", "en": "Fixed a visual-origin bug for 350-level crossover actives: if you swap a beam/tether-style active such as Snipe into the 💊 Heal slot or 💥 Bomb slot, the effect now starts from the actual occupied slot instead of incorrectly always firing from the left-side tier-1 active button. This only changes the effect origin, not the skill’s behavior, numbers, turn order, or replay / verify compatibility."}, {"ver": "v1.56.1", "zh": "调整了火枪手（Musketeer）的俏皮话文案：把那句台词收紧为「有人为你出了个好价钱。」/ “Someone put a good price on you.”，去掉前缀式的“狙击—— / Snipe —”，让口吻更自然一点。这是纯文本润色，不改数值、顺序，也不影响录像 / verify 兼容。", "en": "Tightened the Musketeer quip text to “有人为你出了个好价钱。” / “Someone put a good price on you.”, removing the prefixed “狙击—— / Snipe —” so the line reads more naturally. This is text-only polish — no stat, turn-order, replay, or verify behavior changes."}, {"ver": "v1.56.0", "zh": "下调了斧王（Axe Lord）主动「嘲讽 Taunt」在承受集火时的滚雪球强度：现在在那一轮被你主动拉来的攻击中，只有实际伤害的 10% 会转化为永久最大生命，并保留至少 +1 的下限；原先是 50%。这样它仍然保留“挨打换成长”的职业身份，但不会再那么容易靠一轮集火把生命上限抬得过快。由于这个数值会改变同种子 + 同操作序列下的实际结局，这次按 verify / replay 影响处理，升 minor 并开启新的版本桶。", "en": "Nerfed Axe Lord’s active Taunt so its taunt-window snowball is much smaller: during the forced enemy volley, only 10% of the actual damage you take is now converted into permanent max HP, while still keeping the minimum +1 floor; previously it was 50%. That preserves the skill’s “get hit to grow” identity without letting a single focus-fire turn inflate max HP so aggressively. Because this value can change the real outcome of the same seed + action sequence, this release is treated as verify / replay impacting and therefore bumps the minor version bucket."}];   /* auto-injected by dr.sh embed-changelog（勿手改） */
const DEV=true;   // release build (DEV=false); dev build is dungeon-raid-dev.html (DEV=true)
const REC_API='https://api.dungeonraid.win';   // 录像分享 API（Cloudflare Worker + KV）
// 带种子随机数（mulberry32）：游戏全程用 rnd() 取代原生随机，配合录制种子可确定性重放
let __rng=null, __rngState=0;
function srand(s){ __rngState=s>>>0; __rng=()=>{ __rngState|=0; __rngState=__rngState+0x6D2B79F5|0; let t=Math.imul(__rngState^__rngState>>>15,1|__rngState); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rnd(){ if(!__rng) srand((Date.now()>>>0)^0x9e3779b9); return __rng(); }
const COLS=6, ROWS=6, PAD=8;
let TILE=70;                       // 实际按画布宽度自适应
// 显式 emoji 字体栈：让 canvas 测量宽度与彩色 emoji 实际渲染一致（移动端居中更稳）
// 注：心/盾已改用原生彩色 emoji 💗/🔰（不带 FE0F 变体符），避免老符号在 canvas 里居中偏移
const EMOJI_FONT="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
const DEF = {
  sword:  {emoji:'🔪', color:'#e74c3c', glow:'#ff7a6b', name:'剑'},
  shield: {emoji:'🔰', color:'#3498db', glow:'#6fb6ff', name:'盾'},
  heart:  {emoji:'💗', color:'#e84393', glow:'#ff85c0', name:'心'},
  coin:   {emoji:'💰', color:'#f1c40f', glow:'#ffe07a', name:'金'},
  enemy:  {emoji:'👹', color:'#7d3cad', glow:'#c08bff', name:'怪'},
  boss:   {emoji:'👻', color:'#1f6f5c', glow:'#7fffd4', name:'Boss'},
};
// 各种族的武器（攻击格图标 + 名称）：人族剑 / 精灵箭 / 矮人锤 / 兽人斧 / 活死人骨
const WEAPON={
  human: {e:'🔪', n:['剑','Sword']},
  elf:   {e:'🏹', n:['箭','Arrow']},
  dwarf: {e:'🔨', n:['锤','Hammer']},
  orc:   {e:'🪓', n:['斧','Axe']},
  undead:{e:'🦴', n:['骨','Bone']},
};
function weap(){ return WEAPON[player&&player.race] || WEAPON.human; }
function wE(){ return weap().e; }                                       // 武器 emoji（攻击格图标）
function wN(){ return tr(weap().n[0], weap().n[1]); }                   // 武器名（本地化）：剑/箭/锤/斧/骨（用 tr 避免与 L 的 token 替换递归）
function wChain(){ return tr(weap().n[0]+'链', weap().n[1]+' chain'); } // 武器链：剑链/箭链/锤链/斧链/骨链
const CONNECTABLE=['sword','shield','heart','coin'];
// 无甲种族（兽人）盾牌是死格，从生成池里移除
function connectablePool(){ return (player&&player.noArmor) ? ['sword','heart','coin'] : CONNECTABLE; }

//==================== 多语言 ====================
let lang = (()=>{ try{
    const saved=localStorage.getItem('dr_lang');
    if(saved==='en'||saved==='zh') return saved;          // 用过就记住选择
    const nav=((navigator.language||navigator.userLanguage||'')+'').toLowerCase();
    return nav.indexOf('zh')===0 ? 'zh' : 'en';            // 首次访问跟随浏览器语言
  }catch(e){ return 'zh'; } })();
const tr = (zh,en)=> lang==='en' ? en : zh;            // 行内双语：渲染时取值
const L  = (x)=>{ let s = Array.isArray(x) ? tr(x[0],x[1]) : x;        // 数据字段：[中文, English]
  return (typeof s==='string' && s.indexOf('{W')>=0) ? s.replace(/\{WC\}/g, wChain()).replace(/\{W\}/g, wN()) : s; };  // 武器 token：{W}=武器名、{WC}=武器链（按种族）
let installPromptEvt=null;
function setLang(l){
  lang = l==='en'?'en':'zh';
  try{ localStorage.setItem('dr_lang',lang); }catch(e){}
  const lb=document.getElementById('langBtn'); if(lb) lb.textContent = lang==='en'?'中文':'EN';
  applyStaticLang();
  logClear();   // 日志条目已是翻译好的定文（含 −5 等动态值），切语言无法逐条回译——清空，后续事件按新语言记
  if(player) updateHUD();
  // 选职业界面正开着 → 用新语言重绘
  if(!grid && document.getElementById('overlay').classList.contains('show')) showClassSelect();
}
// 更新 HTML 里的静态文字（标签/底部说明/商店按钮基础文案）
function applyStaticLang(){
  const set=(id,txt)=>{ const el=document.getElementById(id); if(el) el.textContent=txt; };
  if(document.documentElement) document.documentElement.lang = lang==='en'?'en':'zh-CN';
  const tt=document.getElementById('title');
  if(tt) tt.innerHTML = tr('　　🏰 地牢突袭·网页版','　　🏰 Dungeon Raid · Web');
  set('lblHp', tr('生命','HP'));
  set('lblAr', tr('护甲进度','Armor XP'));

function enemyStats(){
  const lv=player.level;
  return {
    hp: 3 + Math.floor(rnd()*3) + Math.floor(lv*0.7),   // lv1≈3~5, lv10≈10~12, lv20≈17~19
    atk: 2 + Math.floor(lv*1.1),                                // lv1=2, lv5=7, lv10=13, lv20=24（提斜率，避免后期护甲碾压攻击）
    baseCd: 3 + Math.floor(rnd()*2),                    // 3~4（裸种族开局期更宽容）
  };
}

// 死局判负：无棋可连且无就绪改盘动作 → 直接判负（不再卡死）。有任一弹层待处理时不调用。返回是否已判负。
function checkDeadlock(){

// 随机把 n 个棋子重洗成新的随机【资源】棋子（只出剑/盾/心/金，不出怪——出怪是召唤师的活，避免小丑与之重合）
function scrambleTiles(n, excludeTypes){
  const cells=[];
  const excl = excludeTypes||['boss'];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(t && !excl.includes(t.type)) cells.push([r,c]); }
  for(let i=cells.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [cells[i],cells[j]]=[cells[j],cells[i]]; }
  const k=Math.min(n,cells.length), pool=connectablePool();
  for(let i=0;i<k;i++){ const [r,c]=cells[i]; const nt=makeTile(pool[Math.floor(rnd()*pool.length)]); nt.curY=cellY(r); grid[r][c]=nt; }   // 指定资源类型→绝不滚出怪
  syncPositions(false);
  return k;
}
// 新职业被动：每回合摆盘后，把至多 n 个 fromTypes 棋子转成 toType（巫医→心、剑圣→剑）。用 rnd 确定性洗牌，回放可复现。
function convertTiles(n, toType, fromTypes, mark){
  const cells=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(t && fromTypes.includes(t.type)) cells.push([r,c]); }
  for(let i=cells.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [cells[i],cells[j]]=[cells[j],cells[i]]; }
  const k=Math.min(n,cells.length);
  for(let i=0;i<k;i++){ const [r,c]=cells[i]; const nt=makeTile(toType); nt.curY=cellY(r); if(mark) mark(nt); grid[r][c]=nt; }
  return k;
}
function spawnBoss(force, exclude){
  if(!force && hasBoss()) return null;        // 普通：同时只存在一个 Boss；force=true 时允许多个（350后双 Boss）
  const cells=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(t && t.type!=='boss') cells.push([r,c]); }   // 不覆盖已有 Boss
  if(!cells.length) return null;
  const [r,c]=cells[Math.floor(rnd()*cells.length)];
  let def=randomBossDef();   // 排除终焉之主（noRandom）
  const _ms=[50,100,200,350].includes(player.turns);   // 里程碑回合：排除小偷（跑了学不了技能）
  if(exclude || _ms){ let tries=0; while(((exclude && def.id===exclude)||(_ms&&def.id==='thief'))&& tries<8){ def=randomBossDef(); tries++; } }
  const tier=bossTier();
  const s = def.monster ? enemyStats() : bossStats();   // 怪属性型 Boss 用怪物数值
  const cdv = (s.cd!=null ? s.cd : s.baseCd) + extraFoeCd();
  const mult = def.noTierScale ? 1 : tier;              // 刺客等：血量/攻击始终同级怪物，不吃档位倍率
  const hp=s.hp*mult, atk=s.atk*mult;
  grid[r][c]={type:'boss', bossId:def.id, tier, hp, maxHp:hp, atk, cd:cdv, baseCd:cdv};
  addBossFx(r,c,false);
  const tlabel = ` Lv${tier}`;   // 始终标注档位（含一阶 Lv1）
  log(tr(`${def.emoji} Boss【${L(def.name)}】${tlabel} 现身！轻点它查看打法。`,`${def.emoji} Boss [${L(def.name)}]${tlabel} appears! Tap it to see how to fight.`), 'bad');
  if(def.onSpawn) def.onSpawn(grid[r][c]);
  return def.id;
}

function makeTile(type){
  if(type===undefined){
    const pool=connectablePool();
    type = rnd()<enemyChance() ? 'enemy'
         : pool[Math.floor(rnd()*pool.length)];
  }
  const t={type};
  if(type==='enemy'){ const s=enemyStats(); t.hp=s.hp; t.maxHp=s.hp; t.atk=s.atk; const bc=s.baseCd+extraFoeCd(); t.cd=bc; t.baseCd=bc; }
  return t;
}

      else { p.xp+=(3+(p.killXp||0))*3; gainGold(1*3); if(p.rotflesh)p.maxHp++; }   // 击杀 3 倍奖励（普通怪）
      lh=lifestealHeal(1); applyGravity(); syncPositions(false);
    }
    log(tr(`🎯 狙击：对最肥目标 −${dealt}`+(killed?`，击杀！3 倍奖励`:'')+(lh?`，吸血 +${lh}`:''),`🎯 Snipe: −${dealt} to the toughest foe`+(killed?`, killed! triple rewards`:'')+(lh?`, +${lh} lifesteal`:''))); return true; }}},
  berserker:{n:['牛头人','Tauren'], quip:['疼？疼说明这刀还能更快。','Pain just means I can swing faster.'], skill:{name:['狂怒','Frenzy'], short:['本回合不死+残血增伤','Undying this turn + low-HP dmg'], desc:['立即把当前生命减半，本回合进入「不屈」：无论受到多少伤害都至少保留 1 血；且本回合血越少{W}伤害越高（最多 +60%）。只持续本回合。','Halves your current HP and grants Undying this turn: you keep ≥1 HP no matter the damage, and the lower your HP the higher your {W} damage (up to +60%). This turn only.'], cd:5, f:p=>{ p.hp=Math.max(1,Math.floor(p.hp/2)); p.lowHpDmg=true; p.undyingTurn=true; log(tr(`${wE()} 狂怒！生命减半并进入不屈（本回合无论受多少伤都保留 1 血），血越少${wN()}伤越高`,`${wE()} Frenzy! HP halved and Undying this turn (keep ≥1 HP no matter the damage); lower HP, higher ${wN()} damage`), 'buff'); return true; }}} ,
  axelord:{n:['斧王','Axe Lord'], quip:['群殴？一起上吧。','All at once? Come on, then.'], skill:{name:['嘲讽','Taunt'], short:['全场敌人下回合立刻攻击','All foes attack next turn'], desc:['使场上所有敌人/Boss（终焉之主除外）的攻击倒计时变为 1，也就是它们会在下回合立刻攻击。接下来这批攻击中，你受到的实际伤害有 10% 会转化为永久最大生命（至少 +1）。','Sets the attack countdown of all enemies/bosses on the board (excluding the Overlord) to 1, so they will attack on the next turn. During those attacks, 10% of the actual damage you take is converted into permanent max HP (minimum +1).'], cd:5, f:p=>{ let hit=0; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(t&&(t.type==='enemy'||(t.type==='boss'&&!t.finale))){ t.cd=1; hit++; } } if(!hit) return false; p.tauntWindow=true; log(tr('🪓 嘲讽：全场敌人下回合立刻攻击，你受到的实际伤害有 10% 会转化为永久最大生命（至少 +1）','🪓 Taunt: all foes attack next turn, and 10% of the actual damage you take becomes permanent max HP (minimum +1)'), 'buff'); return true; }}},
  fighter:{n:['斗士','Fighter'], quip:['越打越精神，血是我的能量饮料。','The more I fight, the better I feel.'], skill:{name:['嗜血','Bloodthirst'], short:['每命中吸3血+本回合可攻击{W}免疫怪','+3 HP per hit + pierce {W}-immunity'], desc:['本回合的{W}攻击附带两个效果：① 每命中一只怪/Boss 回复 3 点生命（按命中数算，不是击杀数）；② 可以打到平时{W}免疫的 Boss（幽灵/小丑/雪人/污染怪等，终焉之主除外）。只持续本回合，本回合不出{W}就浪费。','This turn your {W} attack gains two effects: (1) heal 3 HP per foe you hit (by hits, not kills); (2) it can strike normally {W}-immune bosses (Ghost/Clown/Snowman/Corruptor…; not the Overlord). This turn only — wasted if you make no {W} attack.'], cd:5, f:p=>{ p.bloodthirst=1; p.pierceTurn=true; log(tr(`🩸 嗜血：本回合${wChain()}每击中一只怪回 3 血，且可用${wN()}攻击${wN()}免疫的 Boss（幽灵/小丑）`,`🩸 Bloodthirst: heal 3 per enemy hit this turn, and your ${wN()} can hit ${wN()}-immune bosses (Ghost/Clown)`), 'buff'); return true; }}},
  witchdoctor:{n:['巫医','Witch Doctor'], quip:['你的心意我收下，怪替你喝。','Your love? The monsters drink it for you.'], skill:{name:['蛊毒','Hex'], short:['全场心燃成黑毒心','Burn hearts → black poison'], desc:['把棋盘上所有的红心当场燃成黑毒心（🖤）。之后连接黑毒心不回血，而是把这些生命当毒灌给场上所有怪/Boss（含{W}免疫的，终焉之主除外，与炸弹同口径）。毒伤 = 心数 × 每颗心回复量 × 连击。场上没有心时无效、不进冷却。','Burns every red heart on the board into a black poison heart (🖤) on the spot. Linking a black heart heals nothing — it poisons every foe instead (incl. {W}-immune; not the Overlord, same reach as the Bomb). Poison = hearts × heal-per-heart × combo. No effect — and no cooldown — if there are no hearts.'], cd:5, f:p=>{ let n=0; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(t&&t.type==='heart'&&!t.poison){ t.poison=true; n++; } } if(!n) return false; syncPositions(false); log(tr(`🧪 蛊毒：${n} 颗心燃成黑毒心（连它们毒灌全场怪、不回血）`,`🧪 Hex: ${n} hearts burned into black poison (link them to poison all foes, no heal)`), 'buff'); return n; }}},
  swordsaint:{n:['剑圣','Sword Saint'], quip:['在我眼里，万物皆可开刃。','In my eyes, anything can be a blade.'], skill:{name:['化剑','Bladeshift'], short:['全场心/金币→剑','Hearts & coins → swords'], desc:['把棋盘上所有的心和金币都变成{W}，便于接出更长的{W}链打出爆发。场上没有心/金币时无效、不进冷却。','Turns every heart and coin on the board into {W}s so you can chain longer for a burst. No effect — and no cooldown — if there are none.'], cd:5, f:p=>{ let n=0; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(t&&(t.type==='heart'||t.type==='coin')){ t.type='sword'; n++; } } if(!n) return false; log(tr(`⚔️ 化剑：${n} 个心/金币化为剑`,`⚔️ Bladeshift: ${n} hearts/coins → swords`), 'buff'); return n; }}},
  necromancer:{n:['死灵','Necromancer'], quip:['你的魂，我借来续命。','Your soul keeps me going. Thanks.'], skill:{name:['吸魂大法','Soul Drain'], short:['随机吸 2 个目标的生命补自己','Drain 2 random targets to heal'], desc:['随机选 2 个目标下手——普通怪或 Boss 都行，<b>含 {W} 免疫的特殊 Boss</b>（幽灵/小丑/污染怪/雪人），仅终焉之主除外。<br>对每个目标，吸取「你当前生命上限」与「它当前血量」里<b>较小</b>的那个：所以<b>吸力随你的生命上限成长</b>——上限越高，单发吸得越狠、越容易一发吸死（吸取量 ≥ 它血量即死亡）。<br>吸到的生命总量给你回血，<b>封顶在生命上限</b>（活死人「一切治疗减半」对这部分也生效）。<br>协同：① 学了「溅射」，被吸死目标多出的吸力（你的上限 − 它血量）会溅到剩余的一个敌人；② 击杀同样会触发「汲取生命」（前提是你还有血量空间）。<br>打法：应急回血 + 专治 {W} 免疫 Boss；越堆生命上限（巨力等）越强。','Drains 2 random targets — regular monsters or bosses alike, <b>including {W}-immune special bosses</b> (Ghost/Clown/Corruptor/Snowman); only the Overlord is exempt.<br>From each it takes the <b>lesser</b> of your current max HP and the target’s current HP — so its power <b>scales with YOUR max HP</b>: the higher your cap, the harder each drain hits and the more likely it kills outright (drain ≥ its HP = dead).<br>The total drained heals you, <b>capped at your max HP</b> (Undead’s halved-healing applies here too).<br>Synergy: (1) with Splash, a lethal drain’s leftover power (your max HP − its HP) splashes to one more foe; (2) kills also trigger Drain Life (if you have HP to spare).<br>Play: emergency healing + a hard counter to {W}-immune bosses; scales with max-HP builds (Titan, etc.).'], cd:5, f:p=>{
    const foes=[]; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(t&&(t.type==='enemy'||(t.type==='boss'&&!t.finale))) foes.push([r,c]); }
    if(!foes.length) return false;
    for(let i=foes.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [foes[i],foes[j]]=[foes[j],foes[i]]; }
    let healed=0, kills=0; const pick=foes.slice(0,2); const splashes=[];
    for(const [r,c] of pick){ const t=grid[r][c]; const before=t.hp; const drain=Math.min(p.maxHp, before); t.hp-=drain; healed+=drain; statueReflect(t, drain);   // 石像：吸魂的伤害也会反弹
      if(t.hp<=0){ const isB=t.type==='boss'; grid[r][c]=null; kills++; if(isB){thiefRecover(t);p.xp+=15;gainGold(20);onBossKilled();} else {p.xp+=3+(p.killXp||0);gainGold(1);}
        if(p.splash && p.maxHp>before) splashes.push(p.maxHp-before); } }   // 溅射：吸魂的溢出（吸力上限−目标血量）也砸向剩余敌人
    holdNextGravity(); holdVisibleBoard();
    soulDrainFx(pick);   // 特效：从每个被吸目标的格子画一条红线指向血条（纯视觉，不影响逻辑/重放）
    let splashK=0; for(const over of splashes){ splashK+=splashHit(over).kills; }   // 溅射独立结算（含剑免疫 Boss，排除终焉）
    kills+=splashK;
    const h=gainHeal(healed); const lh=lifestealHeal(kills); applyGravity(); syncPositions(false);
    log(tr(`🪄 吸魂大法：吸取 ${pick.length} 个目标 ${healed} 生命，回血 ${h}`+(kills?`，击杀 ${kills} 只`:'')+(lh?`，吸血 +${lh}`:'')+(splashes.length?`，溅射 ${splashes.length} 次`:''),`🪄 Soul Drain: drained ${healed} from ${pick.length}, +${h} HP`+(kills?`, ${kills} killed`:'')+(lh?`, +${lh} lifesteal`:'')+(splashes.length?`, ${splashes.length} splash`:'')), 'heal'); return true; }}},
  skeletonking:{n:['骷髅王','Skeleton King'], quip:['死过一次，再死一次又何妨。','Died once already — what is one more?'], skill:{name:['重生','Rebirth'], short:['本回合致死则满血复活(此后冷却+2)','Cheat death this turn, full heal'], desc:['发动后本回合若受到致命伤害，会立刻满血复活而非死亡。每触发一次，重生的冷却永久 +2。发动即进入冷却（无论本回合是否真的触发）。','Armed this turn: if a lethal blow lands, you revive at full HP instead of dying. Each trigger permanently raises Rebirth’s cooldown by 2. Goes on cooldown when cast, whether or not it triggers.'], cd:5, f:p=>{ p.rebirthTurn=true; log(tr('💀 重生待命：本回合若被击败，将满血复活！','💀 Rebirth armed: if slain this turn, revive at full HP!'), 'buff'); return true; }}},
  lich:{n:['巫妖','Lich'], quip:['感受死亡的寒冷吧。','Feel the cold of death.'], skill:{name:['冰封球','Frost Orb'], short:['全场固定伤害+全体减速','Flat damage + slow all foes'], desc:['对场上所有怪物/Boss（终焉之主除外）造成一次当前固定伤害，并让它们的当前攻击倒计时 +1。也就是说，它们下一次出手会额外慢一回合；被减速的目标会短暂染上冰蓝底色。属于冰霜攻击，可命中剑免疫 Boss。','Deals your current flat damage once to all monsters/bosses on the board (excluding the Overlord), then adds +1 to their current attack countdown. In other words, their next attack is delayed by one extra turn, and slowed targets are briefly tinted icy blue. This is a frost attack and can hit sword-immune bosses.'], cd:5, f:p=>{ addBossFx(Math.floor(ROWS/2), Math.floor(COLS/2), false, '#7fd3ff', true); let hit=0, kills=0, total=0, lh=0; const dmg=frostOrbDamage(); for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(!t||t.finale||!(t.type==='enemy'||t.type==='boss')) continue; const before=t.hp; t.hp-=dmg; t.cd+=1; t.frostTurns=3; hit++; total+=Math.min(dmg, before); if(t.hp<=0){ const isB=t.type==='boss'; grid[r][c]=null; kills++; if(isB){ thiefRecover(t); player.xp+=15; gainGold(20); onBossKilled(); } else { player.xp+=3+(player.killXp||0); gainGold(1); } } } if(kills) lh=lifestealHeal(kills); applyGravity(); syncPositions(false); log(tr(`🧊 冰封球：全场 ${hit} 个目标共掉 ${total}`+(kills?`，击杀 ${kills}`:'')+(lh?`，吸血 +${lh}`:'')+`，下一次出手更慢`,`🧊 Frost Orb: ${hit} targets lose ${total}`+(kills?`, ${kills} killed`:'')+(lh?`, +${lh} lifesteal`:'')+`, next attacks delayed`), 'buff'); return hit||kills||lh; }}},
  butcher:{n:['屠夫','Butcher'], quip:['钩子一甩，肉就乖乖到底。','One swing of the hook, and the meat comes to me.'], skill:{name:['钩子','Hook'], short:['拉到底排；离底越远伤害越高','Drag down; farther from bottom = more damage'], desc:['一钩把棋盘上所有的怪和 Boss（含{W}免疫，终焉之主除外）顺着各自所在列拉到尽可能底部，其余棋子上浮；随后按【离底线的距离】造成伤害：最底排吃 1× 固定伤害、倒数第二排吃 2×，依此类推。场上没有可拉的敌人时无效、不进冷却。','Hooks every monster & boss (incl. {W}-immune; not the Overlord) down to the bottom of its column while other tiles float up; then deals damage by【distance from the bottom】— bottom row takes 1× flat damage, second-from-bottom 2×, and so on. No effect — and no cooldown — when there is nothing to pull.'], cd:5, f:p=>{
    let moved=0, any=false, dmg=0, kills=0; const isMon=t=>t&&(t.type==='enemy'||t.type==='boss')&&!t.finale; const hookBase=Math.max(1, p.swordFlat||0); const lines=[];
    for(let c=0;c<COLS;c++){
      const col=[]; for(let r=0;r<ROWS;r++) col.push(grid[r][c]); if(!col.some(isMon)) continue; any=true;
      const mons=[]; for(let r=0;r<ROWS;r++){ const t=grid[r][c]; if(isMon(t)) mons.push({tile:t, from:r}); }
      const newCol=col.filter(t=>!isMon(t)).concat(col.filter(isMon));   // 非敌上浮、敌沉底
      const byTile=new Map(); for(let r=0;r<ROWS;r++){ const t=newCol[r]; if(isMon(t)) byTile.set(t,r); }
      for(const m0 of mons){ const to=byTile.get(m0.tile); if(to!=null && to!==m0.from) lines.push({c1:c,r1:m0.from,c2:c,r2:to}); }
      for(let r=0;r<ROWS;r++){ if(grid[r][c]!==newCol[r]) moved++; grid[r][c]=newCol[r]; }
    }
    if(lines.length) addHookFx(lines);
    if(!any) return false;
    for(let r=ROWS-1;r>=0;r--)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(!isMon(t)) continue;
      const hit=Math.min(t.hp, hookBase*(ROWS-r)); t.hp-=hit; dmg+=hit; statueReflect(t, hit);
      if(t.hp<=0){ const isB=t.type==='boss'; grid[r][c]=null; kills++; if(isB){ thiefRecover(t); player.xp+=15; gainGold(20); onBossKilled(); } else { player.xp+=3+(player.killXp||0); gainGold(1); if(player.rotflesh) player.maxHp++; } } }
    const lh=lifestealHeal(kills); applyGravity(); syncPositions(false);   // 满盘时 applyGravity 为空操作、不消耗 RNG；纯重排，重放确定
    log(tr(`🪝 钩子：把全场怪/Boss 拉到底排，造成 ${dmg} 伤害`+(kills?`，击杀 ${kills}`:'')+(lh?`，吸血 +${lh}`:''),`🪝 Hook: dragged all foes down for ${dmg} damage`+(kills?`, ${kills} killed`:'')+(lh?`, +${lh} lifesteal`:'')), moved?'buff':''); return true; }}},
};

  general:{n:['将军','General'], d:['升级时四选一','Level-up offers 4 choices'], f:p=>{ p.upgradeChoices=4; }},
  firewall:{n:['火墙','Firewall'], d:['底部 3 行形成火墙；其中怪物每回合掉当前固定伤害 20%（最少 1）','Bottom 3 rows become a firewall; foes there lose 20% of current flat damage each turn (minimum 1)'], f:p=>{ p.firewall=true; }},

  shadow:{n:['乾坤一掷','All-In'], d:['买炸弹后，再额外扣当前金币的 20%，并把这笔数额加到这次炸弹伤害上','After buying a bomb, also spend 20% of your current gold and add exactly that amount to this bomb’s damage'], f:p=>{ p.shadowBombGold=true; }},
  demolitionist:{n:['爆破手','Demolitionist'], d:['每用一次炸弹：伤害 +1、花费 +5 金（越炸越强、越炸越贵）','Each bomb use: +1 damage and +5 gold cost (stronger but pricier each time)'], f:p=>{ p.bombBoost=true; }},
  shieldbash:{n:['盾击','Shield Bash'], d:['把「护甲减伤量」加到固定{WC}伤害上（护甲越厚、剑伤越高）','Adds your armor (damage-reduction) value to flat {W} damage — more armor, harder hits'], f:p=>{ p.shieldBash=true; }},
  tycoon:{n:['钱能买命','Money Buys Life'], d:['囤金期间，受到的伤害优先扣冻结金币，不够再扣手头金币；金币仍不够时才继续掉血','While Hoard is active, incoming damage is paid from frozen gold first, then wallet gold; only any remainder spills into HP'], f:p=>{ p.tycoonGoldShield=true; }},
  warlord:{n:['巨力','Titan'], d:['最大生命越高，{WC}固定伤害越高（每 12 点最大生命 +1）','Higher max HP = higher flat {W} damage (+1 per 12 max HP)'], f:p=>{ p.titan=true; }},
  thorns:{n:['荆棘','Thorns'], d:['受到攻击时，把「当前护甲减伤量」反弹给攻击者（护甲越高反弹越多）','When hit, reflect your current armor (damage-reduction) back to the attacker — more armor, more reflect'], f:p=>{ p.thorns=true; }},
  bloodfrenzy:{n:['血狂','Blood Frenzy'], d:['吸血/嗜血回血超出生命上限时，溢出的 30% 增为永久生命上限；但每回合结束损失 5% 最大生命','Lifesteal/Bloodthirst healing past max HP: 30% of overflow becomes permanent max HP; but at end of every turn, lose 5% of max HP'], f:p=>{ p.bloodFrenzy=true; }},
  cheapskate:{n:['小气鬼','Cheapskate'], d:['消耗金币的主动（商店治疗/炸弹、会长「收买」）花费减半','Gold-spending actives (shop Heal/Bomb, Guild Master’s Buyout) cost half'], f:p=>{ p.cheapskate=true; }},
  witheraura:{n:['竭心光环','Wither Aura'], d:['按你每回合恢复量（受治疗减半影响）先扣自己同等生命，再让全场敌人/Boss 各掉同等生命','Each turn, lose HP equal to your regen amount after healing modifiers, then deal that same amount to all enemies/bosses'], f:p=>{ p.witherAura=true; }},
  icearmor:{n:['冰甲','Ice Armor'], d:['每次你受到怪物/Boss攻击后，对攻击者造成 50% 当前固定伤害（至少 1），并让它的当前攻击倒计时 +1','Whenever a monster/boss hits you, deal 50% of your current flat damage back to that attacker (minimum 1) and add +1 to its current attack countdown'], f:p=>{ p.iceArmor=true; }},
  unbroken:{n:['越挫越勇','Unbroken'], d:['每次你受到一次伤害时，永久获得 +1 最大生命','Whenever you take damage, gain +1 permanent max HP'], f:p=>{ p.unbroken=true; }},
  splash:{n:['溅射','Splash'], d:['攻击溢出伤害随机溅到剩余敌人（含{W}免疫 Boss）','Overflow damage splashes to a random remaining foe (incl. {W}-immune bosses)'], f:p=>{ p.splash=true; }},

// 打开 ?rec=<id> 的分享链接：从 API 拉取录像并回放
async function loadSharedReplay(id){
  hideOverlay(); logClear(); log(tr('⏳ 正在加载分享录像…','⏳ Loading shared replay…'));
  try{
    const res=await fetch(REC_API+'/rec/'+encodeURIComponent(id));
    if(!res.ok) throw new Error('HTTP '+res.status);
    const r=await res.json();
    if(!r||!Array.isArray(r.acts)||typeof r.seed!=='number') throw new Error('invalid');

function attachTierChoicePreview(el, tier, id){
  if(tier!==1) return;
  let timer=null, fired=false, sx=0, sy=0;
  const clear=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  el.addEventListener('pointerdown', e=>{ if(replaying) return; fired=false; sx=e.clientX; sy=e.clientY; clear();
    timer=setTimeout(()=>{ timer=null; const info=tierPreviewData(tier,id); if(!info) return; fired=true; busy=true; const rows=info.rows.map(([k,v])=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid #3a2d4d"><span style="color:var(--dim)">${k}</span><b style="text-align:right">${v}</b></div>`).join(''); const card=document.getElementById('card'); card.innerHTML=`<h2>${info.icon} ${info.title}</h2><p style="font-size:13px;line-height:1.5">${info.desc}</p><div style="text-align:left;font-size:13px;margin:0 0 14px">${rows}</div><button class="btn" id="tierPrevClose" style="width:100%">${tr('关闭','Close')}</button>`; document.getElementById('tierPrevClose').onclick=()=>showTierSelect(tier); showOverlay(); }, 450); });
  el.addEventListener('pointermove', e=>{ if(timer && (Math.abs(e.clientX-sx)>10 || Math.abs(e.clientY-sy)>10)) clear(); });
  el.addEventListener('pointerup', clear);
  el.addEventListener('pointercancel', clear);
  el.addEventListener('pointerleave', clear);
  el.addEventListener('click', e=>{ if(fired){ e.preventDefault(); e.stopImmediatePropagation(); fired=false; } }, true);
}
function showTierSelect(tier){

//==================== 初始化 ====================
let __seedCtr=0;
let pendingServerSeed=null;   // 选种族页预取的服务端 seed：只保留 1 个，优先本地 warm seed，再按 race+version 复用，避免点种族后现等
const SEED_WARM_MS=71*60*60*1000;   // 服务端 token 标称 72h；前端本地预热保守 71h，避免边界时刻刚好过期
function serverSeedKey(rc){ return rc&&rc.id ? `${rc.id}|${VERSION}` : ''; }
function preferredSeedRace(){
  try{
    const save=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(save&&save.player&&raceById(save.player.race).id===save.player.race) return raceById(save.player.race);
  }catch(e){}
  const last=getLastRec();
  if(last&&last.race) return raceById(last.race);
  return RACES[0];
}
function warmSeedExpiry(){ return Date.now()+SEED_WARM_MS; }
function readWarmSeed(rc){
  if(DEV||!rc) return null;
  try{
    const raw=localStorage.getItem(SEED_POOL_KEY); if(!raw) return null;
    const x=JSON.parse(raw);
    const key=serverSeedKey(rc);
    if(!x || x.used || !x.token || typeof x.seed!=='number' || x.key!==key || x.ver!==VERSION || !x.expiresAt || x.expiresAt<=Date.now()){ localStorage.removeItem(SEED_POOL_KEY); return null; }
    return {seed:x.seed>>>0, token:x.token};
  }catch(e){ try{ localStorage.removeItem(SEED_POOL_KEY); }catch(_e){} return null; }
}
function storeWarmSeed(rc, srv){
  if(DEV||!rc||!srv||typeof srv.seed!=='number'||!srv.token) return;
  try{
    localStorage.setItem(SEED_POOL_KEY, JSON.stringify({
      key: serverSeedKey(rc),
      ver: VERSION,
      seed: srv.seed>>>0,
      token: srv.token,
      issuedAt: Date.now(),
      expiresAt: warmSeedExpiry(),
    }));
  }catch(e){}
}
function consumeWarmSeed(rc){
  const srv=readWarmSeed(rc);
  if(srv){ try{ localStorage.removeItem(SEED_POOL_KEY); }catch(e){} }
  return srv;
}
function purgeWarmSeed(){
  try{
    const raw=localStorage.getItem(SEED_POOL_KEY); if(!raw) return;
    const x=JSON.parse(raw);
    if(!x || x.used || !x.token || typeof x.seed!=='number' || x.ver!==VERSION || !x.expiresAt || x.expiresAt<=Date.now()) localStorage.removeItem(SEED_POOL_KEY);
  }catch(e){ try{ localStorage.removeItem(SEED_POOL_KEY); }catch(_e){} }
}
function prefetchServerSeed(rc){
  if(DEV||!rc) return null;
  if(typeof navigator!=='undefined' && navigator.onLine===false) return null;
  if(readWarmSeed(rc)) return Promise.resolve(readWarmSeed(rc));
  const key=serverSeedKey(rc); if(!key) return null;
  if(pendingServerSeed && pendingServerSeed.key===key) return pendingServerSeed.promise || Promise.resolve(pendingServerSeed.srv||null);
  const slot={key,srv:null,promise:null};
  slot.promise=fetchServerSeed(rc).then(srv=>{
    if(pendingServerSeed===slot){
      slot.srv=srv||null;
      slot.promise=null;
      if(srv) storeWarmSeed(rc, srv);
    }
    return srv||null;
  }).catch(()=>{
    if(pendingServerSeed===slot){ slot.srv=null; slot.promise=null; }
    return null;
  });
  pendingServerSeed=slot;
  return slot.promise;
}
function pendingSeedPromise(rc){
  const key=serverSeedKey(rc);
  if(pendingServerSeed && pendingServerSeed.key===key){
    if(pendingServerSeed.promise) return pendingServerSeed.promise;
    if(pendingServerSeed.srv) return Promise.resolve(pendingServerSeed.srv);
  }
  return null;
}
function consumePrefetchedServerSeed(rc){
  const warm=consumeWarmSeed(rc); if(warm) return warm;
  const key=serverSeedKey(rc);
  if(pendingServerSeed && pendingServerSeed.key===key && pendingServerSeed.srv){ const srv=pendingServerSeed.srv; pendingServerSeed=null; return srv; }
  return null;
}
// 正式版服务端种子请求：页面启动时只清理/读取本地 warm seed；进入选种族页后若本地没有，再偷偷预取 1 个；真开局时优先消费本地或同 race + version 的预取结果，没命中再现拉。
async function fetchServerSeed(rc){
  if(DEV) return null;
  if(typeof navigator!=='undefined' && navigator.onLine===false) return null;
  try{
    const qs = new URLSearchParams({ race: rc.id, version: VERSION });
    const r=await fetch(REC_API+'/seed?'+qs.toString(),{method:'POST'});
    if(r&&r.ok){ const x=await r.json(); if(typeof x.seed==='number'&&x.token) return {seed:x.seed>>>0, token:x.token}; }
  }catch(e){}
  return null;
}

async function fetchThresholdSnapshot(race, version, agent){
  try{
    const qs = new URLSearchParams({ race, version, agent: agent||'human' });
    const r = await fetch(REC_API+'/threshold?'+qs.toString());
    if(r&&r.ok){ const x = await r.json(); return x && x.threshold ? x.threshold : null; }
  }catch(e){}
  return null;
}

// 没拿到服务端种子时的统一提示：醒目 toast + 日志，讲清「本地随机、照常可玩、只是不计榜」
function offlineSeedNotice(){

// 开新局入口：正式版优先消费本地 warm seed；若本地没有，再复用选种族页里的同 race+version 预取结果，最后才现拉；dev 或离线失败 → 本地随机（可玩，不计排名）
async function freshStart(rc){
  if(DEV){ startGame(rc); return; }
  if(typeof navigator!=='undefined' && navigator.onLine===false){ startGame(rc); offlineSeedNotice(); return; }   // 明确离线：秒开不等
  let srv=consumePrefetchedServerSeed(rc);
  if(!srv){
    const pending=pendingSeedPromise(rc);
    try{ srv=await Promise.race([ pending || fetchServerSeed(rc), new Promise(res=>setTimeout(()=>res(null), 2500)) ]); }catch(e){}
  }
  startGame(rc, srv);
  if(!srv) offlineSeedNotice();
}
function startGame(rc, srv){   // srv={seed,token}：服务端发的种子（正式版上榜用）；缺省则本地随机（dev / 离线，不计排名）
  ended=false;   // 新局开始，重新允许存档
  let firstGame=false;
  if(replaying){ srand(replayRec.seed); firstGame=!!replayRec.tut; }   // 回放：是否新手局以录像里的 tut 标志为准（保持棋盘可复现）
  else {
    try{ firstGame = !localStorage.getItem(TUT_KEY); }catch(e){}        // 本机第一次游玩
    const seed = (srv && typeof srv.seed==='number') ? (srv.seed>>>0) : (((Date.now()>>>0)^(__seedCtr++*0x9E3779B9))>>>0); srand(seed);
    rec={v:1,seed,ver:VERSION,race:rc.id,t0:Date.now(),acts:[]};        // ver：版本分桶；t0：开局时刻
    if(srv && srv.token) rec.token=srv.token;                          // 服务端种子 token：提交时随录像带上、供 worker 校验
    if(firstGame){ rec.tut=1; try{ localStorage.setItem(TUT_KEY,'1'); }catch(e){} }

  selection=[]; dragging=false; busy=false; pendingLevels=0;
  grid=[];
  for(let r=0;r<ROWS;r++){ grid[r]=[]; for(let c=0;c<COLS;c++){
    const pool=connectablePool();
    let type = rnd()<0.08 ? 'enemy'
             : pool[Math.floor(rnd()*pool.length)];
    grid[r][c]=makeTile(type);
  }}
  player.fireChainTurn=false;
  if(firstGame) seedTutorialBoard();   // 新手第一局：保证棋盘里有一只怪、且能被多把剑连起来（剑-怪-剑）
  syncPositions(true);

  log(tr(`【${rc.e}${L(rc.n)}】踏入地牢… 祝你好运！`, `${rc.e}${L(rc.n)} enters the dungeon… good luck!`));

// 新手第一局教学棋盘：在内部格放一只弱怪，左右各一把剑（剑-怪-剑，可连成穿怪剑链一击带走）。用 rnd() 故确定可重放。

//==================== 本地存档 ====================
const SAVE_KEY=DEV?'dr_save_dev':'dr_save', BEST_KEY=DEV?'dr_best_dev':'dr_best';   // dev 版独立存档，与正式版互不覆盖
const TUT_KEY=DEV?'dr_tut_dev':'dr_tut';   // 新手第一局标记（置位后不再给教学棋盘）
const NAME_KEY=DEV?'dr_name_dev':'dr_name';   // 排行榜展示名（alias，本机持久，自动填上次的）
function clampName(s){ s=(s||"").trim(); let o="",w=0; for(const ch of s){ const c=ch.codePointAt(0); if(c<32||c===127) continue; const cw=c>0x2e7f?2:1; if(w+cw>24) break; o+=ch; w+=cw; } return o; }   // 最长 12 汉字（宽度24，过滤控制字符）
function getName(){ try{ return localStorage.getItem(NAME_KEY)||''; }catch(e){ return ''; } }
function setName(v){ try{ localStorage.setItem(NAME_KEY, clampName(v)); }catch(e){} }
purgeWarmSeed();   // 页面启动只清理本地过期 / 旧版本 warm seed，不主动申请新 seed
// 随机名：形容词+的+名词（玩家🎲；中英按语言）
const NM_ADJ_ZH=['勇敢','狡猾','无畏','暴躁','沉默','闪光','幸运','落魄','狂热','冷酷','神秘','贪婪','永恒','嗜血','迅捷','孤独'];
const NM_NOUN_ZH=['剑客','游侠','骑士','守卫','屠夫','浪人','行者','亡魂','君王','流寇','影子','猎手','老兵','圣徒','赌徒','莽夫'];
const NM_ADJ_EN=['Brave','Sly','Fearless','Grumpy','Silent','Shining','Lucky','Reckless','Cold','Greedy','Eternal','Swift','Lonely','Savage'];
const NM_NOUN_EN=['Knight','Ranger','Rogue','Warden','Butcher','Wanderer','Hunter','Ghost','King','Veteran','Saint','Gambler','Brute','Outlaw'];
function genName(){ const pick=a=>a[Math.floor(Math.random()*a.length)]; return lang==='en' ? pick(NM_ADJ_EN)+' '+pick(NM_NOUN_EN) : pick(NM_ADJ_ZH)+'的'+pick(NM_NOUN_ZH); }
const REC_KEY=DEV?'dr_rec_dev':'dr_rec', REC_LAST_KEY=DEV?'dr_rec_last_dev':'dr_rec_last';  // 进行中录像 / 上一局完整录像
const SEED_POOL_KEY=DEV?'dr_seed_pool_dev':'dr_seed_pool';   // 预热的服务端种子：本地最多缓存 1 枚，优先给下次正式版开局复用
// 录制一个玩家动作（回放中不录）。动作：['m',cells,baseType] 连线 / ['b',key] 购买 / ['b',key,'seer',type] 换装先知选择 / ['k'] 技能 / ['k','seer',type] 先知选择 / ['u',idx] 升级选择 / ['t',tier,id] 转职选择

function recAct(a){ if(rec && !replaying){ a.push(Date.now()-(rec.t0||0)); rec.acts.push(a); saveRec(); } }
// 本局游玩时长（毫秒）：实时对局取 now−t0；回放取录像最后一步的时间戳（相对开局 ms）
function playMs(){
  if(!replaying && rec && rec.t0) return Math.max(0, Date.now()-rec.t0);
  const src = replayRec || rec;
  if(src && Array.isArray(src.acts) && src.acts.length){ const la=src.acts[src.acts.length-1]; const t=la[la.length-1]; if(typeof t==='number') return t; }
  return 0;
}
function fmtDur(ms){ const s=Math.round(ms/1000); if(s<60) return tr(`${s} 秒`,`${s}s`); const m=Math.floor(s/60); return tr(`${m} 分 ${s%60} 秒`,`${m}m ${s%60}s`); }
function saveRec(){ try{ if(rec) localStorage.setItem(REC_KEY, JSON.stringify(rec)); }catch(e){} }
function loadRec(){ try{ return JSON.parse(localStorage.getItem(REC_KEY)||'null'); }catch(e){ return null; } }
function getLastRec(){ try{ return JSON.parse(localStorage.getItem(REC_LAST_KEY)||'null'); }catch(e){ return null; } }
let ended=false;   // 本局是否已结束（死亡/破关）。结束后绝不再写存档——防「死了之后继续上局又能玩」：gameOver/onClear 清了存档，但若随后还有延迟的 updateHUD（如双击连线的 setTimeout）会把死局重新存回去。
function saveGame(){

      pendingLevels,
      rngState: __rngState>>>0,   // 恢复续局时也要续上同一条 RNG 轨迹，否则后续补格/刷怪会让 replay 漂移

function hasSave(){ try{ const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); return !!d && (DEV || d.ver===VERSION); }catch(e){ return false; } }   // 正式版仅当存档版本与当前一致才算有效存档

  try{
    const data=JSON.parse(localStorage.getItem(SAVE_KEY)); if(!data) return false;
    if(!DEV && data.ver!==VERSION){ clearSave(); try{ localStorage.removeItem(REC_KEY); }catch(e){} return false; }   // 正式版：版本变化→存档不兼容，丢弃从头开始

    if(rec && rec.acts && rec.acts.length){ const la=rec.acts[rec.acts.length-1]; const last=la[la.length-1]; if(typeof last==='number') rec.t0=Date.now()-last; }   // 重设 t0：游玩时长排除「关掉游戏的间隔」（不影响重放，时间戳仅供分析）

function cellX(c){ return PAD + c*TILE; }
function cellY(r){ return PAD + r*TILE; }

function syncPositions(snap){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=grid[r][c]; if(!t) continue;
    t.r=r; t.c=c;
    if(snap || t.curY===undefined) t.curY=cellY(r);
  }
}
function holdVisibleBoard(){
  if(!grid) return;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=grid[r][c]; if(!t) continue;
    t.curY=cellY(r);
    if(gravityFxHold>0) t.fxHold=gravityFxHold;

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// 预览：当前剑链会杀死哪些怪（与 dealDamage 逻辑保持一致）
function previewKills(){
  // 剑链且已构成可消除的连线（长度≥2，怪起手时怪自身也占一格）
  if(!dragging || selection.length<2 || selection[0].type!=='sword') return null;
  const targets=selection.filter(s=>isSwordTarget(grid[s.r][s.c]));
  if(!targets.length) return null; // 没串到怪 → 不造成伤害，无击杀预览
  const nS=selection.filter(s=>{const t=grid[s.r][s.c]; return t&&t.type==='sword';}).length;
  if(nS<1) return null;   // 没连进任何剑 → 不算攻击（与 endDrag 一致），不显示骷髅预览
  const combo=1+Math.max(0,nS-2)*0.15*(player.comboMult||1);
  const titanFlat=(player.titan?Math.floor(player.maxHp/12):0)+shieldBashFlat(player);   // 巨力 + 盾击(护甲减伤量→固定剑伤)
  let pool=(nS*player.weaponPower+player.swordFlat+titanFlat)*combo*(player.swordMult||1);
  if(player.lowHpDmg) pool*=1+(1-player.hp/player.maxHp)*0.6;
  pool=Math.floor(pool);
  // 与结算一致：每只怪独立吃满 pool，pool≥血量即死
  const dead=new Set();
  targets.forEach(s=>{const t=grid[s.r][s.c]; if(isSwordTarget(t) && pool>=t.hp) dead.add(s.r+','+s.c);});
  return dead;
}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  // 选中集合（快速查找）
  const sel=new Set(selection.map(s=>s.r+','+s.c));
  const chainType=selection.length?selection[0].type:null;
  const killSet=previewKills();
  const poisoned=pollutionActive();   // 污染怪在场时全场心显示为毒心（绿心）
  const firewallZone = player && player.firewall ? fireWallRows() : null;
  if(firewallZone){
    ctx.save();
    ctx.strokeStyle=hexA('#ff5a36', .75); ctx.lineWidth=3; ctx.shadowColor='#ff5a36'; ctx.shadowBlur=12;
    ctx.strokeRect(PAD+2, cellY(firewallZone.start)+2, COLS*TILE-4, TILE*3-4);
    ctx.restore(); ctx.shadowBlur=0;
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=grid[r][c]; if(!t) continue;
    const isPoisonHeart = t.type==='heart' && poisoned;
    const isBlackHeart = t.type==='heart' && !poisoned && t.poison;   // 万物皆毒：黑毒心（污染绿心优先）
    const x=cellX(c), y=(t.curY!==undefined?t.curY:cellY(r));
    const d=DEF[t.type], g=TILE-8;
    const picked=sel.has(t.r+','+t.c);
    const coiled = player && player.deathCoil>0 && (t.type==='enemy'||(t.type==='boss'&&!t.finale));   // 蔓藤缠绕中：敌人格变绿
    const burning = !!(t.burnTurns && t.burnStacks>0);
    const fireLinked = !!(player && player.fireChainTurn && t.type==='boss' && !t.finale);
    const immuneBossBurning = !!(burning && t.type==='boss' && !t.finale && !bossDef(t).swordable);   // 剑免疫 Boss 被点燃后，底色恢复成原 Boss 色，只保留燃烧光效/角标
    const frosted = !!(t.frostTurns>0);
    const flashedWhite = !!(t.flashWhite>0);
    const frostedBase = t.type==='boss' ? '#4d94d8' : '#5aa9f8';
    const frostedGlow = t.type==='boss' ? '#d9f3ff' : '#c8ecff';
    // 能被剑攻击的（怪 / 可剑连的Boss，以及剑本身）统一红底，一眼看出可攻击；蔓藤缠绕中的怪改绿底；燃烧中的怪改橙红底；火焰链激活时的 Boss 改火红底
    const baseCol = flashedWhite ? '#eef7ff' : frosted ? frostedBase : immuneBossBurning ? d.color : burning ? '#ff6b2f' : fireLinked ? '#ff5336' : coiled ? '#27ae60' : (isSwordTarget(t) || t.type==='sword') ? DEF.sword.color : d.color;   // 黑毒心/绿毒心底色与普通心一致，只换 emoji（💚/🖤）
    // 被剑链穿过的怪/可攻击Boss → 红色高亮（表示正被攻击）；燃烧目标走橙色光晕；火焰链激活的 Boss 走更亮的火色
    const gl = flashedWhite ? '#ffffff' : frosted ? frostedGlow : (picked && chainType==='sword' && (isSwordTarget(t) || isFireChainTarget(t))) ? '#ff8a3c' : burning ? '#ff9a52' : fireLinked ? '#ff7043' : coiled ? '#2ecc71' : d.glow;
    // 背景
    ctx.save();
    roundRect(x+4,y+4,g,g,12);
    if(!picked){ ctx.fillStyle=hexA(baseCol,.16); }
    else { ctx.fillStyle=hexA(gl,.30); ctx.shadowColor=gl; ctx.shadowBlur=14; }
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.lineWidth=picked?3:1.5;
    ctx.strokeStyle=picked?gl:hexA(baseCol,.5);
    ctx.stroke();
    ctx.restore();

    const cx=x+TILE/2, cy=y+TILE/2;
    if(t.type==='enemy'||t.type==='boss'){
      const isBoss=t.type==='boss';
      const bdef = isBoss?bossDef(t):null;
      const doomed = killSet && killSet.has(t.r+','+t.c) && (!isBoss || bdef.swordable || player.pierceTurn); // 会被这条线杀死 → 骷髅
      ctx.font=Math.floor(TILE*0.30)+'px '+EMOJI_FONT;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(doomed?'💀':(isBoss?bdef.emoji:'👹'), cx, y+TILE*0.30);
      // 血量（终焉之主无血、打不掉 → 显示 ∞ 而非 0）
      ctx.fillStyle='#fff'; ctx.font='700 '+Math.floor(TILE*0.34)+'px system-ui';
      if(!t.finale) ctx.fillText(t.hp, cx, cy+TILE*0.10);
      else { ctx.fillStyle='#ffd54a'; ctx.fillText('∞', cx, cy+TILE*0.10); }
      if(t.burnStacks>0){
        const bx=x+g-4, by=y+g-4, br=TILE*0.16;
        ctx.beginPath(); ctx.arc(bx,by,br,0,7);
        ctx.fillStyle='#ff5a36'; ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font='700 '+Math.floor(TILE*0.20)+'px system-ui';
        ctx.fillText(t.burnStacks, bx, by+1);
      }
      // 攻击力角标（左上）——特效/大招型 Boss（攻击力无意义）不显示；但有 shownAtk/dynAtk 的按展示值显示，避免漏看
      if(!isBoss || (!bdef.act && !bdef.cdAttack) || bdef.shownAtk || bdef.dynAtk){
        const av=(isBoss && (bdef.shownAtk||bdef.dynAtk)) ? (bdef.shownAtk?bdef.shownAtk(t):bdef.dynAtk(t)) : t.atk;
        const ax=x+10, ay=y+10, ar=TILE*0.16;
        ctx.beginPath(); ctx.arc(ax,ay,ar,0,7);
        ctx.fillStyle=(isBoss&&bdef.trueDmg)?'#8e44ad':'#c0392b'; ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font='700 '+Math.floor(TILE*0.20)+'px system-ui';
        ctx.fillText(av, ax, ay+1);
      }
      // 倒计时角标（右上）：普通 Boss=倒计时；每回合行动型=恒「1」（每回合都出手）；终焉之主不显示
      if(!isBoss || !bdef.finale){
        const perT = isBoss && bdef.perTurn, cv = perT ? 1 : t.cd;
        const bx=x+g-4, by=y+10, br=TILE*0.16;
        ctx.beginPath(); ctx.arc(bx,by,br,0,7);
        ctx.fillStyle = cv<=1? '#e74c3c' : cv<=2? '#e67e22' : '#2c3e50';
        ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font='700 '+Math.floor(TILE*0.20)+'px system-ui';
        ctx.fillText(perT ? '1' : t.cd, bx, by+1);
      }
    } else {
      ctx.font=Math.floor(TILE*0.46)+'px '+EMOJI_FONT;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(t.type==='sword'?wE():(isPoisonHeart?'💚':isBlackHeart?'🖤':d.emoji), cx, cy);   // 攻击格按种族武器；绿毒心/黑毒心
    }
  }
  drawBossFx();   // Boss 入场冲击环（叠在棋子之上）
  drawBombFx();   // 炸弹爆炸特效
  drawHookFx();   // 屠夫钩子拖拽线
  // 连接线
  if(selection.length){
    const d=DEF[selection[0].type];
    const lineGlow=(selection[0].type==='sword' && player && player.rogueStealTurn) ? DEF.coin.glow
      : (selection[0].type==='sword' && player && player.fireChainTurn) ? '#ff5a36'
      : d.glow;
    ctx.lineWidth=TILE*0.16; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle=hexA(lineGlow,.9); ctx.shadowColor=lineGlow; ctx.shadowBlur=12;
    ctx.beginPath();
    selection.forEach((s,i)=>{ const px=cellX(s.c)+TILE/2, py=cellY(s.r)+TILE/2;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
    if(dragging && lastPointer) ctx.lineTo(lastPointer.x,lastPointer.y);
    ctx.stroke(); ctx.shadowBlur=0;
  }
}
function hexA(hex,a){ const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

//==================== Boss 入场特效 ====================
// Boss 降临时从该格爆出扩散冲击环 + 闪光，让"有 Boss 入场"一眼可辨（区别于普通小怪刷新）。纯帧驱动、可重放无关。
const bossFx=[];           // {tile,c,r,life,max,gold,pulseCol?,boardPulse?}：锚定到 Boss 棋子对象，跟随其下落动画
const FX_LIFE=46;          // 帧数（约 0.75s @60fps）
// 锚定到刚放下的 Boss 棋子本身：之后 applyGravity 会让它沿列下落，特效需跟随，否则会落在掉进原格的别的棋子上。
function addBossFx(r,c,gold,pulseCol,boardPulse){ if(headless||jumping) return; bossFx.push({tile:grid[r][c],c,r,life:FX_LIFE,max:FX_LIFE,gold:!!gold,pulseCol:pulseCol||null,boardPulse:!!boardPulse}); }   // 无头/快进(跳转·步进)不放，否则整局的 Boss 入场闪一股脑堆出来
function drawBossFx(){
  for(const f of bossFx){
    const p=1-f.life/f.max;                          // 0→1 进度
    const t=f.tile;
    const cx=cellX(f.c)+TILE/2;                       // 列在重力下不变
    const cy=((t&&t.curY!==undefined)?t.curY:cellY(f.r))+TILE/2;   // 跟随 Boss 当前（下落中的）y
    const col=f.gold?'#ffd54a':(f.pulseCol||'#ff5252');            // 终焉之主金，普通 Boss 红；可选自定义脉冲色
    ctx.save();
    if(f.boardPulse){
      const boardR=Math.hypot(COLS*TILE, ROWS*TILE)*0.62;
      ctx.beginPath(); ctx.arc(cx,cy,boardR*(0.18+Math.min(1,p*1.15)),0,7);
      ctx.lineWidth=Math.max(6,TILE*0.22*(1-p*0.75)); ctx.strokeStyle=hexA(col,0.26*(1-p*0.4));
      ctx.shadowColor=col; ctx.shadowBlur=34*(1-p*0.35); ctx.stroke();
      if(p<0.24){ ctx.beginPath(); ctx.arc(cx,cy,boardR*(0.42+p*0.38),0,7); ctx.fillStyle=hexA(col,0.12*(1-p/0.24)); ctx.fill(); }
    }
    if(p<0.35){ ctx.beginPath(); ctx.arc(cx,cy,TILE*0.56,0,7); ctx.fillStyle=hexA(col,0.5*(1-p/0.35)); ctx.fill(); }   // 起手闪光
    for(let k=0;k<2;k++){ const pp=p-k*0.22; if(pp<=0||pp>=1) continue;   // 双层扩散环
      ctx.beginPath(); ctx.arc(cx,cy,TILE*(0.18+pp*(f.gold?1.3:1.0)),0,7);
      ctx.lineWidth=TILE*0.13*(1-pp); ctx.strokeStyle=hexA(col,0.75*(1-pp));
      ctx.shadowColor=col; ctx.shadowBlur=16*(1-pp); ctx.stroke(); }
    ctx.restore();
  }
  ctx.shadowBlur=0;
}
//==================== 炸弹爆炸特效 ====================
// 炸弹命中的每个怪/Boss 格爆一下：橙色闪光 + 扩散环。锚定到格子（命中后棋子常被移除，不跟随重力）。纯帧驱动、可重放无关。
const bombFx=[]; const BOMB_FX_LIFE=26, BOMB_FX_MS=Math.round(BOMB_FX_LIFE/60*1000);   // ~0.43s @60fps
function addBombFx(r,c){ if(headless||jumping) return; bombFx.push({r,c,life:BOMB_FX_LIFE,max:BOMB_FX_LIFE}); }   // 无头/快进不放
const hookFx=[]; const HOOK_FX_LIFE=14;
function addHookFx(lines){ if(headless||jumping||!lines||!lines.length) return; hookFx.push(...lines.map(l=>({...l,life:HOOK_FX_LIFE,max:HOOK_FX_LIFE}))); }   // 屠夫钩子：纯视觉拖拽线，无头/快进不放
function drawHookFx(){
  for(const f of hookFx){
    const p=1-f.life/f.max;
    const sx=cellX(f.c1)+TILE/2, sy=cellY(f.r1)+TILE/2;
    const ex=cellX(f.c2)+TILE/2, ey=cellY(f.r2)+TILE/2;
    const dx=ex-sx, dy=ey-sy, len=Math.hypot(dx,dy)||1;
    const ux=dx/len, uy=dy/len, px=-uy, py=ux;
    const hx=ex-ux*TILE*0.15, hy=ey-uy*TILE*0.15;
    const wing=TILE*0.08;
    ctx.save();
    ctx.lineCap='round';
    ctx.strokeStyle=hexA('#9aa1a8',0.9*(1-p*0.35));
    ctx.lineWidth=Math.max(2,TILE*0.06*(1-p*0.3));
    ctx.shadowColor='#60666d'; ctx.shadowBlur=8*(1-p);
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.strokeStyle=hexA('#d0d4d9',0.38*(1-p));
    ctx.lineWidth=Math.max(1,TILE*0.025*(1-p*0.4));
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.fillStyle=hexA('#8b9299',0.88*(1-p*0.3));
    ctx.beginPath();
    ctx.moveTo(ex,ey);
    ctx.lineTo(hx+px*wing, hy+py*wing);
    ctx.lineTo(hx-px*wing, hy-py*wing);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.shadowBlur=0;
}
function drawBombFx(){
  for(const f of bombFx){
    const p=1-f.life/f.max;

    ctx.beginPath(); ctx.arc(cx,cy,TILE*(0.14+p*0.5),0,7);

    ctx.shadowColor='#ff7a18'; ctx.shadowBlur=14*(1-p); ctx.stroke();
    ctx.restore();
  }
  ctx.shadowBlur=0;
}

// 通用吸取线特效：从棋盘格子画线到某个 UI 目标（纯 UI，不进录像；无头/桩件环境自动跳过）
function absorbLinesFx(cells, opt){
  if(headless || jumping || !cells || !cells.length) return;   // 快进（跳回合/步进）时不放特效，免得一股脑闪一堆线
  try{
    if(!document.createElementNS) return;   // 桩件（verify.js/测试）的 document 无此方法 → 跳过，不报错
    const cv0=document.getElementById('board');
    const target=(opt&&opt.targetEl) || ((opt&&opt.targetId) ? document.getElementById(opt.targetId) : null);
    if(!cv0||!target||!cv0.getBoundingClientRect||!target.getBoundingClientRect) return;
    const r=cv0.getBoundingClientRect(), tr=target.getBoundingClientRect();
    if(!r.width) return;
    const sx=r.width/cv0.width, sy=r.height/cv0.height;
    const tx=tr.left+((tr.width||0)/2), ty=tr.top+((tr.height||0)/2);
    if(!Number.isFinite(tx) || !Number.isFinite(ty)) return;   // 允许吸到“点目标”（如 Boss 自身格心），别把 0×0 目标误判成无效
    const NS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(NS,'svg');
    svg.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:45';
    cells.forEach(cell=>{
      const cr=Array.isArray(cell)?cell[0]:cell.r, cc=Array.isArray(cell)?cell[1]:cell.c, type=Array.isArray(cell)?null:cell.type;
      const def=(type&&DEF[type])||null;
      const stroke=(opt&&opt.stroke) || (def&&def.color) || '#ff2d2d';
      const glow=(opt&&opt.glow) || (def&&def.glow) || '#ff3b3b';
      const x=r.left+(cellX(cc)+TILE/2)*sx, y=r.top+(cellY(cr)+TILE/2)*sy;
      const ln=document.createElementNS(NS,'line');
      ln.setAttribute('x1',x); ln.setAttribute('y1',y); ln.setAttribute('x2',tx); ln.setAttribute('y2',ty);
      ln.setAttribute('stroke',stroke); ln.setAttribute('stroke-width','3'); ln.setAttribute('stroke-linecap','round');
      ln.style.filter=`drop-shadow(0 0 5px ${glow})`;
      const len=Math.hypot(tx-x,ty-y); ln.setAttribute('stroke-dasharray',len); ln.setAttribute('stroke-dashoffset',len);   // 初始隐藏，避免开头闪一下
      svg.appendChild(ln);
      if(ln.animate) ln.animate([{strokeDashoffset:len,opacity:1},{strokeDashoffset:0,opacity:1,offset:.5},{strokeDashoffset:0,opacity:0}],{duration:680,easing:'ease-out',fill:'forwards'});
      else { ln.setAttribute('stroke-dashoffset','0'); ln.style.opacity='0.92'; }   // 某些移动浏览器不支持 SVG 线段动画：至少要直接显示，别整条线隐身
    });
    markTransientFxDom(svg); document.body.appendChild(svg);
    setTimeout(()=>{ try{ svg.remove(); }catch(e){} }, 720);
  }catch(e){}
}
// 吸魂大法特效：从每个被吸目标的格子画一条发光红线指向 ❤️ 血条（纯 UI，不进录像；无头/桩件环境自动跳过）

function boardPointTarget(src){
  if(!src) return null;
  return { getBoundingClientRect(){ const cv0=document.getElementById('board'); if(!cv0||!cv0.getBoundingClientRect) return {left:0,top:0,width:0,height:0}; const r=cv0.getBoundingClientRect(); if(!r.width) return {left:0,top:0,width:0,height:0}; const sx=r.width/cv0.width, sy=r.height/cv0.height; const cx=r.left+(cellX(src.c)+TILE/2)*sx, cy=r.top+(cellY(src.r)+TILE/2)*sy; return {left:cx, top:cy, width:0, height:0}; } };
}
function skillEffectTarget(slotKey){

}
function snipeBeamFx(src, target){
  if(headless || jumping || !src || !target) return;
  try{
    if(!document.createElementNS) return;
    const cv0=document.getElementById('board'), srcEl=(src.targetEl||document.getElementById(src.targetId||'skillBtn'));
    if(!cv0||!srcEl||!cv0.getBoundingClientRect||!srcEl.getBoundingClientRect) return;
    const r=cv0.getBoundingClientRect(), sr=srcEl.getBoundingClientRect();
    if(!r.width) return;
    const sx=r.width/cv0.width, sy=r.height/cv0.height;
    const x1=(src.anchorX!=null?src.anchorX:(sr.left+((sr.width||0)/2))), y1=(src.anchorY!=null?src.anchorY:(sr.top+((sr.height||0)/2)));
    if(!Number.isFinite(x1) || !Number.isFinite(y1)) return;
    const x2=r.left+(cellX(target.c)+TILE/2)*sx, y2=r.top+(cellY(target.r)+TILE/2)*sy;
    const hitRed=(target&&target.killed)?'#ffcf54':'#ff5a48';
    const hitDark=(target&&target.killed)?'#3a2800':'#1a1a1a';
    const NS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(NS,'svg');
    svg.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:45';
    const mk=(stroke,width,glow,delay,dur)=>{
      const ln=document.createElementNS(NS,'line');
      ln.setAttribute('x1',x1); ln.setAttribute('y1',y1); ln.setAttribute('x2',x2); ln.setAttribute('y2',y2);
      ln.setAttribute('stroke',stroke); ln.setAttribute('stroke-width',String(width)); ln.setAttribute('stroke-linecap','round');
      ln.style.filter=`drop-shadow(0 0 6px ${glow})`;
      const len=Math.hypot(x2-x1,y2-y1); ln.setAttribute('stroke-dasharray',len); ln.setAttribute('stroke-dashoffset',len);
      svg.appendChild(ln);
      if(ln.animate) ln.animate([
        {strokeDashoffset:len,opacity:0},
        {strokeDashoffset:len*0.15,opacity:1,offset:0.28},
        {strokeDashoffset:0,opacity:0.95,offset:0.5},
        {strokeDashoffset:0,opacity:0}
      ],{duration:dur,easing:'cubic-bezier(.2,.7,.2,1)',delay,fill:'forwards'});
      else { ln.setAttribute('stroke-dashoffset','0'); ln.style.opacity='0.9'; }
    };
    const ring=(cx,cy,r0,r1,fill,delay,dur,stroke)=>{
      const el=document.createElementNS(NS,'circle');
      el.setAttribute('cx',cx); el.setAttribute('cy',cy); el.setAttribute('r',r0);
      if(stroke){
        el.setAttribute('fill','none'); el.setAttribute('stroke',stroke); el.setAttribute('stroke-width',String(Math.max(1.5,TILE*0.06)));
        el.style.filter='drop-shadow(0 0 6px '+stroke+')';
      } else {
        el.setAttribute('fill',fill);
        if(fill) el.style.filter='drop-shadow(0 0 8px '+fill+')';
      }
      svg.appendChild(el);
      if(el.animate) el.animate([
        {r:r0, opacity:stroke?0.95:0.95},
        {r:r1, opacity:stroke?0.1:0}
      ],{duration:dur,easing:'ease-out',delay,fill:'forwards'});
      else { el.setAttribute('r',r1); el.style.opacity=stroke?'0.1':'0'; }
    };
    const flash=(cx,cy,w0,w1,h0,h1,fill,delay,dur,rot)=>{
      const el=document.createElementNS(NS,'ellipse');
      el.setAttribute('cx',cx); el.setAttribute('cy',cy); el.setAttribute('rx',w0); el.setAttribute('ry',h0);
      el.setAttribute('fill',fill); el.setAttribute('transform',`rotate(${rot||0} ${cx} ${cy})`);
      el.style.filter='drop-shadow(0 0 8px '+fill+')';
      svg.appendChild(el);
      if(el.animate) el.animate([
        {rx:w0, ry:h0, opacity:0.98},
        {rx:w1, ry:h1, opacity:0}
      ],{duration:dur,easing:'ease-out',delay,fill:'forwards'});
      else { el.setAttribute('rx',w1); el.setAttribute('ry',h1); el.style.opacity='0'; }
    };
    const spark=(ang,delay,dur,color,reach)=>{
      const rad=ang*Math.PI/180, ex=x2+Math.cos(rad)*reach, ey=y2+Math.sin(rad)*reach;
      const ln=document.createElementNS(NS,'line');
      ln.setAttribute('x1',x2); ln.setAttribute('y1',y2); ln.setAttribute('x2',ex); ln.setAttribute('y2',ey);
      ln.setAttribute('stroke',color); ln.setAttribute('stroke-width',String(Math.max(1.4,TILE*0.045))); ln.setAttribute('stroke-linecap','round');
      ln.style.filter='drop-shadow(0 0 5px '+color+')';
      svg.appendChild(ln);
      if(ln.animate) ln.animate([
        {x2:x2,y2:y2,opacity:0},
        {x2:ex,y2:ey,opacity:1,offset:0.28},
        {x2:ex,y2:ey,opacity:0}
      ],{duration:dur,easing:'ease-out',delay,fill:'forwards'});
      else { ln.setAttribute('x2',ex); ln.setAttribute('y2',ey); ln.style.opacity='0'; }
    };
    mk('#ff3b30', 4.3, '#ff8a80', 0, 170);
    mk('#161616', 2.2, '#5a5a5a', 95, 210);
    flash(x1,y1,Math.max(4,TILE*0.08),Math.max(11,TILE*0.22),Math.max(1.8,TILE*0.028),Math.max(5,TILE*0.07),'#ffd6a6',0,120,-18);
    flash(x1,y1,Math.max(2.8,TILE*0.05),Math.max(8,TILE*0.14),Math.max(1.6,TILE*0.022),Math.max(4,TILE*0.05),'#ff4a3d',18,100,22);
    ring(x2,y2,Math.max(2,TILE*0.035),Math.max(13,TILE*0.22),null,78,170,hitRed);
    ring(x2,y2,Math.max(1.5,TILE*0.025),Math.max(10,TILE*0.16),null,135,180,hitDark);
    flash(x2,y2,Math.max(2.3,TILE*0.04),Math.max(8,TILE*0.1),Math.max(2.3,TILE*0.04),Math.max(8,TILE*0.1),hitDark,118,120,0);
    spark(-30, 88, 120, hitRed, Math.max(9,TILE*0.18));
    spark(18, 102, 120, '#ffb16d', Math.max(8,TILE*0.14));
    spark(152, 114, 130, hitDark, Math.max(7,TILE*0.12));
    if(target&&target.killed) spark(70, 126, 150, '#ffd966', Math.max(11,TILE*0.2));
    markTransientFxDom(svg); document.body.appendChild(svg);
    setTimeout(()=>{ try{ svg.remove(); }catch(e){} }, 430);
  }catch(e){}
}

function loop(){
  if(!grid){ requestAnimationFrame(loop); return; } // 棋盘未创建（选职业中）
  // 缓动下落
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(!t)continue;
    const ty=cellY(r); if(t.curY===undefined)t.curY=ty;
    if(t.fxHold>0){ t.fxHold--; if(t.fxHold<=0) delete t.fxHold; continue; }
    t.curY += (ty-t.curY)*0.3; if(Math.abs(ty-t.curY)<0.5)t.curY=ty; }
  for(let i=bossFx.length-1;i>=0;i--){ if(--bossFx[i].life<=0) bossFx.splice(i,1); }   // 推进/回收入场特效
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(!t) continue; if(t.frostTurns>0) t.frostTurns--; if(t.flashWhite>0) t.flashWhite--; }
  for(let i=bombFx.length-1;i>=0;i--){ if(--bombFx[i].life<=0) bombFx.splice(i,1); }   // 推进/回收炸弹特效
  for(let i=hookFx.length-1;i>=0;i--){ if(--hookFx[i].life<=0) hookFx.splice(i,1); }   // 推进/回收屠夫拖拽线
  draw(); requestAnimationFrame(loop);
}

//==================== 输入 ====================
let lastPointer=null, dragExtended=false, dragStartX=0, dragStartY=0;   // dragStartX/Y：pointerdown 时的屏幕坐标，用于区分轻触和拖拽
let tapInfoTimer=null, tapInfoCell=null;   // 盾/心/金 轻触延迟弹信息，留出双击窗口（双击=贪心连线）
function cellFromEvent(e){
  const rect=cv.getBoundingClientRect();
  const sx=cv.width/rect.width, sy=cv.height/rect.height;
  const px=(e.clientX-rect.left)*sx, py=(e.clientY-rect.top)*sy;
  lastPointer={x:px,y:py};
  const c=Math.floor((px-PAD)/TILE), r=Math.floor((py-PAD)/TILE);
  if(r<0||r>=ROWS||c<0||c>=COLS) return null;
  return {r,c};
}
// 贪心连线：从 (r0,c0) 沿 8 向同类棋子两头延伸成一条尽量长的链（双击 盾/心/金 触发）。实际格子由 resolve 录制，回放无关。
function greedyChain(r0,c0,type){
  const inB=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS;
  const nbrs=(r,c,vis)=>{ const o=[]; for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){ if(!dr&&!dc) continue; const nr=r+dr,nc=c+dc; if(!inB(nr,nc)) continue; const t=grid[nr][nc]; if(t&&t.type===type){ const k=nr*COLS+nc; if(!vis.has(k)) o.push([nr,nc,k]); } } return o; };   // 8 向（含斜线）同类未访邻居
  // 穷举「过起点」最长简单路径：前臂(frontDFS 走起点一侧)×后臂(backDFS 走另一侧)的所有组合都试，取最长。
  // 比「先贪心吃最长一臂」更优——后者会把另一侧本该留的格子占掉（漏掉起点旁那个）。预算封顶防卡顿（最坏 ~40ms，实战单类型块小、<5ms）。
  let best=[[r0,c0]], budget=400000;
  const vis=new Set([r0*COLS+c0]); const front=[[r0,c0]];
  function backDFS(r,c,back){
    if(--budget<0) return;
    if(front.length+back.length-1>best.length) best=front.slice(1).reverse().concat([[r0,c0]], back.slice(1));
    for(const [nr,nc,k] of nbrs(r,c,vis)){ vis.add(k); back.push([nr,nc]); backDFS(nr,nc,back); back.pop(); vis.delete(k); }
  }
  function frontDFS(r,c){
    if(budget<0) return;
    backDFS(r0,c0,[[r0,c0]]);   // 固定当前前臂，从起点向另一侧穷举后臂
    for(const [nr,nc,k] of nbrs(r,c,vis)){ vis.add(k); front.push([nr,nc]); frontDFS(nr,nc); front.pop(); vis.delete(k); }
  }
  frontDFS(r0,c0);
  return best;
}
function autoGreedyChain(r0,c0,type){
  const chain=greedyChain(r0,c0,type);
  if(chain.length<2){ const t=grid[r0][c0]; if(t) showTileInfo(t); return; }   // 没有可连同类邻居 → 退化为看信息
  selection=chain.map(([r,c])=>({r,c,type}));
  lastPointer=null; busy=true;   // 先把连线亮出来一拍再结算（busy 只锁输入、不挡渲染；draw 见 selection 即画线）
  setTimeout(()=>{ busy=false; if(selection.length){ resolve(); selection=[]; } updateHUD(); }, 260);
}
function startDrag(e){
  if(replaying){ e.preventDefault(); togglePauseReplay(); return; }   // 回放中：棋盘不可操作；点棋盘=暂停/继续
  if(busy||pendingLevels) return;
  const cell=cellFromEvent(e); if(!cell) return;
  const t=grid[cell.r][cell.c]; if(!t) return;
  // 双击 盾/心/金 → 贪心连线（双击窗口内、同一格的第二次 pointerdown）
  if(tapInfoTimer && tapInfoCell && tapInfoCell.r===cell.r && tapInfoCell.c===cell.c){
    clearTimeout(tapInfoTimer); tapInfoTimer=null; tapInfoCell=null;
    if(t.type==='shield'||t.type==='heart'||t.type==='coin'){ e.preventDefault(); autoGreedyChain(cell.r,cell.c,t.type); return; }
  }
  if(tapInfoTimer){ clearTimeout(tapInfoTimer); tapInfoTimer=null; tapInfoCell=null; }   // 点了别处 → 取消上一个待弹信息
  // 从怪物 / 火焰链可划过的 Boss 起手 → 视为剑攻击链
  const base = (isSwordTarget(t) || isFireChainTarget(t)) ? 'sword' : t.type;   // 怪 / 可攻击Boss / 火焰链可点燃Boss 起手 → 剑链
  // 不可连的 Boss 仍允许轻触查看信息（连线不会扩展，松手即弹说明）
  if(t.type!=='boss' && !CONNECTABLE.includes(base)) return;
  dragging=true; dragExtended=false; selection=[{r:cell.r,c:cell.c,type:base}];
  dragStartX=e.clientX; dragStartY=e.clientY;
  e.preventDefault();
}
function moveDrag(e){
  if(!dragging) return; e.preventDefault();
  const cell=cellFromEvent(e); if(!cell) return;
  const t=grid[cell.r][cell.c]; if(!t) return;
  const last=selection[selection.length-1];
  // 回退
  if(selection.length>=2){
    const prev=selection[selection.length-2];
    if(prev.r===cell.r&&prev.c===cell.c){ selection.pop(); return; }
  }
  if(selection.some(s=>s.r===cell.r&&s.c===cell.c)) return; // 已选
  const base=selection[0].type;
  if(base!=='sword' && !CONNECTABLE.includes(base)) return;   // 'boss' 等不可成链的起手仅用于轻触查看信息，不可拖成多格
  const ok = t.type===base || (base==='sword' && (isSwordTarget(t) || isFireChainTarget(t))); // 剑链可穿怪/可攻击Boss；火焰链开启时也可从剑免疫 Boss 起手并划过点燃
  if(!ok) return;
  if(Math.abs(cell.r-last.r)<=1 && Math.abs(cell.c-last.c)<=1){ // 相邻8向
    selection.push({r:cell.r,c:cell.c,type:t.type}); dragExtended=true; }
}
function endDrag(e){
  if(!dragging) return; dragging=false;
  if(selection.length>=2){
    // 剑链必须含至少一把剑（剑是武器）：从怪起手却没把任何剑连进来 → 不算攻击，取消且不消耗回合
    if(selection[0].type==='sword' && !selection.some(s=>{ const t=grid[s.r][s.c]; return t&&t.type==='sword'; })){
      log(tr(`⚔️ 没把${wN()}连进来，无法攻击——${wN()}才是你的武器！`,`⚔️ No ${wN()} in the chain — link a ${wE()} to attack!`));
    } else resolve();
  }
  if(selection.length===1){
    const dx=e.clientX-dragStartX, dy=e.clientY-dragStartY;
    if(Math.abs(dx)<10 && Math.abs(dy)<10){ const s=selection[0], t=grid[s.r][s.c];
      if(t){
        if(t.type==='shield'||t.type==='heart'||t.type==='coin'){   // 可双击贪心连线的类型 → 延迟弹信息，留出双击窗口
          if(tapInfoTimer) clearTimeout(tapInfoTimer);
          tapInfoCell={r:s.r,c:s.c}; const tt=t;
          tapInfoTimer=setTimeout(()=>{ tapInfoTimer=null; tapInfoCell=null; showTileInfo(tt); }, 280);
        } else showTileInfo(t);   // 怪/Boss/剑：即时弹信息（无双击连线）
      }
    }
  }
  selection=[]; lastPointer=null;
}
cv.addEventListener('pointerdown',startDrag);
cv.addEventListener('pointermove',moveDrag);
window.addEventListener('pointerup',endDrag);

const SHOP={

  bomb: {cost:25, f(){ let kills=0, boss=0; const extra = bombGoldSacrificeBonus(player); if(extra>0) player.gold=Math.max(0, player.gold-extra); const D = bombDamage(player)+extra;   // 基础5 + 爆破手累计 + 乾坤一掷（先买炸弹，再额外扣当前金币 20% 换伤害）
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c];
      if(t&&(t.type==='enemy'||t.type==='boss')){ if(t.finale) continue; addBombFx(r,c); const dd=Math.min(D,t.hp); t.hp-=D; statueReflect(t, dd);   // 终焉之主打不掉；石像反弹；每个命中格爆一下特效
        if(t.hp<=0){ const isBoss=t.type==='boss'; grid[r][c]=null;
          if(isBoss){ thiefRecover(t); boss++; player.xp+=15; gainGold(20); onBossKilled(); } else { kills++; player.xp+=3+(player.killXp||0); if(player.rotflesh) player.maxHp++; } } } }   // 屠夫·积累腐肉：炸弹击杀也 +1 上限
    const lifeHeal=lifestealHeal(kills+boss);   // 汲取生命：炸弹击杀也回血
    log(tr(`💥 投掷炸弹，全场 −${D}`+(extra?`（乾坤一掷 +${extra}）`:''),`💥 Bomb: all foes −${D}`+(extra?` (All-In +${extra})`:'')) + (kills?tr(`，击杀 ${kills} 只👹`,`, ${kills} killed`):'') + (lifeHeal?tr(`，吸血 +${lifeHeal}`,`, +${lifeHeal} lifesteal`):'') + (boss?tr(`，击败 ${boss} 个 Boss`,`, ${boss} boss(es) down`):''));   // Boss 奖励日志由 onBossKilled 统一报
    if(player.bombBoost) player.bombUses=(player.bombUses||0)+1;   // 爆破手：每用一次 → 下次 伤害+1、花费+5
    applyGravity(); syncPositions(false); }},
};
function shopCost(key){ let c=SHOP[key].cost; if(key==='heal') c+=(player.healUses||0); if(key==='bomb'&&player.bombBoost) c+=5*(player.bombUses||0); if(player.cheapskate) c=Math.ceil(c/2); return c; } // 治疗：每用一次，下次花费 +1 金；爆破手：每用一次炸弹，下次花费 +5 金；小气鬼：花费减半
function buyItem(key){
  if(busy||pendingLevels) return;
  if(player.frozen && player.frozen[key]>0) return;   // 雪人冰封该槽（治疗/炸弹），数回合内不可用
  if(player.skill2 && player.skill2.slot===key){ castSkill2(key); return; }   // 该槽被换装主动占用 → 施放，不再购买消耗品
  if(key==='heal' && player.hp>=player.maxHp) return;   // 满血时治疗无意义，不可用（HUD 亦置灰）
  if(typeof player.shopCd!=='object'||!player.shopCd) player.shopCd={}; // 兼容旧存档
  if(player.goldLock>0) return;               // 守财奴囤金期间不可用商店
  if(player.shopCd[key]>0) return;            // 该商品冷却中
  const it=SHOP[key]; if(!it) return;
  const cost=shopCost(key); if(player.gold<cost) return;
  player.gold-=cost; it.f();
  if(grid.some(row=>row.some(t=>!t))){ applyGravity(); syncPositions(false); }   // 商店即时效果（如神圣打击）若打出空洞，立刻补格；正常回合结算仍走 resolve 末尾统一补格
  recAct(['b',key]);   // 录制购买
  player.shopCd[key]= (key==='bomb' && player.bombCd) ? player.bombCd : 3;  // 炸弹默认冷却 3；若有被动修改 bombCd，则按其值进入冷却
  checkLevel(); updateHUD();
  const pops=()=>{
    if(player.t1Pending){ player.t1Pending=false; showTierSelect(1); return; }  // 炸弹击败Boss也可触发转职
    if(player.t2Pending){ player.t2Pending=false; showTierSelect(2); return; }
    if(player.t3Pending){ player.t3Pending=false; showTierSelect(3); return; }
    if(player.t4Pending){ player.t4Pending=false; showSkillSwap(); return; }
    if(pendingLevels){ showLevelUp(); return; }
    checkDeadlock();   // 用掉炸弹后若仍无棋可连且无就绪动作 → 判负，不卡死
  };
  // 炸弹有爆炸特效：若同回合要弹转职/升级框，先等特效播完再弹，否则框直接盖住爆炸看不到（仅实玩；回放/无头/快进无特效，立即弹不影响确定性）
  const hasPop = player.t1Pending||player.t2Pending||player.t3Pending||player.t4Pending||pendingLevels;
  if(key==='bomb' && !replaying && !headless && bombFx.length && hasPop){
    busy=true; updateHUD();   // pendingLevels/busy 已挡输入；等特效
    setTimeout(()=>{ busy=false; pops(); }, BOMB_FX_MS);
  } else pops();
}
// 施放换装主动（占用 治疗/炸弹 槽）。走独立冷却 skill2Cd；录像用占用的槽位 key，回放经 buyItem 复现。
function castSkill2(key){
  if(player.skill2Cd>0) return;
  prophecySlotKey=key;
  const def=TIER1[player.skill2.id], sk=def&&def.skill; if(!sk) return;
  const r=sk.f(player);
  if(r===false) return;        // 技能无效（如对无甲用锻甲）：不进冷却、不刷日志
  if(r==='__defer__') return;   // 先知换装：技能函数里已弹框，等待选择
  if(!sk.noCd) player.skill2Cd=effSkillCd(player.skill2.id);   // 无冷却技能（收买）不进冷却
  recAct(['b',key]);   // 录制（占用槽位 key）；回放 dispatchReplayAct('b',key)→buyItem→castSkill2
  if(r===undefined) log(tr(`✨ 【${L(sk.name)}】发动！`,`✨ ${L(sk.name)} activated!`), 'buff');
  checkLevel(); updateHUD();
  if(player.t3Pending){ player.t3Pending=false; showTierSelect(3); return; }
  if(player.t4Pending){ player.t4Pending=false; showSkillSwap(); return; }
  if(pendingLevels){ showLevelUp(); return; }
  checkDeadlock();   // 用掉换装主动后若仍无棋可连 → 判负，不卡死
}
document.querySelectorAll('.shopBtn[data-buy]').forEach(b=>{

});

// 长按商店/技能块 → 弹出详细说明（纯 UI，不进录像、不影响对局）。即使按钮置灰（冷却/买不起）也可长按查看。
function attachLongPress(el, key){
  let timer=null, fired=false, sx=0, sy=0;
  const clear=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  el.addEventListener('pointerdown', e=>{ if(busy||pendingLevels||replaying) return; fired=false; sx=e.clientX; sy=e.clientY; clear();
    timer=setTimeout(()=>{ timer=null; fired=true; showShopInfo(key); }, 450); });
  el.addEventListener('pointermove', e=>{ if(timer && (Math.abs(e.clientX-sx)>10 || Math.abs(e.clientY-sy)>10)) clear(); });
  el.addEventListener('pointerup', clear);
  el.addEventListener('pointercancel', clear);
  el.addEventListener('pointerleave', clear);
  el.addEventListener('click', e=>{ if(fired){ e.preventDefault(); e.stopImmediatePropagation(); fired=false; } }, true);  // 长按已触发 → 吞掉随后的点击，不误买/误放
}

//==================== 职业主动技能 ====================
// 实际冷却 = 技能基础冷却 + 全局修正（如活死人迷惑 +1），最低 1；骷髅王「重生」每实际复活一次再 +2（递增）。
function effSkillCd(id){
  const sk=id&&TIER1[id]&&TIER1[id].skill; if(!sk) return 5;
  let cd=sk.cd+(player.skillCdMod||0);
  if(id==='skeletonking') cd+=2*(player.rebirthSaves||0);
  return Math.max(1, cd);
}
function prophecyLabel(type, en){
  if(type==='coin') return en?'coins':tr('金币','coins');
  if(type==='shield') return en?'shields':tr('盾','shields');
  if(type==='heart') return en?'hearts':tr('心','hearts');
  if(type==='sword') return en?'swords':tr('剑','swords');
  if(type==='enemy') return en?'enemies':tr('怪物','enemies');
  return type||'—';
}
function activateSeerSkill(type, fromReplay, slotKey){
  if(!player) return false;
  player.prophecyPending=type;
  if(slotKey){ player.skill2Cd=effSkillCd(player.skill2.id); if(!fromReplay) recAct(['b',slotKey,'seer',type]); }
  else { player.skillCd=effSkillCd(player.tier1); if(!fromReplay) recAct(['k','seer',type]); }
  prophecySlotKey=null;
  log(tr(`🔮 神谕已定：下一次补子将落下${prophecyLabel(type)}` ,`🔮 Prophecy set: the next refill will drop ${prophecyLabel(type,true)}`), 'buff');
  checkLevel(); busy=false; hideOverlay(); updateHUD();
  if(player.t3Pending){ player.t3Pending=false; showTierSelect(3); return true; }
  if(player.t4Pending){ player.t4Pending=false; showSkillSwap(); return true; }
  if(pendingLevels){ showLevelUp(); return true; }
  checkDeadlock();
  return true;
}
