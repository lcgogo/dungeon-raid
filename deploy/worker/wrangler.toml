name = "dungeon-raid-rec"
main = "../../worker/src/index.js"
compatibility_date = "2026-06-01"

# 自定义域名：API 走 api.dungeonraid.win（绑定时自动建代理DNS+证书）
[[routes]]
pattern = "api.dungeonraid.win"
custom_domain = true

# 定时任务：每 10 分钟刷新一次上传门槛快照；每日 18:13 UTC 自动清理旧版本+陈旧录像（scheduled() 统一处理）
[triggers]
crons = ["7,17,27,37,47,57 * * * *", "13 18 * * *"]

# KV：存录像
[[kv_namespaces]]
binding = "REC"
id = "4120eb6aa18944e7892d9607bc5cfb06"

# D1：排行榜分数。database_id 在 `wrangler d1 create dungeon-raid-scores` 后填入。
# schema 变更走迁移框架：worker/migrations/ 下放 NNNN_*.sql，
# `npx wrangler d1 migrations apply dungeon-raid-scores --remote --config deploy/worker/wrangler.toml` 按 d1_migrations 记录只跑没跑过的。
[[d1_databases]]
binding = "DB"
database_name = "dungeon-raid-scores"
database_id = "eea75d9c-bce5-433a-81a5-10c946a664fd"
migrations_dir = "../../worker/migrations"

# 注：密钥不写在此文件；从仓库根用 `npx wrangler secret list --config deploy/worker/wrangler.toml` 查看，
# 用 `npx wrangler secret put <NAME> --config deploy/worker/wrangler.toml` 覆盖。

# 限流：写入类端点（/rec /score /clear）按来源 IP 限速，挡刷榜/批量伪造。period 仅支持 10 或 60 秒。
[[unsafe.bindings]]
name = "WRITE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
