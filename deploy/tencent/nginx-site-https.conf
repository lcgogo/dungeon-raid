server {
    listen 80;
    listen [::]:80;
    server_name dungeonraid.cn www.dungeonraid.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dungeonraid.cn www.dungeonraid.cn;

    root /var/www/dungeonraid;
    index index.html;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/www.dungeonraid.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.dungeonraid.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass https://api.dungeonraid.win/;
        proxy_http_version 1.1;
        proxy_set_header Host api.dungeonraid.win;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name api.dungeonraid.win;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
