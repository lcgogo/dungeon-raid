  musketeer:{n:['鐏灙鎵?,'Musketeer'], quip:['涓€棰楀瓙寮癸紝鍠傞ケ鏈€鑲ョ殑閭ｄ釜銆?,'One bullet for the fattest one.'], skill:{name:['鐙欏嚮','Snipe'], short:['浼樺厛杞?Boss锛涘 Boss 鍙栬鏈€灏?,'Prioritize bosses; lowest-HP boss first'], desc:['浼樺厛鐙欏嚮鍦轰笂鐨?Boss锛涘鏋滄湁澶氫釜 Boss锛屽垯閫夋嫨銆愮敓鍛芥渶浣庛€戠殑閭ｄ釜銆傝嫢鍦轰笂娌℃湁 Boss锛屽啀鐙欏嚮褰撳墠鐢熷懡鏈€楂樼殑鎬?Boss锛堢偢寮瑰紡鏀诲嚮锛屽惈{W}鍏嶇柅涓庣壒娈?Boss锛岀粓鐒変箣涓婚櫎澶栵級锛屼激瀹?= 鐐稿脊浼ゅ 脳2锛堢偢寮硅銆岀垎鐮存墜銆嶅己鍖栨椂锛岀嫏鍑诲悓姝ュ寮猴級銆傝嫢杩欎竴鍙戞妸瀹冩墦姝伙紝鑾峰緱 3 鍊嶇粡楠屼笌 3 鍊嶉噾甯併€傚満涓婃病鏈夌洰鏍囨椂鏃犳晥銆佷笉杩涘喎鍗淬€?,'Prioritize bosses on the board; if there are multiple bosses, shoot the one with the **lowest HP**. If there is no boss, fall back to the highest-HP monster/boss (bomb-type 鈥?hits {W}-immune & special bosses; not the Overlord) for 2脳 your Bomb damage (scales with Demolitionist). If the shot kills, gain triple XP and triple gold. No effect 鈥?and no cooldown 鈥?when there is no target.'], cd:5, f:p=>{
    let bossT=null, bossR=-1, bossC=-1, bossHP=Infinity, t=null, tr_=-1, tc=-1, best=-1;

async function fetchServerSeed(rc){
  if(DEV) return null;
  if(typeof navigator!=='undefined' && navigator.onLine===false) return null;
  try{
    const qs = new URLSearchParams({ race: rc.id, version: VERSION });
    const r=await fetch(REC_API+'/seed?'+qs.toString(),{method:'POST'});
    if(r&&r.ok){ const x=await r.json(); if(typeof x.seed==='number'&&x.token) return {seed:x.seed>>>0, token:x.token, threshold:x.threshold||null}; }
  }catch(e){}
  return null;
}

function toast(html, ms){
  if(headless||replaying) return;
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.style.cssText='position:fixed;left:50%;top:13%;transform:translateX(-50%);max-width:86%;z-index:70;background:rgba(40,32,16,.96);border:1px solid var(--gold);color:#ffe9a8;font-size:13px;line-height:1.55;padding:10px 14px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.55);text-align:center;transition:opacity .45s;opacity:1';
  el.innerHTML=html;
  clearTimeout(toast._t); toast._t=setTimeout(()=>{ el.style.opacity='0'; }, ms||4200);
}

  syncPositions(true);
  hideOverlay(); logClear();
  log(tr(`銆?{rc.e}${L(rc.n)}銆戣笍鍏ュ湴鐗⑩€?绁濅綘濂借繍锛乣, `${rc.e}${L(rc.n)} enters the dungeon鈥?good luck!`));

function cellX(c){ return PAD + c*TILE; }

function syncPositions(snap){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=grid[r][c]; if(!t) continue;

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// 棰勮锛氬綋鍓嶅墤閾句細鏉€姝诲摢浜涙€紙涓?dealDamage 閫昏緫淇濇寔涓€鑷达級
function previewKills(){
  // 鍓戦摼涓斿凡鏋勬垚鍙秷闄ょ殑杩炵嚎锛堥暱搴︹墺2锛屾€捣鎵嬫椂鎬嚜韬篃鍗犱竴鏍硷級
  if(!dragging || selection.length<2 || selection[0].type!=='sword') return null;
  const targets=selection.filter(s=>isSwordTarget(grid[s.r][s.c]));
  if(!targets.length) return null; // 娌′覆鍒版€?鈫?涓嶉€犳垚浼ゅ锛屾棤鍑绘潃棰勮
  const nS=selection.filter(s=>{const t=grid[s.r][s.c]; return t&&t.type==='sword';}).length;
  if(nS<1) return null;   // 娌¤繛杩涗换浣曞墤 鈫?涓嶇畻鏀诲嚮锛堜笌 endDrag 涓€鑷达級锛屼笉鏄剧ず楠烽珔棰勮
  const combo=1+Math.max(0,nS-2)*0.15*(player.comboMult||1);
  const titanFlat=(player.titan?Math.floor(player.maxHp/12):0)+shieldBashFlat(player);   // 宸ㄥ姏 + 鐩惧嚮(鎶ょ敳鍑忎激閲忊啋鍥哄畾鍓戜激)
  let pool=(nS*player.weaponPower+player.swordFlat+titanFlat)*combo*(player.swordMult||1);
  if(player.lowHpDmg) pool*=1+(1-player.hp/player.maxHp)*0.6;
  pool=Math.floor(pool);
  // 涓庣粨绠椾竴鑷达細姣忓彧鎬嫭绔嬪悆婊?pool锛宲ool鈮ヨ閲忓嵆姝?
  const dead=new Set();
  targets.forEach(s=>{const t=grid[s.r][s.c]; if(isSwordTarget(t) && pool>=t.hp) dead.add(s.r+','+s.c);});
  return dead;
}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  // 閫変腑闆嗗悎锛堝揩閫熸煡鎵撅級
  const sel=new Set(selection.map(s=>s.r+','+s.c));
  const chainType=selection.length?selection[0].type:null;
  const killSet=previewKills();
  const poisoned=pollutionActive();   // 姹℃煋鎬湪鍦烘椂鍏ㄥ満蹇冩樉绀轰负姣掑績锛堢豢蹇冿級
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=grid[r][c]; if(!t) continue;
    const isPoisonHeart = t.type==='heart' && poisoned;
    const isBlackHeart = t.type==='heart' && !poisoned && t.poison;   // 涓囩墿鐨嗘瘨锛氶粦姣掑績锛堟薄鏌撶豢蹇冧紭鍏堬級
    const x=cellX(c), y=(t.curY!==undefined?t.curY:cellY(r));
    const d=DEF[t.type], g=TILE-8;
    const picked=sel.has(t.r+','+t.c);
    const coiled = player && player.deathCoil>0 && (t.type==='enemy'||(t.type==='boss'&&!t.finale));   // 钄撹棨缂犵粫涓細鏁屼汉鏍煎彉缁?
    // 鑳借鍓戞敾鍑荤殑锛堟€?/ 鍙墤杩炵殑Boss锛屼互鍙婂墤鏈韩锛夌粺涓€绾㈠簳锛屼竴鐪肩湅鍑哄彲鏀诲嚮锛涜敁钘ょ紶缁曚腑鐨勬€敼缁垮簳
    const baseCol = coiled ? '#27ae60' : (isSwordTarget(t) || t.type==='sword') ? DEF.sword.color : d.color;   // 榛戞瘨蹇?缁挎瘨蹇冨簳鑹蹭笌鏅€氬績涓€鑷达紝鍙崲 emoji锛堭煉?馃枻锛?
    // 琚墤閾剧┛杩囩殑鎬?鍙敾鍑籅oss 鈫?绾㈣壊楂樹寒锛堣〃绀烘琚敾鍑伙級
    const gl = (picked && chainType==='sword' && isSwordTarget(t)) ? DEF.sword.glow : coiled ? '#2ecc71' : d.glow;
    // 鑳屾櫙
    ctx.save();
    roundRect(x+4,y+4,g,g,12);
    if(!picked){ ctx.fillStyle=hexA(baseCol,.16); }
    else { ctx.fillStyle=hexA(gl,.30); ctx.shadowColor=gl; ctx.shadowBlur=14; }
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.lineWidth=picked?3:1.5;
    ctx.strokeStyle=picked?gl:hexA(baseCol,.5);
    ctx.stroke();
    ctx.restore();

    const cx=x+TILE/2, cy=y+TILE/2;
    if(t.type==='enemy'||t.type==='boss'){
      const isBoss=t.type==='boss';
      const bdef = isBoss?bossDef(t):null;
      const doomed = killSet && killSet.has(t.r+','+t.c) && (!isBoss || bdef.swordable || player.pierceTurn); // 浼氳杩欐潯绾挎潃姝?鈫?楠烽珔
      ctx.font=Math.floor(TILE*0.30)+'px '+EMOJI_FONT;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(doomed?'馃拃':(isBoss?bdef.emoji:'馃懝'), cx, y+TILE*0.30);
      // 琛€閲忥紙缁堢剦涔嬩富鏃犺銆佹墦涓嶆帀 鈫?鏄剧ず 鈭?鑰岄潪 0锛?
      ctx.fillStyle='#fff'; ctx.font='700 '+Math.floor(TILE*0.34)+'px system-ui';
      if(!t.finale) ctx.fillText(t.hp, cx, cy+TILE*0.10);
      else { ctx.fillStyle='#ffd54a'; ctx.fillText('鈭?, cx, cy+TILE*0.10); }
      // 鏀诲嚮鍔涜鏍囷紙宸︿笂锛夆€斺€旂壒鏁?澶ф嫑鍨?Boss锛堟敾鍑诲姏鏃犳剰涔夛級涓嶆樉绀猴紱浣嗘湁 shownAtk/dynAtk 鐨勬寜灞曠ず鍊兼樉绀猴紝閬垮厤婕忕湅
      if(!isBoss || (!bdef.act && !bdef.cdAttack) || bdef.shownAtk || bdef.dynAtk){
        const av=(isBoss && (bdef.shownAtk||bdef.dynAtk)) ? (bdef.shownAtk?bdef.shownAtk(t):bdef.dynAtk(t)) : t.atk;
        const ax=x+10, ay=y+10, ar=TILE*0.16;
        ctx.beginPath(); ctx.arc(ax,ay,ar,0,7);
        ctx.fillStyle=(isBoss&&bdef.trueDmg)?'#8e44ad':'#c0392b'; ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font='700 '+Math.floor(TILE*0.20)+'px system-ui';
        ctx.fillText(av, ax, ay+1);
      }
      // 鍊掕鏃惰鏍囷紙鍙充笂锛夛細鏅€?Boss=鍊掕鏃讹紱姣忓洖鍚堣鍔ㄥ瀷=鎭掋€?銆嶏紙姣忓洖鍚堥兘鍑烘墜锛夛紱缁堢剦涔嬩富涓嶆樉绀?
      if(!isBoss || !bdef.finale){
        const perT = isBoss && bdef.perTurn, cv = perT ? 1 : t.cd;
        const bx=x+g-4, by=y+10, br=TILE*0.16;
        ctx.beginPath(); ctx.arc(bx,by,br,0,7);
        ctx.fillStyle = cv<=1? '#e74c3c' : cv<=2? '#e67e22' : '#2c3e50';
        ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font='700 '+Math.floor(TILE*0.20)+'px system-ui';
        ctx.fillText(perT ? '1' : t.cd, bx, by+1);
      }
    } else {
      ctx.font=Math.floor(TILE*0.46)+'px '+EMOJI_FONT;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(t.type==='sword'?wE():(isPoisonHeart?'馃挌':isBlackHeart?'馃枻':d.emoji), cx, cy);   // 鏀诲嚮鏍兼寜绉嶆棌姝﹀櫒锛涚豢姣掑績/榛戞瘨蹇?

function greedyChain(r0,c0,type){

  const nbrs=(r,c,vis)=>{ const o=[]; for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){ if(!dr&&!dc) continue; const nr=r+dr,nc=c+dc; if(!inB(nr,nc)) continue; const t=grid[nr][nc]; if(t&&t.type===type){ const k=nr*COLS+nc; if(!vis.has(k)) o.push([nr,nc,k]); } } return o; };   // 8 鍚戯紙鍚枩绾匡級鍚岀被鏈閭诲眳
  // 绌蜂妇銆岃繃璧风偣銆嶆渶闀跨畝鍗曡矾寰勶細鍓嶈噦(frontDFS 璧拌捣鐐逛竴渚?脳鍚庤噦(backDFS 璧板彟涓€渚?鐨勬墍鏈夌粍鍚堥兘璇曪紝鍙栨渶闀裤€?
  // 姣斻€屽厛璐績鍚冩渶闀夸竴鑷傘€嶆洿浼樷€斺€斿悗鑰呬細鎶婂彟涓€渚ф湰璇ョ暀鐨勬牸瀛愬崰鎺夛紙婕忔帀璧风偣鏃侀偅涓級銆傞绠楀皝椤堕槻鍗￠】锛堟渶鍧?~40ms锛屽疄鎴樺崟绫诲瀷鍧楀皬銆?5ms锛夈€?

  function frontDFS(r,c){
    if(budget<0) return;
    backDFS(r0,c0,[[r0,c0]]);   // 鍥哄畾褰撳墠鍓嶈噦锛屼粠璧风偣鍚戝彟涓€渚х┓涓惧悗鑷?
    for(const [nr,nc,k] of nbrs(r,c,vis)){ vis.add(k); front.push([nr,nc]); frontDFS(nr,nc); front.pop(); vis.delete(k); }
  }
  frontDFS(r0,c0);

}

function gainHeal(amount){
  if(player.healMult!=null && player.healMult!==1) amount=Math.round(amount*player.healMult);   // 娲绘浜猴細涓€鍒囨不鐤楀噺鍗婏紙閲嶇敓婊¤璧?hp=maxHp锛屼笉缁忔澶勶級
  const space=player.maxHp-player.hp;
  if(amount<=space){ player.hp+=amount; return amount; }
  player.hp+=space; const over=amount-space;
  if(player.holyStrike && over>0) holyStrikeDamage(over); // 绁炲湥鎵撳嚮锛氭孩鍑虹殑娌荤枟鍖栦负瀵归殢鏈烘晫浜虹殑鏀诲嚮

function holyStrikeDamage(amt){
  let bossT=null, bossR=-1, bossC=-1, bossHP=Infinity, t=null, tr_=-1, tc=-1, best=-1;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const g=grid[r][c]; if(!g||g.finale) continue;
    if(g.type==='boss'){ if(g.hp<bossHP){ bossT=g; bossHP=g.hp; bossR=r; bossC=c; } }
    else if(g.type==='enemy' && g.hp>best){ t=g; best=g.hp; tr_=r; tc=c; }
  }
  if(bossT){ t=bossT; tr_=bossR; tc=bossC; }
  if(!t) return;
  const isBoss=t.type==='boss', name=isBoss?L(bossDef(t).name):tr('鏅€氭€?,'enemy'), before=t.hp, dealt=Math.min(amt,before);
  addBombFx(tr_,tc);
  t.hp-=amt;
  if(t.hp<=0){ grid[tr_][tc]=null; if(isBoss){ thiefRecover(t); player.xp+=15; gainGold(20); onBossKilled(); } else { player.xp+=3+(player.killXp||0); gainGold(1); } }
  log(tr(`鉁?绁炲湥鎵撳嚮锛氫紭鍏堝懡涓?${name}锛岄€犳垚 ${dealt} 浼ゅ`+(t.hp<=0?`锛屽嚮鏉€锛乣:''),`鉁?Holy Strike: hit ${name} first for ${dealt} dmg`+(t.hp<=0?`, killed!`:'')));
}

  else { for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c];
    if(hits(t)) list.push({r,c,t}); } }   // 鍏ㄥ満鍨嬶紙绠洦锛歛llFoes 缂虹渷鈫掑彧鍙墤鏀诲嚮 / 铔婃瘨路榛戞瘨蹇冿細allFoes鈫掑惈鍓戝厤鐤級
  // 鍘熺増绠楁硶锛氬墤閾句激瀹冲姣忓彧鐩爣銆愮嫭绔嬨€佸叏棰濄€戠敓鏁堬紝涓嶅叡浜€佷笉鍒嗛厤
  const splashes=[];
  for(const e of list){
    const before=e.t.hp;
    if(player.rogueStealTurn && !allFoes && targets) bonusGold += Math.max(1, Math.floor(before*0.2));
    const hit=Math.min(pool, before);

function hurtPlayer(atk, sourceKey, ignoreArmor, attacker){
  if(player.shieldTurn) return 0;
  const armorReducer = player.armor*(player.armorMult||1) + (player.toughness||0);
  let dmg = ignoreArmor ? atk : Math.max(1, atk - armorReducer);

  if(player.tycoonGoldShield && player.goldLock>0 && dmg>0){
    const paid = loseGoldForShield(dmg), spill = dmg-paid;
    if(paid>0) log(tr(`馃捀 閽辫兘涔板懡锛氳姳鎺?${paid} 閲戝竵鎸′綇 ${paid} 浼ゅ`,`馃捀 Money Buys Life: spend ${paid} gold to block ${paid} damage`), 'buff');
    dmg = spill;
  }
  player.hp -= dmg;
  if(player.undyingTurn && player.hp<1) player.hp=1; // 鐙傛€掍笉灞堬細鏈洖鍚堟渶浣庝繚鐣?1 琛€
  if(player.rebirthTurn && player.hp<=0){ player.hp=player.maxHp; player.rebirthTurn=false; player.rebirthSaves=(player.rebirthSaves||0)+1; // 楠烽珔鐜嬮噸鐢燂細鏈洖鍚堣嚧姝诲垯婊¤澶嶆椿锛屾鍚庨噸鐢熷喎鍗?+2
    log(tr('馃拃 楠烽珔鐜嬮噸鐢燂紒鐢熷懡鎭㈠鑷虫弧锛堥噸鐢熷喎鍗?+2锛?,'馃拃 Skeleton King reborn! Full HP (Rebirth cooldown +2)'), 'heal'); }
  addDmg(sourceKey, dmg);
  if(player.thorns && dmg>0 && attacker){ const refl=Math.round(player.armor*(player.armorMult||1)+(player.toughness||0)); if(refl>0) reflectThorns(refl, attacker); }   // 鑽嗘锛氬彈鍒般€岀湡路鏀诲嚮銆嶆椂鎶婂綋鍓嶆姢鐢插噺浼ら噺鍙嶅脊缁欐敾鍑昏€咃紙闈炴敾鍑讳笉浼?attacker鈫掍笉鍙嶅脊锛?
  return dmg;
}

function lifestealHeal(n){ if(!player.lifesteal||n<=0) return 0; return vampGain(n*player.lifesteal); }

function vampGain(amount){
  if(amount<=0) return 0; const b=player.hp, space=player.maxHp-player.hp;
  if(amount<=space){ player.hp+=amount; return player.hp-b; }
  player.hp=player.maxHp; const over=amount-space;
  if(player.bloodFrenzy && over>0){ const add=Math.max(1,Math.floor(over*0.3)); player.maxHp+=add; player.hp+=add; }   // 琛€鐙傦細婧㈠嚭30%鈫掓案涔呯敓鍛戒笂闄?
  return player.hp-b;
}

function deathCoilTick(){

    if(t&&(t.type==='enemy'||(t.type==='boss'&&!t.finale))){ t.hp-=dmg; hit++;
      if(t.hp<=0){ const isB=t.type==='boss'; grid[r][c]=null; kills++; if(isB){thiefRecover(t);player.xp+=15;gainGold(20);onBossKilled();} else {player.xp+=3+(player.killXp||0);gainGold(1);} } } }
  if(!hit) return;

  log(tr(`馃煝 钄撹棨缂犵粫锛氬叏鍦烘€?鈭?{dmg}`+(kills?`锛屽嚮鏉€ ${kills}`:'')+(lh?`锛屽惛琛€ +${lh}`:''),`馃煝 Vine Coil: all foes 鈭?{dmg}`+(kills?`, ${kills} killed`:'')+(lh?`, +${lh} lifesteal`:'')));
}
function reflectThorns(amt, atkr){
  let r=-1,c=-1,t=null;
  if(atkr && (atkr.type==='enemy'||(atkr.type==='boss'&&!atkr.finale))){   // 浼樺厛鍙嶅脊缁欍€屾敾鍑昏€呮湰浜恒€嶏細鎸夎韩浠藉湪妫嬬洏涓婃壘瀹?
    for(let rr=0;rr<ROWS&&!t;rr++)for(let cc=0;cc<COLS;cc++){ if(grid[rr][cc]===atkr){ r=rr;c=cc;t=atkr;break; } }
  }
  if(!t){ const es=[]; for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++){ const x=grid[rr][cc]; if(x&&(x.type==='enemy'||x.type==='boss')&&!x.finale) es.push([rr,cc,x]); }
    if(!es.length) return; [r,c,t]=es[Math.floor(rnd()*es.length)]; }   // 鏀诲嚮鑰呭凡涓嶅湪鍦猴紙濡傝嚜韬凡姝伙級鈫?閫€鍥為殢鏈轰竴涓晫浜?
  t.hp-=amt; let lh=0;
  if(t.hp<=0){ const isB=t.type==='boss'; grid[r][c]=null; if(isB){thiefRecover(t);player.xp+=15;gainGold(20);onBossKilled();} else {player.xp+=3+(player.killXp||0);gainGold(1);} lh=lifestealHeal(1); }   // 鑽嗘鍙嶆潃涔熷惛琛€
  log(tr(`馃尩 鑽嗘鍙嶅脊 ${amt} 浼ゅ`+(lh?`锛屽惛琛€ +${lh}`:''),`馃尩 Thorns reflect ${amt}`+(lh?`, +${lh} lifesteal`:'')));
}

function applyGravity(){
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;

  }
}

let replayRec=null, replayIdx=0, replayTimer=null, replaySpeed=1, replayPaused=false, replayTotalTurns=0, replayAutoPaused=false, replayPending=null;
let jumping=false;   // 璺冲洖鍚堝揩杩涙湡闂达細鎶戝埗 gameOver/onClear锛岄伩鍏嶏紙褰曞儚鑻ヤ笉涓€鑷磋€屾彁鍓嶆浜℃椂锛夌洿鎺ュ脊鍑虹粨鏉熺敾闈?
const REPLAY_BASE=620;   // 姣忔鍩虹闂撮殧 ms锛堟寜鍊嶉€熺缉鐭級
function startReplay(recObj){
  if(!recObj||!Array.isArray(recObj.acts)){ alert(tr('褰曞儚鏃犳晥','Invalid recording')); return; }
  replayResumeState = player&&grid ? {
    player: JSON.parse(JSON.stringify(player)),
    grid: grid.map(row=>row.map(t=> t?{type:t.type,hp:t.hp,maxHp:t.maxHp,atk:t.atk,cd:t.cd,baseCd:t.baseCd,bossId:t.bossId,tier:t.tier,stolen:t.stolen,finale:t.finale,incub:t.incub,poison:t.poison}:null)),
    pendingLevels, busy, dragging:!!dragging, selection:selection?selection.map(s=>({...s})):[], rec:rec?JSON.parse(JSON.stringify(rec)):null, ended
  } : null;
  replaying=true; replayRec=recObj; replayIdx=0; replaySpeed=1; replayPaused=false; replayAutoPaused=false; replayPending=null; rec=null;
  replayTotalTurns=recObj.acts.filter(a=>a[0]==='m').length;   // 鎬诲洖鍚堟暟锛?杩炵嚎鍔ㄤ綔鏁帮級
  hideOverlay(); busy=false;
  startGame(raceById(recObj.race));    // replaying=true 鈫?鐢?recObj.seed 鎾銆佷笉鏂板缓褰曞儚
  document.getElementById('replayBar').classList.add('show');
  renderJumps(); updateReplayBar(); scheduleReplay();
}
function scheduleReplay(delay){ clearTimeout(replayTimer); if(replayPaused||!replaying) return; replayTimer=setTimeout(replayStep, delay==null?REPLAY_BASE/replaySpeed:delay); }
function replayStep(){
  if(!replaying) return;
  if(replayPending){   // 绗簩鎷嶏細缁撶畻涓婁竴鎷嶅凡棰勬樉绀鸿繛绾跨殑閭ｆ
    const a=replayPending; replayPending=null; replayIdx++;
    try{ dispatchReplayAct(a); }catch(e){ log('鍥炴斁鍑洪敊: '+e.message); replayDone(); return; }
    if(!replaying) return;   // resolve 鍙兘宸茶Е鍙?gameOver鈫抯topReplay
    // 鍊掓暟 10 鍥炲悎鑷姩鏆傚仠涓€娆★紝鏂逛究鐪嬫竻鎬庝箞姝荤殑
    if(!replayAutoPaused && replayTotalTurns>10 && player && player.hp>0 && player.turns>=replayTotalTurns-10){
      replayAutoPaused=true; replayPaused=true; selection=[];   // 闈欐甯ф竻鎺夎繛绾?
      log(tr('鈴?鎺ヨ繎灏惧０锛屽凡鑷姩鏆傚仠銆傜偣 鈻?缁х画鐪嬬粨灞€銆?,'鈴?Auto-paused near the ending. Press 鈻?to watch how it ends.'));
    }
    updateReplayBar(); scheduleReplay(); return;
  }
  if(replayIdx>=replayRec.acts.length){ replayDone(); return; }
  const a=replayRec.acts[replayIdx];
  if(a[0]==='m'){   // 绗竴鎷嶏細鍦ㄣ€岀粨绠楀墠銆嶇殑妫嬬洏涓婂厛鎶婃湰姝ヨ繛绾跨敾鍑烘潵锛屽崐鎷嶅悗鍐嶇粨绠楋紙杩炵嚎鎵嶅寰椾笂妫嬪瓙锛?
    selection=a[1].map(([r,c],i)=>({r,c,type:i===0?a[2]:(grid[r][c]?grid[r][c].type:a[2])}));
    replayPending=a; updateReplayBar();
    scheduleReplay(Math.max(110, REPLAY_BASE/replaySpeed*0.5));
    return;
  }
  // 闈炶繛绾垮姩浣滐紙涔伴亾鍏?鎶€鑳?鍗囩骇/杞亴锛夛細鐩存帴鎵ц
  replayIdx++;
  try{ dispatchReplayAct(a); }catch(e){ log('鍥炴斁鍑洪敊: '+e.message); replayDone(); return; }
  if(!replaying) return;
  updateReplayBar(); scheduleReplay();
}
function dispatchReplayAct(a){
  const k=a[0];
  if(k==='m'){ const cells=a[1], base=a[2];
    selection=cells.map(([r,c],i)=>({r,c,type:i===0?base:(grid[r][c]?grid[r][c].type:base)}));
    resolve();
    selection=[];   // 缁撶畻鍚庣珛鍗虫竻锛氳繛绾跨敱 replayStep 鍦ㄣ€岀粨绠楀墠銆嶇殑妫嬬洏涓婇鏄剧ず锛堣涓ゆ媿閫昏緫锛夛紝缁濅笉鐢诲湪宸查噸鎺掔殑妫嬬洏涓?
  } else if(k==='b'){ buyItem(a[1]); }
  else if(k==='k'){ activateSkill(); }
  else if(k==='u'){ rollUpgradePool(); applyUpgrade(UPGRADES[a[1]]); updateHUD(); }   // 娲楃墝娑堣€楃瓑閲?RNG锛堜涪寮冪粨鏋滐級锛屾寜褰曞儚绱㈠紩搴旂敤
  else if(k==='t'){ const tier=a[1], id=a[2];
    if(tier===1){ player.tier1=id; }
    else if(tier===3){ player.tier2b=id; TIER2[id].f(player); player.hp=Math.min(player.hp,player.maxHp); }
    else if(tier===4){ player.skill2={id, slot:a[3]}; player.skill2Cd=0; }
    else { player.tier2=id; TIER2[id].f(player); player.hp=Math.min(player.hp,player.maxHp); }
    player.awaitingTier=0; updateHUD();
  }
}
function updateReplayBar(){
  const tt=replayTotalTurns||0;
  const turn=(player?player.turns:0)+(replayPending?1:0);   // 姝ｅ湪棰勬樉绀鸿繛绾匡紙鏈粨绠楋級鏃讹紝鏄剧ず鐨勬槸銆屽嵆灏嗗畬鎴愮殑閭ｄ竴鍥炲悎銆?

function jumpToTurn(target){
  if(!replaying||!replayRec) return;
  const rec0=replayRec, acts=rec0.acts;            // 鏈湴鎸佹湁锛氶槻姝㈠揩杩涗腑璇Е stopReplay 鎶?replayRec 缃┖
  clearTimeout(replayTimer); replayTimer=null; replayPending=null;
  bombFx.length=0; bossFx.length=0; hookFx.length=0;                 // 娓呮帀涓婁竴娈垫畫鐣欑殑鐖嗙偢/鍏ュ満/鎷栨嫿鐗规晥锛屽惁鍒欎細鐢诲湪璺宠浆鍚庣殑妫嬬洏涓?
  replayAutoPaused = target>=replayTotalTurns-10;   // 璺冲埌鎺ヨ繎缁堢偣灏卞埆鍐嶈嚜鍔ㄦ殏鍋?
  replayIdx=0; busy=false; jumping=true; selection=[];   // 蹇繘鏈熼棿鎶戝埗 gameOver/onClear
  try{
    startGame(raceById(rec0.race));                 // replaying=true 鈫?鐢?rec0.seed 閲嶆柊鎾
    let mSeen=0;                                    // 宸茬粨绠楃殑杩炵嚎鏁帮紱鍋滃湪銆岀 target 涓繛绾裤€嶄箣鍓?
    while(replayIdx<acts.length && player.hp>0 && !player.cleared){
      const a=acts[replayIdx];
      if(a[0]==='m' && mSeen+1===target) break;     // 涓嬩竴涓氨鏄洰鏍囪繛绾?鈫?鍋滀笅銆佺暀缁欎笅闈㈤鏄剧ず
      try{ dispatchReplayAct(a); }catch(e){ break; }
      if(a[0]==='m') mSeen++;
      replayIdx++;
    }
  } finally { jumping=false; }
  replaying=true; replayRec=rec0;                   // 鎭㈠鍥炴斁鐘舵€侊紙浠ラ槻蹇繘閲岃鏀瑰姩锛?
  // 鍦ㄣ€岀粨绠楀墠銆嶇殑妫嬬洏涓婇鏄剧ず鐩爣鍥炲悎鐨勮繛绾匡紙绾垮寰椾笂妫嬪瓙锛夛紝鏆傚仠绛夌敤鎴风户缁?
  if(replayIdx<acts.length && acts[replayIdx][0]==='m' && player.hp>0 && !player.cleared){
    const a=acts[replayIdx];
    selection=a[1].map(([r,c],i)=>({r,c,type:i===0?a[2]:(grid[r][c]?grid[r][c].type:a[2])}));
    replayPending=a;
  } else { selection=[]; replayPending=null; }
  replayPaused=true; updateReplayBar();
  const viewT=player.turns+(replayPending?1:0);
  if(!replayPending && (player.hp<=0||player.cleared))
    log(tr(`鈴?璇ュ綍鍍忓湪绗?${player.turns} 鍥炲悎灏辩粨鏉熶簡锛堟棤娉曞啀寰€鍚庤烦锛塦,`鈴?This recording ends at turn ${player.turns} (cannot jump further)`));
  else
    log(tr(`鈴?璺冲埌绗?${viewT} 鍥炲悎锛堝凡鏆傚仠锛岀偣 鈻?缁х画锛塦,`鈴?Jumped to turn ${viewT} (paused, 鈻?to play)`));
}

  if(p.titan) perks.push(tr(`宸ㄥ姏锛氬浐瀹?{wN()}浼?+${Math.floor(p.maxHp/12)}`,`Titan: +${Math.floor(p.maxHp/12)} flat ${wN()} dmg`));
  if(p.thorns) perks.push(tr('鑽嗘锛堝弽寮规姢鐢诧級','Thorns (reflect armor)'));
  if(p.bloodFrenzy) perks.push(tr('琛€鐙傦紙鍚歌婧㈠嚭鍗囦笂闄愶級','Blood Frenzy'));
  if(p.lifesteal) perks.push(tr(`鍚歌 +${p.lifesteal}/鏉€`,`Lifesteal +${p.lifesteal}`));
  if(p.regen) perks.push(tr(`姣忓洖鍚堝洖澶?+${p.regen}`,`Regen +${p.regen}`));
  if(p.holyStrike) perks.push(tr('绁炲湥鎵撳嚮锛堟孩鍑烘敾鍑伙級','Holy Strike'));
  if(p.killXp) perks.push(tr(`鍑绘潃+${p.killXp}缁忛獙`,`+${p.killXp} XP/kill`));
  if(p.tycoonGoldShield) perks.push(tr('閽辫兘涔板懡','Money Buys Life'));
  const perkLine = perks.length ? `<div style="text-align:left;font-size:12px;color:var(--gold);margin:8px 0 0">${tr('鉁?鐗规€э細','鉁?Perks: ')}${perks.join('銆€')}</div>` : '';
  const t1 = p.tier1?TIER1[p.tier1]:null, t2 = p.tier2?TIER2[p.tier2]:null;
  const t2b = p.tier2b?TIER2[p.tier2b]:null, s2 = p.skill2&&TIER1[p.skill2.id]?TIER1[p.skill2.id]:null;
  let cls=`<div style="text-align:left;font-size:12px;margin:8px 0 0;padding:8px;background:var(--panel2);border-radius:10px">`;
  if(t1){ cls+=`${tr('鑱屼笟','Class')}銆?{L(t1.n)}銆?i style="color:#caa6e6">銆?{L(t1.quip)}銆?/i><br>`;   // 淇忕毊璇濈揣璺熻亴涓氬悕
    cls+=`${tr('涓诲姩','Active')}锛?{L(t1.skill.short)}锛?{t1.skill.noCd?tr('鏃犲喎鍗?,'no CD'):`${tr('姣?,'every')} ${effSkillCd(p.tier1)} ${tr('鍥炲悎','t')}`}锛?br>`;   // 鏈夋晥鍐峰嵈锛堝惈杩锋儜/鍥炴槬锛夛紝鏀朵拱鏃犲喎鍗?
    if(t1.passive) cls+=`銆€${tr('琚姩','Passive')}锛?{L(t1.passive)}<br>`; }
  else cls+=tr('鍑昏触绗?50 鍥炲悎 Boss 鈫?杞亴锛岃В閿佽亴涓氫富鍔ㄦ妧鑳?br>','Beat the turn-50 boss 鈫?advance to a class, unlock its active.<br>');
  if(t2) cls+=`${tr('浜岄樁鎶€鑳?,'Tier-2 Skill')}銆?{L(t2.n)}銆?{tr('琚姩','Passive')}锛?{L(t2.d)}<br>`;
  else cls+=tr('缁х画娣卞叆 鈫?瑙ｉ攣浜岄樁鎶€鑳斤紙琚姩锛?br>','Delve deeper 鈫?unlock a Tier-2 Skill (passive).<br>');
  if(t2b) cls+=`${tr('鏈棌鎶€鑳?,'Race Skill')}銆?{L(t2b.n)}銆?{tr('琚姩','Passive')}锛?{L(t2b.d)}<br>`;
  else cls+=tr('鏇存繁澶?鈫?鑾峰緱鏈棌鎶€鑳斤紙鍐嶄竴椤硅鍔級<br>','Deeper still 鈫?gain a Race Skill (another passive).<br>');
  if(s2) cls+=`${tr('璺ㄧ晫鎶€鑳?,'Crossover')}銆?{L(s2.skill.name)}銆戔啋 ${p.skill2.slot==='heal'?'馃拪':'馃挜'}锛?{tr('姣?,'every')} ${effSkillCd(p.skill2.id)} ${tr('鍥炲悎','t')}锛?{s2.quip?`<br><i style="color:#caa6e6">銆?{L(s2.quip)}銆?/i>`:''}`;
  else cls+=tr('娣辨笂灏藉ご 鈫?璺ㄧ晫鎶€鑳斤紙鎹换鎰忚亴涓氫富鍔級','At the abyss鈥檚 end 鈫?a Crossover Skill (swap in any class active).');
  cls+='</div>';
  const card=document.getElementById('card');
  card.innerHTML=`<h2>${rc?`${rc.e} ${L(rc.n)}`:tr('鍐掗櫓鑰?,'Adventurer')}</h2>
    ${rc?`<p>${L(rc.d)}</p>`:''}
    <div style="text-align:left;font-size:13px;margin:0 0 4px">${rows}</div>
    ${cls}${perkLine}
    <button class="btn" id="infoClose" style="width:100%;margin-top:12px">${tr('鍏抽棴','Close')}</button>`;
  document.getElementById('infoClose').onclick=()=>{ busy=false; hideOverlay(); updateHUD(); };
  showOverlay();
}
document.getElementById('hud').onclick=showPlayerInfo;

function showOverlay(){ document.getElementById('overlay').classList.add('show'); }
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }

//==================== HUD / 鏃ュ織 ====================
function bar(idBar,idTxt,cur,max,suffix){
  document.getElementById(idBar).style.width=Math.max(0,Math.min(100,cur/max*100))+'%';
  document.getElementById(idTxt).textContent=`${Math.max(0,Math.round(cur))} / ${max}`+(suffix||'');
}
function updateHUD(){
  document.getElementById('hud').classList.toggle('hoarding', !!(player && player.goldLock>0));
  bar('hpBar','hpTxt',player.hp,player.maxHp);
  document.getElementById('hpBar').style.background = isInfected() ? '#27ae60' : 'var(--hp)';  // 鍍靛案灏告瘨鎰熸煋锛氳鏉″彉缁?
  updateDanger();
  const an=armorNeeded(player.armor);
  document.getElementById('arBar').style.width=Math.min(100,player.shieldXp/an*100)+'%';
  document.getElementById('arTxt').textContent=
    `${tr('鍑忎激','DR')} ${player.armor}${player.toughness?`+${player.toughness}`:''}銆€${player.shieldXp}/${an}`;
  const need=xpNeeded(player.level);
  document.getElementById('xpBar').style.width=(player.xp/need*100)+'%';
  document.getElementById('xpTxt').textContent=`${player.xp} / ${need}`;
  document.getElementById('lvTxt').textContent=player.level;
  document.getElementById('goldTxt').textContent=player.gold;
  document.getElementById('turnTxt').textContent=player.turns;
  const b=[];
  if(player.race){ const rc=raceById(player.race); let id=`${rc.e}${L(rc.n)}`;
    if(player.tier1) id+=` 路 ${L(TIER1[player.tier1].n)}`;
    if(player.tier2) id+=` 路 ${L(TIER2[player.tier2].n)}`;
    b.push(id); }
  b.push(`${wE()}脳${player.weaponPower}${player.swordFlat?`+${player.swordFlat}`:''}`);
  b.push(player.noArmor?tr('鏃犵敳','No armor'):`馃敯${player.armorPerShield}`);
  b.push(`馃挆${player.healPerHeart}`);
  b.push(`馃挵${player.goldPerCoin}`);
  if(player.goldLock>0) b.push(tr(`馃敀鍥ら噾${player.goldLock}`,`馃敀${player.goldLock}`));
  if(player.deathCoil>0) b.push(tr(`馃煝缂犵粫${player.deathCoil}`,`馃煝Coil ${player.deathCoil}`));
  if(player.lifesteal)b.push(tr(`鍚歌 ${player.lifesteal}`,`Lifesteal ${player.lifesteal}`));
  if(player.regen)b.push(tr(`鎭㈠ ${player.regen}`,`Regen ${player.regen}`));
  document.getElementById('bonusTxt').textContent=b.join('銆€');
  const scd=(player.shopCd&&typeof player.shopCd==='object')?player.shopCd:{};
  document.querySelectorAll('.shopBtn[data-buy]').forEach(btn=>{
    const key=btn.dataset.buy;
    if(player.skill2 && player.skill2.slot===key && TIER1[player.skill2.id]){   // 璇ユЫ宸叉崲鎴愭崲瑁呬富鍔?
      const sk=TIER1[player.skill2.id].skill;
      btn.querySelector('span').textContent=`鉁?{L(sk.name)}`;
      btn.querySelector('small').textContent=L(sk.short);
      const fz2=player.frozen&&player.frozen[key]>0;
      btn.querySelector('em').textContent = fz2 ? `鉂勶笍${player.frozen[key]}${tr('鍥炲悎','t')}` : player.skill2Cd>0 ? `鈴?{player.skill2Cd}${tr('鍥炲悎','t')}` : tr('鍙彂鍔?,'Ready');
      btn.classList.toggle('off', busy || pendingLevels || player.skill2Cd>0 || fz2);
      return;
    }
    const c=shopCost(key), cd=scd[key]||0, fz=player.frozen&&player.frozen[key]>0;   // 闆汉鍐板皝璇ユЫ
    if(key==='heal'){ const hv=Math.round((10+2*(player.healUses||0))*(player.healMult||1)); btn.querySelector('small').textContent=tr(`鍥炲 ${hv} 鐢熷懡`,`Restore ${hv} HP`); }   // 娌荤枟鎭㈠閲忛殢娆℃暟閫掑锛堟椿姝讳汉鎸?healMult 鎶樼畻锛?
    if(key==='bomb'){ const extra=bombGoldSacrificeBonus(player), D=bombDamage(player)+extra; btn.querySelector('small').textContent=tr(`鍏ㄥ満鎬?-${D} 琛€`+(extra?`锛堜咕鍧や竴鎺?+${extra}锛塦:''),`All foes -${D} HP`+(extra?` (All-In +${extra})`:'')); }   // 鐐稿脊浼ゅ闅忕垎鐮存墜/涔惧潳涓€鎺峰姩鎬佹樉绀?
    const full = key==='heal' && player.hp>=player.maxHp;   // 婊¤鏃舵不鐤楃鐢?
    btn.querySelector('em').textContent = fz ? `鉂勶笍${player.frozen[key]}${tr('鍥炲悎','t')}` : cd>0 ? `鈴?{cd}${tr('鍥炲悎','t')}` : full ? tr('宸叉弧琛€','Full HP') : c+'馃挵';
    btn.classList.toggle('off', busy || pendingLevels || cd>0 || player.goldLock>0 || player.gold < c || fz || full); });
  const sb=document.getElementById('skillBtn'), sk=player.tier1&&TIER1[player.tier1]&&TIER1[player.tier1].skill;
  if(sk){ sb.style.display='flex';
    sb.querySelector('span').textContent=`鉁?{L(sk.name)}`;
    sb.querySelector('small').textContent=L(sk.short);
    const hoarding = player.tier1==='miser' && player.goldLock>0;   // 鍥ら噾鏈熼棿鎶€鑳芥棤娉曞啀鍙戝姩锛屾寜閿佸畾鏄剧ず
    const fzs=player.frozen&&player.frozen.skill>0;   // 闆汉鍐板皝涓€闃朵富鍔?
    const isBuyout = player.tier1==='guildmaster';
    const buyCost = isBuyout ? (player.cheapskate?Math.ceil(enemyHpSum()/2):enemyHpSum()) : 0;   // 鏀朵拱鑺辫垂 = 鍏ㄦ€閲忥紙灏忔皵楝煎噺鍗婏級
    const cantAfford = isBuyout && (buyCost<=0 || player.gold<buyCost);   // 娌℃€垨閽变笉澶?鈫?缃伆
    sb.querySelector('em').textContent = fzs ? `鉂勶笍${player.frozen.skill}${tr('鍥炲悎','t')}`
      : hoarding ? `馃敀${player.goldLock}${tr('鍥炲悎','t')}`
      : player.skillCd>0 ? `鈴?{player.skillCd}${tr('鍥炲悎','t')}`
      : isBuyout ? `馃挵${buyCost}`                                         // 鏀朵拱锛氭樉绀哄綋鍓嶈姳璐癸紙鍏ㄦ€閲忥級锛岄挶涓嶅鏃舵寜閽疆鐏?
      : tr('鍙彂鍔?,'Ready');
    sb.classList.toggle('off', busy || pendingLevels || player.skillCd>0 || hoarding || fzs || cantAfford);
  } else { sb.style.display='none'; }
  saveGame();
}
// 浣庤鏃跺睆骞曡竟缂樺彉绾細琛€瓒婂皯瓒婄孩锛屽嵄鎬ユ椂鍛煎惛闂儊
const vignetteEl=document.getElementById('vignette');
function updateDanger(){
  const ratio=Math.max(0,player.hp)/player.maxHp;
  // 鐢熷懡 >50% 涓嶆樉绀猴紱50%鈫?% 涔嬮棿锛岀孩鑹蹭粠鏃犲埌鏈€娴?
  const t=Math.max(0,(0.5-ratio)/0.5);          // 0 ~ 1
  vignetteEl.style.opacity=(t*0.85).toFixed(3);  // 鏈€娴?0.85
  const danger = ratio>0 && ratio<=0.2;
  vignetteEl.classList.toggle('pulse', danger); // 鍗辨€ュ懠鍚搁棯鐑?
  document.getElementById('hpBar').classList.toggle('low', danger); // 鐢熷懡鏉″悓姝ラ棯鐑?
}
const logEl=document.getElementById('log'); let logHistory=[];
// 鏃ュ織鎸変簨浠剁被鍨嬩笂鑹诧細鍥炶=缁?/ 澧炵泭=钃?/ 鏀诲嚮鏁屼汉=鐧?榛樿) / 琚敾鍑宦稡oss鍑哄満=绾?/ 璐熼潰鏁堟灉=榛?
function logColor(e){ const k=e&&e.k; return k==='bad'?'#ff5252':k==='heal'?'#2ecc71':k==='buff'?'#4aa3ff':k==='debuff'?'#f1c40f':'var(--txt)'; }
function log(m, k){
  logHistory.push({m, k}); if(logHistory.length>80)logHistory.shift();   // 瀹屾暣鍘嗗彶鍚被鍨嬫爣璁帮紙鐐?log 鏍忔煡鐪嬫洿澶氾級
  logEl.innerHTML=logHistory.slice(-2).map(e=>`<span style="color:${logColor(e)}">${e.m}</span>`).join('<br>'); }
function logClear(){ logHistory=[]; logEl.innerHTML=''; }
// 鐐?log 鏍?鈫?寮瑰嚭瀹屾暣鏃ュ織鍘嗗彶锛堟渶鏂板湪涓婏級銆傜函 UI锛屼笉杩涘綍鍍忋€?
function showLogHistory(){
  if(busy||pendingLevels||!logHistory.length) return;
  busy=true;
  const rows=logHistory.slice().reverse().map(e=>{ const m=(e&&e.m!==undefined)?e.m:e;   // 鍏煎鏃ф牸寮忥紙瀛楃涓诧級
    return `<div style="padding:5px 2px;border-bottom:1px solid #3a2d4d;font-size:12px;text-align:left;color:${logColor(e)}">${m}</div>`; }).join('');
  const card=document.getElementById('card');
  card.innerHTML=`<h2>馃摐 ${tr('鏃ュ織','Log')}</h2>
    <div style="max-height:58vh;overflow-y:auto;margin:0 0 12px">${rows}</div>
    <button class="btn" id="logClose" style="width:100%">${tr('鍏抽棴','Close')}</button>`;
  document.getElementById('logClose').onclick=()=>{ busy=false; hideOverlay(); };
  showOverlay();
}
if(logEl) logEl.onclick=showLogHistory;
// 鐐圭増鏈彿 鈫?灞曠ず宓屽叆椤甸潰鐨勬洿鏂版棩蹇楁憳瑕侊紙CHANGELOG_LINES锛屾棤闇€鑱旂綉锛涚敱 dr.sh 浠?CHANGELOG.md 娉ㄥ叆锛?
function showChangelog(){
  if(busy||pendingLevels) return;
  busy=true;
  const lines=(typeof CHANGELOG_LINES!=='undefined'?CHANGELOG_LINES:[]);
  const body = lines.length
    ? `<div style="max-height:58vh;overflow-y:auto;margin:0 0 12px">${lines.map(e=>{
        const txt = lang==='en' ? (e.en||e.zh||'') : (e.zh||e.en||'');
        return `<div style="padding:5px 2px;border-bottom:1px solid #3a2d4d;font-size:12px;text-align:left"><b style="color:var(--gold)">${e.ver||''}</b> ${txt}</div>`;
      }).join('')}</div>`
    : `<p style="font-size:13px">${tr('鐪嬪畬鏁存棩蹇楋細','Full log:')} <a href="https://github.com/lcgogo/dungeon-raid/blob/main/CHANGELOG.md" target="_blank" style="color:var(--gold)">CHANGELOG</a></p>`;
  const card=document.getElementById('card');
  card.innerHTML=`<h2>馃摑 ${tr('鏇存柊鏃ュ織','Changelog')}</h2>${body}<button class="btn" id="clClose" style="width:100%">${tr('鍏抽棴','Close')}</button>`;
  document.getElementById('clClose').onclick=()=>{ busy=false; hideOverlay(); };
  showOverlay();
}
