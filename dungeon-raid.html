<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>地牢突袭 · Dungeon Raid</title>
<style>
  :root{
    --bg:#1a1423; --panel:#241b30; --panel2:#2f2440;
    --gold:#f1c40f; --txt:#ece3f5; --dim:#9a8bb0;
    --hp:#e74c3c; --armor:#3498db; --xp:#2ecc71;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:radial-gradient(circle at 50% 0%, #2a1f3a, var(--bg));
    color:var(--txt); font-family:-apple-system,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    user-select:none; -webkit-user-select:none; padding:4px 6px 8px;
  }
  h1{font-size:17px; margin:2px 0 1px; letter-spacing:1px;}
  h1 .sub{font-size:11px; color:var(--dim); letter-spacing:1px;}
  #wrap{width:100%; max-width:440px; position:relative;}
  #langBtn{position:fixed; top:8px; right:10px; z-index:20; background:var(--panel2); color:var(--dim);
           border:1px solid #3a2d4d; border-radius:8px; font-size:11px; padding:3px 9px; cursor:pointer;}
  #langBtn:hover{border-color:var(--gold); color:var(--txt);}

  /* HUD */
  #hud{background:var(--panel); border:1px solid #3a2d4d; border-radius:12px; padding:6px 10px; margin-bottom:6px; cursor:pointer;}
  #hud:hover{border-color:#5a4a73;}
  .bar{height:13px; border-radius:7px; background:#15101e; overflow:hidden; position:relative;}
  .bar > i{display:block; height:100%; transition:width .25s; }
  .bar > span{position:absolute; inset:0; font-size:10px; text-align:center; line-height:13px; color:#fff; text-shadow:0 1px 2px #000;}
  .row{display:flex; align-items:center; gap:6px; margin:3px 0;}
  .row .lbl{width:54px; font-size:11px; color:var(--dim);}
  .stats{display:flex; justify-content:space-between; margin-top:5px; font-size:12px;}
  .stats b{color:var(--gold);}
  .mini{font-size:10px; color:var(--dim); margin-top:4px; line-height:1.4;}

  /* board */
  #board{display:block; width:100%; touch-action:none; border-radius:12px;
         background:var(--panel2); border:1px solid #3a2d4d;}
  #log{font-size:11px; color:var(--dim); height:24px; overflow:hidden; margin:5px 4px; line-height:1.4;}

  /* shop */
  #shop{display:flex; gap:6px; margin:6px 0 0;}
  .shopBtn{flex:1; background:var(--panel2); border:1px solid #3a2d4d; border-radius:10px;
           color:var(--txt); padding:6px 3px; cursor:pointer; display:flex; flex-direction:column;
           align-items:center; gap:1px; font-size:12px; transition:.15s;}
  .shopBtn em{font-style:normal; font-size:11px; color:var(--gold);}
  .shopBtn small{font-size:10px; color:var(--dim); line-height:1.2;}
  .shopBtn:disabled{opacity:.38; cursor:not-allowed;}
  .shopBtn:not(:disabled):hover{border-color:var(--gold); transform:translateY(-1px);}

  /* 职业主动技能按钮：复用 shopBtn 布局，仅换配色 */
  .shopBtn.skillBtn{background:linear-gradient(160deg,#5a2e85,#7d3cad); border-color:#c08bff; color:#fff; font-weight:700;}
  .shopBtn.skillBtn em{color:#e7c9ff;}
  .shopBtn.skillBtn:not(:disabled):hover{border-color:#e6c2ff;}

  /* overlay */
  #overlay{position:fixed; inset:0; background:rgba(10,6,18,.82); backdrop-filter:blur(3px);
           display:none; align-items:center; justify-content:center; z-index:10;}
  #overlay.show{display:flex;}
  .card{background:var(--panel); border:1px solid #4a3a63; border-radius:16px; padding:20px;
        width:90%; max-width:380px; text-align:center; box-shadow:0 10px 40px #000;}
  .card h2{margin:0 0 4px; color:var(--gold);}
  .card p{color:var(--dim); font-size:13px; margin:0 0 14px;}
  .choice{display:block; width:100%; text-align:left; background:var(--panel2);
          border:1px solid #4a3a63; color:var(--txt); border-radius:12px; padding:12px 14px;
          margin:8px 0; cursor:pointer; transition:.15s; font-size:14px;}
  .choice:hover{background:#3a2d50; border-color:var(--gold); transform:translateY(-1px);}
  .choice b{display:block; font-size:15px; margin-bottom:2px;}
  .choice small{color:var(--dim);}
  .btn{background:var(--gold); color:#2a1f10; font-weight:700; border:none; border-radius:12px;
       padding:12px 20px; font-size:15px; cursor:pointer; margin-top:8px;}
  .footer{font-size:10px; color:var(--dim); text-align:center; margin-top:7px; line-height:1.4;}

  /* 低血危险渐晕 */
  #vignette{position:fixed; inset:0; pointer-events:none; z-index:5; opacity:0;
            transition:opacity .35s;
            background:radial-gradient(circle at 50% 50%, transparent 35%, #e74c3c 130%);}
  #vignette.pulse{animation:dangerPulse 1.1s ease-in-out infinite;}
  @keyframes dangerPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.6);}}
  /* 低血时生命条闪烁 */
  #hpBar.low{animation:hpBlink 1.1s ease-in-out infinite;}
  @keyframes hpBlink{0%,100%{filter:brightness(1);opacity:1;}50%{filter:brightness(1.7);opacity:.55;}}
</style>
</head>
<body>
<div id="wrap">
  <button id="langBtn">EN</button>
  <h1 id="title">🔪 地牢突袭 <span class="sub">Dungeon Raid</span></h1>

  <div id="hud">
    <div class="row"><span class="lbl" id="lblHp">生命</span>
      <div class="bar" style="flex:1"><i id="hpBar" style="background:var(--hp)"></i><span id="hpTxt"></span></div>
    </div>
    <div class="row"><span class="lbl" id="lblAr">护甲</span>
      <div class="bar" style="flex:1"><i id="arBar" style="background:var(--armor)"></i><span id="arTxt"></span></div>
    </div>
    <div class="row"><span class="lbl" id="lblXp">等级经验</span>
      <div class="bar" style="flex:1"><i id="xpBar" style="background:var(--xp)"></i><span id="xpTxt"></span></div>
    </div>
    <div class="stats">
      <span><span id="lblLv">等级</span> <b id="lvTxt">1</b></span>
      <span>💰 <b id="goldTxt">0</b></span>
      <span><span id="lblTurn">回合</span> <b id="turnTxt">0</b></span>
    </div>
    <div class="mini" id="bonusTxt"></div>
    <div id="hudHint" style="text-align:right; font-size:10px; color:var(--gold); margin-top:2px;">ⓘ 点击查看属性 / 职业详情</div>
  </div>

  <canvas id="board"></canvas>

  <div id="shop">
    <button id="skillBtn" class="shopBtn skillBtn" style="display:none"><span></span><small></small><em></em></button>
    <button class="shopBtn" data-buy="heal"><span id="shHealName">💊 治疗</span><small id="shHealDesc">回复10生命</small><em></em></button>
    <button class="shopBtn" data-buy="bomb"><span id="shBombName">💥 炸弹</span><small id="shBombDesc">全场怪-6血</small><em></em></button>
  </div>

  <div id="log"></div>
  <div class="footer" id="footer">
    拖动连接 <b>2+</b> 相邻同类消除（横竖斜）；🔪剑链可穿过 👹 点杀，连得越多收益越高。<br>
    💡 <b>轻点任意方块</b>查看玩法说明与当前数值。
  </div>
</div>

<div id="vignette"></div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
(()=>{
//==================== 配置 ====================
const COLS=6, ROWS=6, PAD=8;
let TILE=70;                       // 实际按画布宽度自适应
// 显式 emoji 字体栈：让 canvas 测量宽度与彩色 emoji 实际渲染一致（移动端居中更稳）
// 注：心/盾已改用原生彩色 emoji 💗/🔰（不带 FE0F 变体符），避免老符号在 canvas 里居中偏移
const EMOJI_FONT="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
const DEF = {
  sword:  {emoji:'🔪', color:'#e74c3c', glow:'#ff7a6b', name:'剑'},
  shield: {emoji:'🔰', color:'#3498db', glow:'#6fb6ff', name:'盾'},
  heart:  {emoji:'💗', color:'#e84393', glow:'#ff85c0', name:'心'},
  coin:   {emoji:'💰', color:'#f1c40f', glow:'#ffe07a', name:'金'},
  enemy:  {emoji:'👹', color:'#7d3cad', glow:'#c08bff', name:'怪'},
  boss:   {emoji:'👻', color:'#1f6f5c', glow:'#7fffd4', name:'Boss'},
};
const CONNECTABLE=['sword','shield','heart','coin'];

//==================== 多语言 ====================
let lang = (()=>{ try{
    const saved=localStorage.getItem('dr_lang');
    if(saved==='en'||saved==='zh') return saved;          // 用过就记住选择
    const nav=((navigator.language||navigator.userLanguage||'')+'').toLowerCase();
    return nav.indexOf('zh')===0 ? 'zh' : 'en';            // 首次访问跟随浏览器语言
  }catch(e){ return 'zh'; } })();
const tr = (zh,en)=> lang==='en' ? en : zh;            // 行内双语：渲染时取值
const L  = (x)=> Array.isArray(x) ? tr(x[0],x[1]) : x; // 数据字段：[中文, English]
function setLang(l){
  lang = l==='en'?'en':'zh';
  try{ localStorage.setItem('dr_lang',lang); }catch(e){}
  const lb=document.getElementById('langBtn'); if(lb) lb.textContent = lang==='en'?'中文':'EN';
  applyStaticLang();
  if(player) updateHUD();
  // 选职业界面正开着 → 用新语言重绘
  if(!grid && document.getElementById('overlay').classList.contains('show')) showClassSelect();
}
// 更新 HTML 里的静态文字（标签/底部说明/商店按钮基础文案）
function applyStaticLang(){
  const set=(id,txt)=>{ const el=document.getElementById(id); if(el) el.textContent=txt; };
  if(document.documentElement) document.documentElement.lang = lang==='en'?'en':'zh-CN';
  const tt=document.getElementById('title');
  if(tt) tt.innerHTML = tr('🔪 地牢突袭 <span class="sub">Dungeon Raid</span>','🔪 Dungeon Raid');
  set('lblHp', tr('生命','HP'));
  set('lblAr', tr('护甲','Armor'));
  set('lblXp', tr('等级经验','Level XP'));
  set('lblLv', tr('等级','Lv'));
  set('lblTurn', tr('回合','Turn'));
  set('hudHint', tr('ⓘ 点击查看属性 / 职业详情','ⓘ Tap for stats / class details'));
  set('shHealName', tr('💊 治疗','💊 Heal'));
  set('shHealDesc', tr('回复10生命','Restore 10 HP'));
  set('shBombName', tr('💥 炸弹','💥 Bomb'));
  set('shBombDesc', tr('全场怪-6血','All foes -6 HP'));
  const ft=document.getElementById('footer');
  if(ft) ft.innerHTML = tr(
    '拖动连接 <b>2+</b> 相邻同类消除（横竖斜）；🔪剑链可穿过 👹 点杀，连得越多收益越高。<br>💡 <b>轻点任意方块</b>查看玩法说明与当前数值。',
    'Drag to link <b>2+</b> adjacent same tiles (incl. diagonals); 🔪 sword chains pass through 👹 to kill — longer chains pay more.<br>💡 <b>Tap any tile</b> for how it works and current values.');
}

//==================== 状态 ====================
let grid, player, selection, dragging, anim, busy=false, pendingLevels=0;

function newPlayer(){
  return {hp:20,maxHp:20, armor:0, shieldXp:0, toughness:0, shopCd:{}, skillCd:0, dmgBy:{}, gold:0, xp:0, level:1,
    weaponPower:1, swordFlat:0, armorPerShield:1, healPerHeart:1, goldPerCoin:1,
    lifesteal:0, regen:0, coinXp:0, turns:0};
}
function xpNeeded(lv){ return 10 + lv*6; }
function armorNeeded(a){ return 3 + a*3; }   // 护甲像经验一样累积：每升 1 点护甲所需的盾进度递增（越往后越贵）

function enemyStats(){
  const lv=player.level;
  return {
    hp: 3 + Math.floor(Math.random()*3) + Math.floor(lv*0.85),  // lv1≈3~5, lv10≈11~13, lv20≈20~22
    atk: 3 + Math.floor(lv*1.0),                                // lv1=4, lv5=8, lv10=13, lv20=23
    baseCd: 2 + Math.floor(Math.random()*2),                    // 2~3（出手很勤）
  };
}
function enemyChance(){ return Math.min(0.34, 0.12 + player.level*0.016); }

// ===== Boss 池：每 10 回合从中随机挑一个现身。剑链免疫，只能用炸弹炸，奖励丰厚 =====
const BOSSES=[
  { id:'ghost', emoji:'👻', name:['幽灵','Ghost'],
    desc:['剑链对它无效，只能用 💥炸弹 炸（每次 −6 血）。倒计时归零会对你重击！','Immune to sword chains — only the 💥 Bomb hurts it (−6 each). It strikes you hard at 0!'] },
  { id:'clown', emoji:'🤡', name:['小丑','Clown'], perTurn:true,
    special:['每回合打乱 3 个棋子','Scrambles 3 tiles each turn'],
    desc:['剑链对它无效，只能用 💥炸弹 炸。它【每回合】都会随机打乱棋盘上 3 个棋子，制造持续混乱！','Immune to sword chains — only the 💥 Bomb works. Every turn it scrambles 3 random tiles, causing constant chaos!'],
    act(){ const k=scrambleTiles(3); log(tr(`🤡 小丑捣乱，打乱了 ${k} 个棋子！`,`🤡 The Clown scrambles ${k} tiles!`)); } },
  { id:'vampire', emoji:'🧛', name:['吸血鬼','Vampire'], perTurn:true, swordable:true,
    special:['每回合吸取场上的 ❤️ 回血','Drains ❤️ each turn to heal'],
    desc:['可以用剑攻击它（也能用炸弹）。但它【每回合】会吸取棋盘上所有的心来回血——别把心留在场上！','You CAN hit it with sword chains (and bombs). But every turn it drains all hearts on the board to heal — do not leave hearts on the board!'],
    act(t){ let n=0; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const x=grid[r][c]; if(x&&x.type==='heart'){ grid[r][c]=null; n++; } }
      if(n){ t.hp=Math.min(t.maxHp, t.hp+n*3); applyGravity(); syncPositions(false);
        log(tr(`🧛 吸血鬼吸取 ${n} 颗心回血（→${t.hp}）`,`🧛 Vampire drains ${n} hearts (→${t.hp})`)); } } },
  { id:'assassin', emoji:'🥷', name:['刺客','Assassin'], monster:true, swordable:true, trueDmg:true,
    desc:['属性和普通怪差不多，但它的攻击是【真实伤害】——无视护甲和额外减伤，直接掉血！可以用剑砍它，趁早解决。','Stats like a normal enemy, but its hits are TRUE damage — they ignore armor and any reduction, straight to your HP! You can sword it down, so kill it fast.'] },
  { id:'devourer', emoji:'🦖', name:['饕餮','Devourer'], monster:true, swordable:true,
    special:['吞噬怪物壮大，倒计时放大招','Devours to grow; nukes at 0'],
    desc:['每回合吸取场上每个怪一半的生命来壮大自己；倒计时归零时，释放等于它当前血量 50% 的强力一击！趁它还小赶紧用剑砍掉。','Each turn it drains half the HP from every enemy to grow; at 0 it unleashes a hit worth 50% of its current HP! Sword it down while it is still small.'],
    everyTurn(t){ const cap=12+player.level*3; if(t.hp>=cap) return;   // 自身血量封顶，防止无限爆涨
      let g=0; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const x=grid[r][c]; if(x&&x.type==='enemy'&&x.hp>1){ const take=Math.floor(x.hp/2); x.hp-=take; g+=take; } }
      if(g){ t.hp=Math.min(cap, t.hp+g); t.maxHp=Math.max(t.maxHp,t.hp); log(tr(`🦖 饕餮吞噬怪物生命 +${g}（→${t.hp}）`,`🦖 Devourer absorbs +${g} HP (→${t.hp})`)); } },
    cdAttack(t){ const raw=Math.floor(t.hp*0.5);
      const dmg=Math.max(1, raw - player.armor - (player.toughness||0));
      player.hp-=dmg; t.hp=Math.max(1, t.hp-raw); addDmg('devourer', dmg);   // 放大招消耗自身一半生命，需重新吃
      log(tr(`🦖 饕餮释放积蓄之力，造成 ${dmg} 伤害（自损至 ${t.hp}）！`,`🦖 Devourer unleashes ${dmg} damage (drops to ${t.hp})!`)); } },
  { id:'summoner', emoji:'🧙', name:['召唤师','Summoner'], monster:true, swordable:true, perTurn:true,
    special:['每回合召唤一只怪','Summons an enemy each turn'],
    desc:['属性和普通怪一样，可被剑砍。它【每回合】把场上一个非怪/非Boss的棋子变成一只怪——拖得越久怪越多，速战速决！','Stats like a normal enemy and sword-attackable. Every turn it turns one non-enemy tile into an enemy — the longer it lives, the more enemies. End it fast!'],
    act(){ const cells=[]; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const x=grid[r][c]; if(x&&x.type!=='enemy'&&x.type!=='boss') cells.push([r,c]); }
      if(!cells.length) return; const [r,c]=cells[Math.floor(Math.random()*cells.length)];
      const e=makeTile('enemy'); e.curY=cellY(r); grid[r][c]=e; syncPositions(false);
      log(tr('🧙 召唤师召唤出一只怪！','🧙 The Summoner conjures an enemy!')); } },
];
function bossDef(t){ return BOSSES.find(b=>b.id===(t&&t.bossId)) || BOSSES[0]; }
function isSwordTarget(t){ return !!t && (t.type==='enemy' || (t.type==='boss' && bossDef(t).swordable)); }
// 死亡报告：累计各来源对玩家造成的伤害
function addDmg(key,amt){ if(player){ player.dmgBy=player.dmgBy||{}; player.dmgBy[key]=(player.dmgBy[key]||0)+amt; } }
function dmgSourceLabel(key){
  if(key==='enemy') return {emoji:'👹', name:['普通怪','Enemy']};
  const b=BOSSES.find(x=>x.id===key);
  return b?{emoji:b.emoji, name:b.name}:{emoji:'❓', name:['未知','Unknown']};
}
function bossStats(){
  const lv=player.level;
  return { hp: 8 + Math.floor(lv*1.0), atk: 5 + Math.floor(lv*1.2), cd: 6 + Math.floor(Math.random()*3) }; // cd 6~8
}
function hasBoss(){ for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(grid[r][c]&&grid[r][c].type==='boss') return true; return false; }
// 随机把 n 个非 Boss 棋子换成新的随机棋子
function scrambleTiles(n){
  const cells=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(t && t.type!=='boss') cells.push([r,c]); }
  for(let i=cells.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cells[i],cells[j]]=[cells[j],cells[i]]; }
  const k=Math.min(n,cells.length);
  for(let i=0;i<k;i++){ const [r,c]=cells[i]; const nt=makeTile(); nt.curY=cellY(r); grid[r][c]=nt; }
  syncPositions(false);
  return k;
}
function spawnBoss(){
  if(hasBoss()) return;                       // 同时只存在一个 Boss
  const cells=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(grid[r][c]) cells.push([r,c]);
  if(!cells.length) return;
  const [r,c]=cells[Math.floor(Math.random()*cells.length)];
  const def=BOSSES[Math.floor(Math.random()*BOSSES.length)];
  const s = def.monster ? enemyStats() : bossStats();   // 怪属性型 Boss 用怪物数值
  const cdv = (s.cd!=null ? s.cd : s.baseCd);
  grid[r][c]={type:'boss', bossId:def.id, hp:s.hp, maxHp:s.hp, atk:s.atk, cd:cdv, baseCd:cdv};
  log(tr(`${def.emoji} Boss【${L(def.name)}】现身！剑链无效，用 💥炸弹 炸它，击败有厚赏！`,`${def.emoji} Boss [${L(def.name)}] appears! Sword-proof — use the 💥 Bomb. Big reward for the kill!`));
}

function makeTile(type){
  if(type===undefined){
    type = Math.random()<enemyChance() ? 'enemy'
         : CONNECTABLE[Math.floor(Math.random()*CONNECTABLE.length)];
  }
  const t={type};
  if(type==='enemy'){ const s=enemyStats(); t.hp=s.hp; t.maxHp=s.hp; t.atk=s.atk; t.cd=s.baseCd; t.baseCd=s.baseCd; }
  return t;
}

//==================== 职业 ====================
const CLASSES=[
  {n:['骑士','Knight'],     e:'🔰', d:['【铁壁】怪物伤害额外 −1（最低仍为1），开局 +3 护甲','[Bulwark] Enemy damage −1 extra (min 1); start with +3 armor'], f:p=>{p.armor+=3; p.toughness+=1;},
    skill:{name:['锻甲','Forge Armor'], short:['收集全盘护甲','Absorb all shields'], cd:5, f:p=>{
      let n=0; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(t&&t.type==='shield'){ grid[r][c]=null; n++; } }
      if(!n) return false;                         // 场上没护甲 → 不发动、不进冷却
      p.shieldXp += n*p.armorPerShield;
      while(p.shieldXp>=armorNeeded(p.armor)){ p.shieldXp-=armorNeeded(p.armor); p.armor++; }
      applyGravity(); syncPositions(false);
      log(tr(`🔰 锻甲：吞下 ${n} 个护甲（减伤 ${p.armor}）`,`🔰 Forge: absorbed ${n} shields (armor ${p.armor})`));
      return n;   // 已自带日志
    }}},
  {n:['狂战士','Berserker'], e:'🔪', d:['【血怒】生命低于50%时剑伤+50%，但最大生命-4','[Bloodlust] +50% sword damage when below 50% HP, but −4 max HP'], f:p=>{p.maxHp-=4; p.berserk=true;},
    skill:{name:['狂怒','Rage'], short:['生命减半','Halve HP'], cd:5, f:p=>{p.hp=Math.max(1,Math.floor(p.hp/2));}}},
  {n:['盗贼','Rogue'],       e:'💰', d:['【掠夺】用剑每击杀一只怪，额外获得 1 金币','[Plunder] +1 extra gold for each enemy your sword kills'], f:p=>{p.steal=true;},
    skill:{name:['点金','Gold Touch'], short:['剑变金币','Swords→Coins'], cd:5, f:p=>{ for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=grid[r][c]; if(t&&t.type==='sword') t.type='coin';} }}},
  {n:['牧师','Priest'],      e:'💗', d:['【回春】每颗心多回 +1 生命，且生命越低回血越多','[Renewal] Hearts heal +1 each, and heal more the lower your HP'], f:p=>{p.healPerHeart+=1; p.revive=true;},
    skill:{name:['祈福','Blessing'], short:['上限+6回满','+6 Max HP, full heal'], cd:5, f:p=>{p.maxHp+=6; p.hp+=6;}}},
];
function showClassSelect(){
  busy=true;
  const card=document.getElementById('card');
  const best=getBest();
  const bestLine = best ? `<p>${tr('🏆 最佳纪录：等级','🏆 Best: Level')} ${best.level} · 💰${best.gold}</p>` : '';
  card.innerHTML=`<h2>${tr('选择你的职业','Choose your class')}</h2>${bestLine}<p>${tr('不同职业有不同的起手强化与玩法','Each class has its own start bonus and playstyle')}</p>`;
  if(hasSave()){
    const cont=document.createElement('button'); cont.className='btn';
    cont.style.width='100%'; cont.style.marginBottom='12px';
    cont.textContent=tr('▶ 继续上局','▶ Continue last run');
    cont.onclick=()=>loadGame();
    card.appendChild(cont);
  }
  CLASSES.forEach(cls=>{
    const b=document.createElement('button'); b.className='choice';
    b.innerHTML=`<b>${cls.e} ${L(cls.n)}</b><small>${L(cls.d)}<br>${tr('✨主动技能','✨ Active skill')}【${L(cls.skill.name)}】：${L(cls.skill.short)}（${tr('每','every')} ${cls.skill.cd} ${tr('回合','turns')}）</small>`;
    b.onclick=()=>startGame(cls);
    card.appendChild(b);
  });
  showOverlay();
}

//==================== 初始化 ====================
function startGame(cls){
  player=newPlayer(); cls.f(player); player.hp=player.maxHp; player.cls=cls;
  selection=[]; dragging=false; busy=false; pendingLevels=0;
  grid=[];
  for(let r=0;r<ROWS;r++){ grid[r]=[]; for(let c=0;c<COLS;c++){
    // 开局怪物少一点
    let type = Math.random()<0.08 ? 'enemy'
             : CONNECTABLE[Math.floor(Math.random()*CONNECTABLE.length)];
    grid[r][c]=makeTile(type);
  }}
  syncPositions(true);
  hideOverlay(); logClear();
  log(tr(`【${cls.e}${L(cls.n)}】踏入地牢… 祝你好运！`, `${cls.e}${L(cls.n)} enters the dungeon… good luck!`));
  updateHUD();
}

//==================== 本地存档 ====================
const SAVE_KEY='dr_save', BEST_KEY='dr_best';
function saveGame(){
  if(!grid||!player) return;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      pendingLevels,
      player:{...player, cls: player.cls? player.cls.n[0] : null},
      grid: grid.map(row=>row.map(t=> t?{type:t.type,hp:t.hp,maxHp:t.maxHp,atk:t.atk,cd:t.cd,baseCd:t.baseCd,bossId:t.bossId}:null)),
    }));
  }catch(e){}
}
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadGame(){
  try{
    const data=JSON.parse(localStorage.getItem(SAVE_KEY)); if(!data) return false;
    player=data.player;
    player.cls = data.player.cls ? CLASSES.find(c=>c.n[0]===data.player.cls) : null;
    pendingLevels=data.pendingLevels||0;
    grid=data.grid.map(row=>row.map(t=> t?{...t}:null));
    selection=[]; dragging=false; busy=false;
    syncPositions(true); hideOverlay(); logClear();
    log(tr('继续上次的探险…','Continuing your last run…'));
    updateHUD();
    if(pendingLevels) showLevelUp();
    return true;
  }catch(e){ return false; }
}
function getBest(){ try{ return JSON.parse(localStorage.getItem(BEST_KEY)||'null'); }catch(e){ return null; } }
function saveBest(){
  try{ const b=getBest()||{level:0,gold:0};
    if(player.level>b.level || (player.level===b.level && player.gold>b.gold))
      localStorage.setItem(BEST_KEY, JSON.stringify({level:player.level,gold:player.gold}));
  }catch(e){}
}

//==================== 坐标/动画 ====================
function cellX(c){ return PAD + c*TILE; }
function cellY(r){ return PAD + r*TILE; }

function syncPositions(snap){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=grid[r][c]; if(!t) continue;
    t.r=r; t.c=c;
    if(snap || t.curY===undefined) t.curY=cellY(r);
  }
}

//==================== 渲染 ====================
const cv=document.getElementById('board'), ctx=cv.getContext('2d');
function resize(){
  const w=document.getElementById('wrap').clientWidth;
  const size=Math.min(w, 440);
  TILE=Math.floor((size-2*PAD)/COLS);
  const px=COLS*TILE+2*PAD;
  cv.width=px; cv.height=ROWS*TILE+2*PAD;
  cv.style.width=px+'px'; cv.style.height=cv.height+'px';
  if(grid) syncPositions(true);
}
window.addEventListener('resize',resize);

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// 预览：当前剑链会杀死哪些怪（与 dealDamage 逻辑保持一致）
function previewKills(){
  // 剑链且已构成可消除的连线（长度≥2，怪起手时怪自身也占一格）
  if(!dragging || selection.length<2 || selection[0].type!=='sword') return null;
  const targets=selection.filter(s=>isSwordTarget(grid[s.r][s.c]));
  if(!targets.length) return null; // 没串到怪 → 不造成伤害，无击杀预览
  const nS=selection.filter(s=>{const t=grid[s.r][s.c]; return t&&t.type==='sword';}).length;
  const combo=1+Math.max(0,nS-2)*0.15;
  let pool=(nS*player.weaponPower+player.swordFlat)*combo;
  if(player.berserk && player.hp < player.maxHp*0.5) pool*=1.5;
  pool=Math.floor(pool);
  // 与结算一致：每只怪独立吃满 pool，pool≥血量即死
  const dead=new Set();
  targets.forEach(s=>{const t=grid[s.r][s.c]; if(isSwordTarget(t) && pool>=t.hp) dead.add(s.r+','+s.c);});
  return dead;
}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  // 选中集合（快速查找）
  const sel=new Set(selection.map(s=>s.r+','+s.c));
  const chainType=selection.length?selection[0].type:null;
  const killSet=previewKills();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=grid[r][c]; if(!t) continue;
    const x=cellX(c), y=(t.curY!==undefined?t.curY:cellY(r));
    const d=DEF[t.type], g=TILE-8;
    const picked=sel.has(t.r+','+t.c);
    // 能被剑攻击的（怪 / 可剑连的Boss，以及剑本身）统一红底，一眼看出可攻击
    const baseCol = (isSwordTarget(t) || t.type==='sword') ? DEF.sword.color : d.color;
    // 被剑链穿过的怪/可攻击Boss → 红色高亮（表示正被攻击）
    const gl = (picked && chainType==='sword' && isSwordTarget(t)) ? DEF.sword.glow : d.glow;
    // 背景
    ctx.save();
    roundRect(x+4,y+4,g,g,12);
    if(!picked){ ctx.fillStyle=hexA(baseCol,.16); }
    else { ctx.fillStyle=hexA(gl,.30); ctx.shadowColor=gl; ctx.shadowBlur=14; }
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.lineWidth=picked?3:1.5;
    ctx.strokeStyle=picked?gl:hexA(baseCol,.5);
    ctx.stroke();
    ctx.restore();

    const cx=x+TILE/2, cy=y+TILE/2;
    if(t.type==='enemy'||t.type==='boss'){
      const isBoss=t.type==='boss';
      const bdef = isBoss?bossDef(t):null;
      const doomed = killSet && killSet.has(t.r+','+t.c) && (!isBoss || bdef.swordable); // 会被这条线杀死 → 骷髅
      ctx.font=Math.floor(TILE*0.30)+'px '+EMOJI_FONT;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(doomed?'💀':(isBoss?bdef.emoji:'👹'), cx, y+TILE*0.30);
      // 血量
      ctx.fillStyle='#fff'; ctx.font='700 '+Math.floor(TILE*0.34)+'px system-ui';
      ctx.fillText(t.hp, cx, cy+TILE*0.10);
      // 攻击力角标（左上）——特效/大招型 Boss（攻击力无意义）不显示
      if(!isBoss || (!bdef.act && !bdef.cdAttack)){
        const ax=x+10, ay=y+10, ar=TILE*0.16;
        ctx.beginPath(); ctx.arc(ax,ay,ar,0,7);
        ctx.fillStyle=(isBoss&&bdef.trueDmg)?'#8e44ad':'#c0392b'; ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font='700 '+Math.floor(TILE*0.20)+'px system-ui';
        ctx.fillText(t.atk, ax, ay+1);
      }
      // 倒计时角标（右上）——每回合扰乱型 Boss 无倒计时，不显示
      if(!isBoss || !bdef.perTurn){
        const bx=x+g-4, by=y+10, br=TILE*0.16;
        ctx.beginPath(); ctx.arc(bx,by,br,0,7);
        ctx.fillStyle = t.cd<=1? '#e74c3c' : t.cd<=2? '#e67e22' : '#2c3e50';
        ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font='700 '+Math.floor(TILE*0.20)+'px system-ui';
        ctx.fillText(t.cd, bx, by+1);
      }
    } else {
      ctx.font=Math.floor(TILE*0.46)+'px '+EMOJI_FONT;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(d.emoji, cx, cy);
    }
  }
  // 连接线
  if(selection.length){
    const d=DEF[selection[0].type];
    ctx.lineWidth=TILE*0.16; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle=hexA(d.glow,.9); ctx.shadowColor=d.glow; ctx.shadowBlur=12;
    ctx.beginPath();
    selection.forEach((s,i)=>{ const px=cellX(s.c)+TILE/2, py=cellY(s.r)+TILE/2;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
    if(dragging && lastPointer) ctx.lineTo(lastPointer.x,lastPointer.y);
    ctx.stroke(); ctx.shadowBlur=0;
  }
}
function hexA(hex,a){ const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

function loop(){
  if(!grid){ requestAnimationFrame(loop); return; } // 棋盘未创建（选职业中）
  // 缓动下落
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c]; if(!t)continue;
    const ty=cellY(r); if(t.curY===undefined)t.curY=ty;
    t.curY += (ty-t.curY)*0.3; if(Math.abs(ty-t.curY)<0.5)t.curY=ty; }
  draw(); requestAnimationFrame(loop);
}

//==================== 输入 ====================
let lastPointer=null;
function cellFromEvent(e){
  const rect=cv.getBoundingClientRect();
  const sx=cv.width/rect.width, sy=cv.height/rect.height;
  const px=(e.clientX-rect.left)*sx, py=(e.clientY-rect.top)*sy;
  lastPointer={x:px,y:py};
  const c=Math.floor((px-PAD)/TILE), r=Math.floor((py-PAD)/TILE);
  if(r<0||r>=ROWS||c<0||c>=COLS) return null;
  return {r,c};
}
function startDrag(e){
  if(busy||pendingLevels) return;
  const cell=cellFromEvent(e); if(!cell) return;
  const t=grid[cell.r][cell.c]; if(!t) return;
  // 从怪物起手 → 视为剑攻击链
  const base = isSwordTarget(t) ? 'sword' : t.type;   // 怪 / 可攻击Boss 起手 → 剑链
  // 不可连的 Boss 仍允许轻触查看信息（连线不会扩展，松手即弹说明）
  if(t.type!=='boss' && !CONNECTABLE.includes(base)) return;
  dragging=true; selection=[{r:cell.r,c:cell.c,type:base}];
  e.preventDefault();
}
function moveDrag(e){
  if(!dragging) return; e.preventDefault();
  const cell=cellFromEvent(e); if(!cell) return;
  const t=grid[cell.r][cell.c]; if(!t) return;
  const last=selection[selection.length-1];
  // 回退
  if(selection.length>=2){
    const prev=selection[selection.length-2];
    if(prev.r===cell.r&&prev.c===cell.c){ selection.pop(); return; }
  }
  if(selection.some(s=>s.r===cell.r&&s.c===cell.c)) return; // 已选
  const base=selection[0].type;
  const ok = t.type===base || (base==='sword' && isSwordTarget(t)); // 剑链可穿怪/可攻击Boss
  if(!ok) return;
  if(Math.abs(cell.r-last.r)<=1 && Math.abs(cell.c-last.c)<=1) // 相邻8向
    selection.push({r:cell.r,c:cell.c,type:t.type});
}
function endDrag(e){
  if(!dragging) return; dragging=false;
  if(selection.length>=2) resolve();
  else if(selection.length===1){ // 轻触单格 → 显示该方块说明
    const s=selection[0], t=grid[s.r][s.c];
    if(t) showTileInfo(t);
  }
  selection=[]; lastPointer=null;
}
cv.addEventListener('pointerdown',startDrag);
cv.addEventListener('pointermove',moveDrag);
window.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);

//==================== 金币商店 ====================
const SHOP={
  heal: {cost:15, f(){ const h=gainHeal(10); log(tr(`💊 喝下药水，回复 ${h} 生命`,`💊 Potion: +${h} HP`)); }},
  bomb: {cost:25, f(){ let kills=0, boss=0;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c];
      if(t&&(t.type==='enemy'||t.type==='boss')){ t.hp-=6;
        if(t.hp<=0){ const isBoss=t.type==='boss'; grid[r][c]=null;
          if(isBoss){ boss++; player.xp+=15; player.gold+=20; } else { kills++; player.xp+=3; } } } }
    log(tr(`💥 投掷炸弹，全场 −6`,`💥 Bomb: all foes −6`) + (kills?tr(`，击杀 ${kills} 只👹`,`, ${kills} killed`):'') + (boss?tr(`，击败 Boss！厚赏 💰+20、经验+15`,`, Boss down! 💰+20, XP+15`):''));
    applyGravity(); syncPositions(false); }},
};
function shopCost(key){ return Math.ceil(SHOP[key].cost*(player.bargain?0.5:1)); } // 盗贼半价
function buyItem(key){
  if(busy||pendingLevels) return;
  if(typeof player.shopCd!=='object'||!player.shopCd) player.shopCd={}; // 兼容旧存档
  if(player.shopCd[key]>0) return;            // 该商品冷却中（每件独立，每 3 回合一次）
  const it=SHOP[key]; if(!it) return;
  const cost=shopCost(key); if(player.gold<cost) return;
  player.gold-=cost; it.f();
  player.shopCd[key]=3;                        // 仅该商品进入 3 回合冷却
  checkLevel(); updateHUD();
  if(pendingLevels) showLevelUp();
}
document.querySelectorAll('.shopBtn[data-buy]').forEach(b=>{
  b.onclick=()=>buyItem(b.dataset.buy);
});

//==================== 职业主动技能 ====================
function activateSkill(){
  if(busy||pendingLevels) return;
  const sk=player&&player.cls&&player.cls.skill; if(!sk) return;
  if(player.skillCd>0) return;
  const r=sk.f(player);
  if(r===false) return;        // 技能判定无效（如锻甲场上没护甲）：不进冷却、不刷日志
  player.skillCd=sk.cd;
  if(r===undefined) log(tr(`✨ 【${L(sk.name)}】发动！`,`✨ ${L(sk.name)} activated!`)); // 技能没自带日志才用通用日志
  checkLevel(); updateHUD();
  if(pendingLevels) showLevelUp();
}
document.getElementById('skillBtn').onclick=activateSkill;

//==================== 核心结算 ====================
function resolve(){
  const type=selection[0].type;
  let msg=''; // 经验只来自击杀（在 dealDamage 里 +3），消除图块本身不给经验

  if(type==='sword'){
    const swords=selection.filter(s=>{const t=grid[s.r][s.c]; return t&&t.type==='sword';});
    const targets=selection.filter(s=>isSwordTarget(grid[s.r][s.c]));
    const nS=swords.length;
    swords.forEach(s=>grid[s.r][s.c]=null);
    const combo=1+Math.max(0,nS-2)*0.15;               // 多连奖励：每超出2把剑 +15%
    let pool=(nS*player.weaponPower+player.swordFlat)*combo;
    if(player.berserk && player.hp < player.maxHp*0.5) pool*=1.5; // 血怒
    pool=Math.floor(pool);
    // 剑伤只作用于连线穿过的怪；没串到怪就只消除剑、不误伤全场
    let dmg=0, kills=0;
    if(targets.length){ ({dmg,kills}=dealDamage(pool, targets)); }
    if(player.lifesteal&&kills) player.hp=Math.min(player.maxHp, player.hp+kills*player.lifesteal);
    let steal=0;
    if(player.steal && kills){ steal=kills; player.gold+=steal; } // 盗贼【掠夺】：每击杀一只怪额外 +1 金币
    const comboTxt=combo>1?tr(` 连击×${combo.toFixed(2)}`,` combo×${combo.toFixed(2)}`):'';
    msg=`🔪×${nS}${comboTxt}` + (targets.length
      ? tr(` 直击 ${targets.length} 只怪 → ${dmg} 伤害`,` hit ${targets.length} → ${dmg} dmg`) + (kills?tr(`，击杀 ${kills} 只👹`,`, ${kills} killed`):'') + (steal?`，💰+${steal}`:'')
      : tr('（未串到怪）','(no enemy hit)'));
  } else {
    const count=selection.length;
    selection.forEach(s=>{ grid[s.r][s.c]=null; });
    const combo=1+Math.max(0,count-2)*0.15;            // 多连奖励：每超出2个 +15%
    const comboTxt=combo>1?tr(` 连击×${combo.toFixed(2)}`,` combo×${combo.toFixed(2)}`):'';
    const d=DEF[type];
    if(type==='shield'){ player.shieldXp += Math.round(count*player.armorPerShield*combo);
      let gained=0; while(player.shieldXp>=armorNeeded(player.armor)){ player.shieldXp-=armorNeeded(player.armor); player.armor++; gained++; }
      msg=`${d.emoji}×${count}${comboTxt} → `+tr(`护甲进度 ${player.shieldXp}/${armorNeeded(player.armor)}`,`armor ${player.shieldXp}/${armorNeeded(player.armor)}`)+(gained?tr(`，护甲 +${gained}！（减伤 ${player.armor}）`,`, armor +${gained}! (reduce ${player.armor})`):''); }
    else if(type==='heart'){
      let amt=count*player.healPerHeart*combo;
      if(player.revive) amt*=1+(player.maxHp-player.hp)/player.maxHp; // 牧师：越缺血回越多
      const h=gainHeal(Math.round(amt));
      msg=`${d.emoji}×${count}${comboTxt} → `+tr(`回复 ${h} 生命`,`+${h} HP`); }
    else if(type==='coin'){ const g=Math.round(count*player.goldPerCoin*combo); player.gold+=g;
      msg=`${d.emoji}×${count}${comboTxt} → `+tr(`获得 ${g} 金币`,`+${g} gold`); }
  }
  log(msg);

  // 回合推进：怪物倒计时 / 攻击
  player.turns++;
  if(typeof player.shopCd==='object') for(const k in player.shopCd){ if(player.shopCd[k]>0) player.shopCd[k]--; } // 各商品冷却递减
  if(player.skillCd>0) player.skillCd--; // 技能冷却递减
  advanceEnemies();
  if(player.regen) gainHeal(player.regen);
  if(player.turns % 10 === 0) spawnBoss();   // 每 10 回合 Boss 现身

  applyGravity();
  syncPositions(false);
  checkLevel();
  updateHUD();
  if(player.hp<=0){ gameOver(); return; }
  if(pendingLevels) showLevelUp();
}

// 治疗：返回实际回复的生命（超出上限的部分丢弃）
function gainHeal(amount){
  const space=player.maxHp-player.hp, used=Math.min(space,amount);
  player.hp+=used;
  return used;
}

function dealDamage(pool, targets){
  let dmg=0, kills=0;
  const list=[];
  if(targets){ targets.forEach(s=>{ const t=grid[s.r][s.c];
    if(isSwordTarget(t)) list.push({r:s.r,c:s.c,t}); }); }
  else { for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c];
    if(t&&t.type==='enemy') list.push({r,c,t}); } }
  // 原版算法：剑链伤害对每只目标【独立、全额】生效，不共享、不分配
  for(const e of list){
    const hit=Math.min(pool, e.t.hp);
    e.t.hp-=hit; dmg+=hit;
    if(e.t.hp<=0){ grid[e.r][e.c]=null; kills++;
      if(e.t.type==='boss'){ player.xp+=15; player.gold+=20; }       // 剑杀 Boss：厚赏
      else { player.xp+=3; player.gold += 1 + (player.bargain?2:0); }
    }
  }
  return {dmg,kills};
}

function advanceEnemies(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=grid[r][c];
    if(!t || (t.type!=='enemy' && t.type!=='boss')) continue;
    const def = t.type==='boss' ? bossDef(t) : null;
    if(def && def.everyTurn) def.everyTurn(t);        // 每回合持续效果（饕餮吞噬），仍走倒计时
    if(def && def.perTurn){ def.act(t); continue; }    // 纯每回合型（小丑/吸血鬼）：无倒计时
    t.cd--;
    if(t.cd<=0){
      if(def && def.cdAttack){
        def.cdAttack(t);   // 自定义倒计时攻击（饕餮：自身血量50%）
      } else if(def && def.act){
        def.act(t);   // 特殊 Boss（如小丑）：执行特效，不直接掉血（act 内部自带日志）
      } else if(def && def.trueDmg){
        player.hp-=t.atk;   // 真实伤害：无视护甲与额外减伤
        addDmg(def.id, t.atk);
        log(tr(`${def.emoji} ${L(def.name)} 真实伤害 ${t.atk}（无视护甲）！`,`${def.emoji} ${L(def.name)} hits for ${t.atk} TRUE damage (ignores armor)!`));
      } else {
        // 护甲 = 常驻减伤值，不消耗；无论减多少，最低仍掉 1 血
        const dmg=Math.max(1, t.atk - player.armor - (player.toughness||0));
        player.hp-=dmg;
        addDmg(def?def.id:'enemy', dmg);
        log((def?tr(`${def.emoji} Boss 重击`,`${def.emoji} Boss strike`):tr('👹 攻击','👹 attack'))+tr(` ${t.atk}，被护甲挡下，实际掉 ${dmg} 血！`,` ${t.atk}, armor blocks → ${dmg} HP lost!`));
      }
      t.cd=t.baseCd;
    }
  }
}

function applyGravity(){
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){ if(grid[r][c]){ const t=grid[r][c];
      if(write!==r){ grid[write][c]=t; grid[r][c]=null; } write--; } }
    let above=-1;
    for(let r=write;r>=0;r--){ const t=makeTile(); t.curY=cellY(above); above--; grid[r][c]=t; }
  }
}

function checkLevel(){
  while(player.xp>=xpNeeded(player.level)){
    player.xp-=xpNeeded(player.level); player.level++; pendingLevels++;
  }
}

//==================== 升级（技能三选一）====================
const UPGRADES=[
  {n:['强健体魄','Tough Body'],   d:['最大生命 +6，并立即回满','+6 max HP, fully heal now'], f:p=>{p.maxHp+=6; p.hp=p.maxHp;}},
  {n:['磨利刀刃','Sharpen Blade'], d:['剑伤 +50%（连越长收益越大）','+50% sword power (longer chains gain more)'], f:p=>{p.weaponPower+=0.5;}},
  {n:['狂战之力','Brute Force'],   d:['每次剑链额外 +3 固定伤害','+3 flat damage per sword chain'], f:p=>{p.swordFlat+=3;}},
  {n:['重型护甲','Heavy Armor'],   d:['立即 +1 护甲（永久减伤）','+1 armor now (permanent damage cut)'], f:p=>{p.armor+=1;}},
  {n:['坚盾强化','Sturdy Shield'], d:['每个盾提供的护甲进度 +1','+1 armor progress per shield'], f:p=>{p.armorPerShield+=1;}},
  {n:['神圣治疗','Holy Healing'],  d:['每颗心回复生命 +1','+1 HP healed per heart'], f:p=>{p.healPerHeart+=1;}},
  {n:['贪婪之心','Greed'],         d:['每枚金币收益 +1','+1 gold per coin'], f:p=>{p.goldPerCoin+=1;}},
  {n:['吸血鬼','Vampire'],         d:['每击杀一只怪物回复 1 生命','Heal 1 HP per enemy killed'], f:p=>{p.lifesteal+=1;}},
  {n:['生命恢复','Regeneration'],  d:['每回合自动回复 1 生命','Heal 1 HP every turn'], f:p=>{p.regen+=1;}},
];
function showLevelUp(){
  busy=true;
  const pool=[...UPGRADES].sort(()=>Math.random()-0.5).slice(0,3);
  const card=document.getElementById('card');
  card.innerHTML=`<h2>${tr(`⬆️ 升到 ${player.level} 级！`,`⬆️ Level ${player.level}!`)}</h2><p>${tr('选择一项强化','Pick one upgrade')}</p>`;
  pool.forEach(u=>{
    const b=document.createElement('button'); b.className='choice';
    b.innerHTML=`<b>${L(u.n)}</b><small>${L(u.d)}</small>`;
    b.onclick=()=>{ u.f(player); player.hp=Math.min(player.hp,player.maxHp);
      pendingLevels--; updateHUD();
      if(pendingLevels>0) showLevelUp(); else { busy=false; hideOverlay(); } };
    card.appendChild(b);
  });
  showOverlay();
}

function gameOver(){
  busy=true;
  saveBest(); clearSave();
  // 死亡报告：各来源伤害占比
  const dmg=player.dmgBy||{};
  const ents=Object.entries(dmg).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const tot=ents.reduce((s,[,v])=>s+v,0);
  let report='';
  if(ents.length){
    const rows=ents.map(([k,v])=>{ const s=dmgSourceLabel(k);
      const pct=Math.round(v/tot*100);
      return `<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 6px;font-size:13px">
        <span>${s.emoji} ${L(s.name)}</span><b style="color:var(--gold)">${Math.round(v)} · ${pct}%</b></div>`; }).join('');
    report=`<div style="text-align:left;margin:4px 0 12px;background:var(--panel2);border-radius:10px;padding:6px 4px">
      <div style="text-align:center;color:var(--dim);font-size:12px;margin-bottom:2px">${tr('☠️ 伤害来源','☠️ Damage taken from')}</div>${rows}</div>`;
  }
  const card=document.getElementById('card');
  card.innerHTML=`<h2 style="color:var(--hp)">${tr('💀 你倒下了','💀 You fell')}</h2>
    <p>${tr('地牢吞噬了又一位冒险者…','The dungeon claims another adventurer…')}</p>
    <div style="font-size:15px;line-height:2;margin-bottom:6px">
      ${tr('到达等级','Level reached')} <b style="color:var(--gold)">${player.level}</b><br>
      ${tr('累计金币','Total gold')} <b style="color:var(--gold)">💰 ${player.gold}</b><br>
      ${tr('坚持回合','Turns survived')} <b style="color:var(--gold)">${player.turns}</b>
    </div>
    ${report}
    <button class="btn" id="again">${tr('换个职业再来','Play again')}</button>`;
  document.getElementById('again').onclick=showClassSelect;
  showOverlay();
}

//==================== 方块说明（点击查看）====================
function tileInfo(t){
  const p=player;
  if(t.type==='sword') return {icon:'🔪', title:tr('剑 · 攻击','Sword · Attack'),
    desc:tr('连接 2 把及以上的剑攻击怪物。剑链可直接拖过 👹，串到的怪各自独立吃满伤害。','Link 2+ swords to attack. Sword chains pass straight through 👹 — each linked enemy takes the full damage.'),
    rows:[ [tr('每把剑威力','Power per sword'), `×${p.weaponPower}`],
      [tr('固定剑伤','Flat damage'), `+${p.swordFlat}`],
      [tr('多连奖励','Combo bonus'), tr('每超出 2 把 +15%','+15% per sword over 2')],
      [tr('伤害怎么算','Damage'), tr('剑越多、威力越高、连得越长，越疼','More swords, higher power, longer chains → more damage')],
      [tr('血怒（狂战士）','Bloodlust (Berserker)'), p.berserk?tr('生命<50% 时总伤 ×1.5','×1.5 when HP<50%'):'—'] ]};
  if(t.type==='shield') return {icon:'🔰', title:tr('盾 · 减伤','Shield · Armor'),
    desc:tr('连接盾累积「护甲进度」，攒满就 +1 护甲（永久减伤，像攒经验升级）。护甲是常驻减伤：受击时先用护甲（和额外减伤）抵消，剩下的才掉血，但每次至少掉 1 滴。','Linking shields fills armor progress; fill it to gain +1 armor (permanent, like leveling). Armor is permanent damage reduction: it soaks each hit (plus any extra reduction), but you always lose at least 1 HP per hit.'),
    rows:[ [tr('当前护甲(减伤)','Armor (reduction)'), `${p.armor}`],
      [tr('护甲进度','Armor progress'), `${p.shieldXp} / ${armorNeeded(p.armor)}`],
      [tr('每个盾 +进度','Progress per shield'), `+${p.armorPerShield}`],
      [tr('额外减伤(铁壁)','Extra reduction (Bulwark)'), p.toughness?`−${p.toughness}`:'—'] ]};
  if(t.type==='heart') return {icon:'💗', title:tr('心 · 治疗','Heart · Heal'),
    desc:tr('连接 2 颗及以上的心回复生命。','Link 2+ hearts to restore HP.'),
    rows:[ [tr('每颗心回复','Heal per heart'), `+${p.healPerHeart}`],
      [tr('当前生命','Current HP'), `${Math.round(p.hp)} / ${p.maxHp}`],
      [tr('每回合自动回复','Heal each turn'), p.regen?`+${p.regen}`:'—'],
      [tr('越缺血回越多(牧师)','Heal more when low (Priest)'), p.revive?tr('是','Yes'):'—'] ]};
  if(t.type==='coin') return {icon:'💰', title:tr('金币','Coin'),
    desc:tr('连接 2 枚及以上的金币赚钱，用于商店购买。','Link 2+ coins to earn gold for the shop.'),
    rows:[ [tr('每枚金币','Gold per coin'), `+${p.goldPerCoin}`],
      [tr('当前金币','Current gold'), `${p.gold}`],
      [tr('掠夺（盗贼）','Plunder (Rogue)'), p.steal?tr('剑每击杀一只怪 +1 金币','+1 gold per sword kill'):'—'] ]};
  if(t.type==='boss'){ const def=bossDef(t);
    const rows=[ [tr('血量','HP'), `${t.hp} / ${t.maxHp}`] ];
    if(def.special) rows.push([tr('特殊','Special'), L(def.special)]);
    else rows.push([def.trueDmg?tr('攻击力（真实·无视护甲）','Attack (TRUE, ignores armor)'):tr('攻击力','Attack'), `${t.atk}`]);
    if(!def.perTurn) rows.push([tr('倒计时','Timer'), `${t.cd} / ${t.baseCd}`]);
    rows.push([tr('攻击方式','How to hit'), def.swordable?tr('剑 / 炸弹','Sword / Bomb'):tr('只能炸弹','Bomb only')]);
    rows.push([tr('击败奖励','Kill reward'), '💰+20 · XP+15']);
    return {icon:def.emoji, title:'Boss · '+L(def.name), desc:L(def.desc), rows};
  }
  return {icon:'👹', title:tr('怪物','Enemy'),
    desc:tr('左上是攻击力，右上是倒计时。每行动一次倒计时 −1，归零就攻击你：先用护甲抵消，剩下的才掉血，但每次至少掉 1 滴。用剑链串过它就能攻击，伤害够高直接点杀。','Top-left is its attack, top-right its timer. The timer drops by 1 each action; at 0 it attacks — your armor soaks most of it, but you always lose at least 1 HP. Drag a sword chain through it to attack; enough damage kills it.'),
    rows:[ [tr('血量','HP'), `${t.hp} / ${t.maxHp}`],
      [tr('攻击力','Attack'), `${t.atk}`],
      [tr('倒计时','Timer'), `${t.cd} / ${t.baseCd}`] ]};
}
function showTileInfo(t){
  busy=true;
  const info=tileInfo(t);
  const rows=info.rows.map(([k,v])=>
    `<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid #3a2d4d">
       <span style="color:var(--dim)">${k}</span><b style="text-align:right">${v}</b></div>`).join('');
  const card=document.getElementById('card');
  card.innerHTML=`<h2>${info.icon} ${info.title}</h2><p>${info.desc}</p>
    <div style="text-align:left;font-size:13px;margin:0 0 14px">${rows}</div>
    <button class="btn" id="infoClose" style="width:100%">${tr('关闭','Close')}</button>`;
  document.getElementById('infoClose').onclick=()=>{ busy=false; hideOverlay(); updateHUD(); };
  showOverlay();
}

// 点击 HUD：查看角色全部属性 + 职业
function showPlayerInfo(){
  if(busy||pendingLevels||!player) return;
  busy=true;
  const p=player, cls=p.cls, an=armorNeeded(p.armor);
  const rowItem=(k,v)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px solid #3a2d4d">
       <span style="color:var(--dim)">${k}</span><b style="text-align:right">${v}</b></div>`;
  const rows=[
    [tr('❤️ 生命','❤️ HP'), `${Math.round(p.hp)} / ${p.maxHp}`],
    [tr('🔰 护甲(减伤)','🔰 Armor (reduction)'), `${p.armor}${p.toughness?` +${p.toughness}`:''}　${tr('进度','progress')} ${p.shieldXp}/${an}`],
    [tr('📈 等级 · 经验','📈 Level · XP'), `Lv.${p.level} · ${p.xp}/${xpNeeded(p.level)}`],
    [tr('💰 金币 · 回合','💰 Gold · Turn'), `${p.gold} · ${p.turns}`],
    [tr('🔪 剑威力','🔪 Sword power'), `×${p.weaponPower}${p.swordFlat?` +${p.swordFlat} ${tr('固定','flat')}`:''}`],
    [tr('🔰 每盾进度','🔰 Progress/shield'), `+${p.armorPerShield}`],
    [tr('💗 每心回复','💗 Heal/heart'), `+${p.healPerHeart}`],
    [tr('💰 每金币','💰 Gold/coin'), `+${p.goldPerCoin}`],
  ].map(([k,v])=>rowItem(k,v)).join('');
  const perks=[];
  if(p.toughness) perks.push(tr(`额外减伤 −${p.toughness}`,`Extra reduction −${p.toughness}`));
  if(p.lifesteal) perks.push(tr(`吸血 +${p.lifesteal}/杀`,`Lifesteal +${p.lifesteal}/kill`));
  if(p.regen) perks.push(tr(`每回合回复 +${p.regen}`,`Regen +${p.regen}/turn`));
  if(p.steal) perks.push(tr('掠夺（剑杀怪 +1💰）','Plunder (+1💰 per sword kill)'));
  if(p.berserk) perks.push(tr('血怒（生命<50% 剑伤×1.5）','Bloodlust (×1.5 sword dmg <50% HP)'));
  if(p.revive) perks.push(tr('回春（越缺血回越多）','Renewal (heal more when low)'));
  const perkLine = perks.length ? `<div style="text-align:left;font-size:12px;color:var(--gold);margin:8px 0 0">${tr('✦ 特性：','✦ Perks: ')}${perks.join('　')}</div>` : '';
  const skillLine = cls ? `<div style="text-align:left;font-size:12px;margin:8px 0 0;padding:8px;background:var(--panel2);border-radius:10px">${tr('✨ 主动技能','✨ Active skill')}【${L(cls.skill.name)}】：${L(cls.skill.short)}（${tr('每','every')} ${cls.skill.cd} ${tr('回合','turns')}）</div>` : '';
  const card=document.getElementById('card');
  card.innerHTML=`<h2>${cls?`${cls.e} ${L(cls.n)}`:tr('冒险者','Adventurer')}</h2>
    ${cls?`<p>${L(cls.d)}</p>`:''}
    <div style="text-align:left;font-size:13px;margin:0 0 4px">${rows}</div>
    ${skillLine}${perkLine}
    <button class="btn" id="infoClose" style="width:100%;margin-top:12px">${tr('关闭','Close')}</button>`;
  document.getElementById('infoClose').onclick=()=>{ busy=false; hideOverlay(); updateHUD(); };
  showOverlay();
}
document.getElementById('hud').onclick=showPlayerInfo;

function showOverlay(){ document.getElementById('overlay').classList.add('show'); }
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }

//==================== HUD / 日志 ====================
function bar(idBar,idTxt,cur,max,suffix){
  document.getElementById(idBar).style.width=Math.max(0,Math.min(100,cur/max*100))+'%';
  document.getElementById(idTxt).textContent=`${Math.max(0,Math.round(cur))} / ${max}`+(suffix||'');
}
function updateHUD(){
  bar('hpBar','hpTxt',player.hp,player.maxHp);
  updateDanger();
  const an=armorNeeded(player.armor);
  document.getElementById('arBar').style.width=Math.min(100,player.shieldXp/an*100)+'%';
  document.getElementById('arTxt').textContent=
    `${tr('减伤','Cut')} ${player.armor}${player.toughness?`+${player.toughness}`:''}　${player.shieldXp}/${an}`;
  const need=xpNeeded(player.level);
  document.getElementById('xpBar').style.width=(player.xp/need*100)+'%';
  document.getElementById('xpTxt').textContent=`${player.xp} / ${need}`;
  document.getElementById('lvTxt').textContent=player.level;
  document.getElementById('goldTxt').textContent=player.gold;
  document.getElementById('turnTxt').textContent=player.turns;
  const b=[];
  if(player.cls) b.push(`${player.cls.e}${L(player.cls.n)}`);
  // 四项核心收益，统一格式紧挨在一起
  b.push(`🔪×${player.weaponPower}${player.swordFlat?`+${player.swordFlat}`:''}`);
  b.push(`🔰${player.armorPerShield}`);
  b.push(`💗${player.healPerHeart}`);
  b.push(`💰${player.goldPerCoin}`);
  if(player.steal)b.push(tr('掠夺','Plunder'));
  if(player.lifesteal)b.push(tr(`吸血 ${player.lifesteal}`,`Lifesteal ${player.lifesteal}`));
  if(player.regen)b.push(tr(`恢复 ${player.regen}`,`Regen ${player.regen}`));
  document.getElementById('bonusTxt').textContent=b.join('　');
  const scd=(player.shopCd&&typeof player.shopCd==='object')?player.shopCd:{};
  document.querySelectorAll('.shopBtn[data-buy]').forEach(btn=>{
    const c=shopCost(btn.dataset.buy), cd=scd[btn.dataset.buy]||0;
    btn.querySelector('em').textContent = cd>0 ? `⏳${cd}${tr('回合','t')}` : c+'💰';
    btn.disabled = busy || pendingLevels || cd>0 || player.gold < c; });
  const sb=document.getElementById('skillBtn'), sk=player.cls&&player.cls.skill;
  if(sk){ sb.style.display='flex';
    sb.querySelector('span').textContent=`✨${L(sk.name)}`;
    sb.querySelector('small').textContent=L(sk.short);
    sb.querySelector('em').textContent = player.skillCd>0 ? `⏳${player.skillCd}${tr('回合','t')}` : tr('可发动','Ready');
    sb.disabled = busy || pendingLevels || player.skillCd>0;
  } else { sb.style.display='none'; }
  saveGame();
}
// 低血时屏幕边缘变红：血越少越红，危急时呼吸闪烁
const vignetteEl=document.getElementById('vignette');
function updateDanger(){
  const ratio=Math.max(0,player.hp)/player.maxHp;
  // 生命 >50% 不显示；50%→0% 之间，红色从无到最浓
  const t=Math.max(0,(0.5-ratio)/0.5);          // 0 ~ 1
  vignetteEl.style.opacity=(t*0.85).toFixed(3);  // 最浓 0.85
  const danger = ratio>0 && ratio<=0.2;
  vignetteEl.classList.toggle('pulse', danger); // 危急呼吸闪烁
  document.getElementById('hpBar').classList.toggle('low', danger); // 生命条同步闪烁
}
const logEl=document.getElementById('log'); let logs=[];
function log(m){ logs.push(m); if(logs.length>2)logs.shift();
  logEl.innerHTML=logs.map((x,i)=>i===logs.length-1?`<span style="color:var(--txt)">${x}</span>`:x).join('<br>'); }
function logClear(){ logs=[]; logEl.innerHTML=''; }

document.getElementById('langBtn').textContent = lang==='en'?'中文':'EN';
applyStaticLang();
resize(); showClassSelect(); loop();
})();
