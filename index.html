<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地牢突袭 · Dungeon Raid</title>
<link rel="canonical" href="./dungeon-raid.html">
<meta name="theme-color" content="#241b30">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23241b30'/%3E%3Cg fill='%23e7c14a'%3E%3Crect x='15' y='21' width='7' height='9'/%3E%3Crect x='28' y='21' width='8' height='9'/%3E%3Crect x='42' y='21' width='7' height='9'/%3E%3Crect x='15' y='29' width='34' height='22' rx='1'/%3E%3C/g%3E%3Cpath d='M26 51V41a6 6 0 0 1 12 0v10z' fill='%23241b30'/%3E%3Crect x='31' y='12' width='3' height='10' fill='%23e7c14a'/%3E%3Cpath d='M34 13l8 2-8 2z' fill='%23c0392b'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="地牢突袭">
<style>
  :root{ --bg:#1a1530; --gold:#f1c40f; --dim:#9b93c7; --txt:#ece8ff; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{ background:radial-gradient(120% 90% at 50% 0%, #2a2350 0%, #1a1530 60%, #120e22 100%);
    color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100%; padding:24px; }
  h1{ font-size:30px; margin:0; letter-spacing:1px; }
  .sub{ color:var(--dim); font-size:14px; margin:2px 0 22px; }
  .play{ display:block; width:min(360px,86vw); text-align:center; text-decoration:none;
    background:linear-gradient(160deg,#f1c40f,#e08e0b); color:#2a1a00; font-weight:800;
    font-size:24px; padding:20px 24px; border-radius:16px; box-shadow:0 8px 26px rgba(241,196,15,.28);
    border:2px solid #ffd86b; }
  .play small{ display:block; font-weight:600; font-size:13px; color:#5a3b00; margin-top:4px; }
  .dev{ display:inline-block; text-align:center; text-decoration:none; margin-top:14px;
    background:#2b2350; color:#d9ccff; font-weight:600; font-size:13px; padding:7px 16px;
    border-radius:999px; border:1px solid #6a4fa3; }
  .note{ color:var(--dim); font-size:12px; margin-top:20px; max-width:360px; text-align:center; line-height:1.6; }
  .badge{ display:inline-block; font-size:11px; font-weight:700; padding:1px 8px; border-radius:9px; vertical-align:middle; }
  .badge.rel{ background:#2e7d46; color:#fff; }
  .badge.dev{ background:#7d3cad; color:#fff; }
  #installHomeBtn{ position:fixed; left:12px; top:12px; z-index:20; background:#2b2350; color:#d9ccff; border:1px solid #6a4fa3;
    border-radius:999px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.25); }
  #installHomeBtn:hover{ border-color:#ffd86b; color:#fff; }
</style>
</head>
<body>
  <button id="installHomeBtn" style="display:none">📲 放桌面</button>
  <h1>🏰 地牢突袭</h1>
  <div class="sub">Dungeon Raid · 连线消除 Roguelike</div>

  <a class="play" href="./dungeon-raid.html">
    ▶ 开始游戏 <span class="badge rel">正式版</span>
    <small>Play · Release<span id="prodVer"></span></small>
  </a>

  <a class="dev" href="./dungeon-raid-dev.html">🚧 开发版 DEV · 最新 / 独立存档<span id="devVer"></span></a>

  <div class="note">
    正式版与开发版的存档相互独立，互不覆盖。<br>
    Release and Dev keep separate saves — they never overwrite each other.
  </div>
  <!-- 版本号由 dr.sh 在部署时注入到 public/index.html；这里不做运行时请求 -->
  <script>
    (()=>{
      const btn=document.getElementById('installHomeBtn');
      if(!btn) return;
      let installPromptEvt=null;
      const isStandalone=()=>{
        try{ return !!((window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone); }
        catch(e){ return false; }
      };
      const isiOS=()=>{
        try{ const ua=((navigator.userAgent||'')+'').toLowerCase(); return /iphone|ipad|ipod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
        catch(e){ return false; }
      };
      const label=()=>document.documentElement&&document.documentElement.lang==='en' ? '📲 Install' : '📲 放桌面';
      const refresh=()=>{ btn.textContent=label(); btn.style.display=isStandalone()?'none':''; };
      async function triggerInstall(){
        if(installPromptEvt){
          try{ const evt=installPromptEvt; installPromptEvt=null; evt.prompt(); await evt.userChoice; }catch(e){}
          refresh();
          return;
        }
        const zh=document.documentElement&&document.documentElement.lang!=='en';
        const msg=isiOS()
          ? (zh ? '在 Safari 点分享按钮，再选“添加到主屏幕”。' : 'In Safari, tap Share and then choose “Add to Home Screen”.')
          : (zh ? '当前浏览器没有提供一键安装弹窗；可用浏览器菜单里的“添加到主屏幕”或“安装应用”。' : 'This browser did not expose a one-tap install prompt; use the browser menu’s “Add to Home Screen” or “Install App” option.');
        alert(msg);
      }
      btn.onclick=triggerInstall;
      if(typeof window!=='undefined'){
        window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installPromptEvt=e; refresh(); });
        window.addEventListener('appinstalled', ()=>{ installPromptEvt=null; refresh(); });
      }
      refresh();
    })();
  </script>
</body>
</html>
