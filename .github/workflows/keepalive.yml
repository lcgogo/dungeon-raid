name: keepalive-verify-render
# 给 render 免费档的常驻验证服务保活：免费档闲置 15 分钟没入站就休眠，定时 ping 健康端点顶醒它。
# 公开仓库的 Actions 分钟数免费；每次只是一条 curl。若服务正巧在睡，这一下也会把它唤醒（最多等冷启动 ~60s）。
on:
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'   # 每 10 分钟（偏 5 分，避开整点；GitHub cron 有延迟，间隔实际略大于 10 分）
  workflow_dispatch:                      # 也可手动触发

# 验证服务地址走仓库 secret RENDER_PING_URL（不暴露在仓库里；可填 render 原址或 Cloudflare 代理子域）
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping verify service health endpoint
        env:
          PING_URL: ${{ secrets.RENDER_PING_URL }}
        run: |
          if [ -z "$PING_URL" ]; then echo "RENDER_PING_URL 未设置，跳过"; exit 0; fi
          code=$(curl -fsS -m 120 -o /dev/null -w '%{http_code}' "$PING_URL") || code=000
          echo "HTTP $code"
          test "$code" = "200"
