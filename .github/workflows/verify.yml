name: verify-leaderboard
# 每半小时验证排行榜上未验证的高分录像（确定性重放比对，挡作弊）
on:
  schedule:
    - cron: '3-59/5 * * * *'    # 每 5 分钟（从 :03 起，避开整点拥堵）；公开仓库 Actions 免费。作为 render 秒级验证的兜底，render 没了也每 5 分钟兜一次
  workflow_dispatch:            # 也可手动触发

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Replay-verify pending scores
        run: node verify.js
        env:
          API_BASE: https://api.dungeonraid.win
          VERIFY_SECRET: ${{ secrets.VERIFY_SECRET }}
